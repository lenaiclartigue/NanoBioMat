m{s,core}}V</annotation></semantics></math></span></div><div class=\"equation-line\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mfrac><mi>M</mi><msub><mi>M</mi><mi>S</mi></msub></mfrac><mo>=</mo><mfrac><mrow><mo>∫</mo><mi>V</mi><mtext> </mtext><mi>f</mi><mo stretchy=\"false\">(</mo><mi>V</mi><mo stretchy=\"false\">)</mo><mtext> </mtext><mi mathvariant=\"script\">L</mi><mtext> ⁣</mtext><mrow><mo fence=\"true\">(</mo><mfrac><mrow><msub><mi>M</mi><mrow><mi mathvariant=\"normal\">s</mi><mo separator=\"true\">,</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi></mrow></msub><mi>V</mi><msub><mi>μ</mi><mn>0</mn></msub><mi>H</mi></mrow><mrow><msub><mi>k</mi><mi mathvariant=\"normal\">B</mi></msub><mi>T</mi></mrow></mfrac><mo fence=\"true\">)</mo></mrow><mtext> </mtext><mi mathvariant=\"normal\">d</mi><mi>V</mi></mrow><mrow><mo>∫</mo><mi>V</mi><mtext> </mtext><mi>f</mi><mo stretchy=\"false\">(</mo><mi>V</mi><mo stretchy=\"false\">)</mo><mtext> </mtext><mi mathvariant=\"normal\">d</mi><mi>V</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\frac{M}{M_S}=\\frac{\\int V\\,f(V)\\,\\mathcal L\\!\\left(\\frac{M_{\\mathrm{s,core}}V\\mu_0H}{k_{\\mathrm B}T}\\right)\\,\\mathrm dV}{\\int V\\,f(V)\\,\\mathrm dV}</annotation></semantics></math></span></div>","zfc":"<div class=\"equation-line\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>τ</mi><mi>N</mi></msub><mo>≈</mo><msub><mi>τ</mi><mn>0</mn></msub><mi>exp</mi><mo>⁡</mo><mtext> ⁣</mtext><mrow><mo fence=\"true\">(</mo><mfrac><mrow><mi>K</mi><mi>V</mi></mrow><mrow><msub><mi>k</mi><mi mathvariant=\"normal\">B</mi></msub><mi>T</mi></mrow></mfrac><mo fence=\"true\">)</mo></mrow><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>τ</mi><mn>0</mn></msub><mo>=</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>9</mn></mrow></msup><mtext> </mtext><mi mathvariant=\"normal\">s</mi></mrow><annotation encoding=\"application/x-tex\">\\tau_N\\approx\\tau_0\\exp\\!\\left(\\frac{KV}{k_{\\mathrm B}T}\\right),\\qquad \\tau_0=10^{-9}\\,\\mathrm s</annotation></semantics></math></span></div><div class=\"equation-line\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>T</mi><mi>B</mi></msub><mo>≈</mo><mfrac><mrow><mi>K</mi><mi>V</mi></mrow><mrow><msub><mi>k</mi><mi mathvariant=\"normal\">B</mi></msub><mi>ln</mi><mo>⁡</mo><mo stretchy=\"false\">(</mo><msub><mi>t</mi><mi>m</mi></msub><mi mathvariant=\"normal\">/</mi><msub><mi>τ</mi><mn>0</mn></msub><mo stretchy=\"false\">)</mo></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">T_B\\approx\\frac{KV}{k_{\\mathrm B}\\ln(t_m/\\tau_0)}</annotation></semantics></math></span></div>"};
const NB_CONTEXT_EQUATIONS445={"L ≈ KScherrer λ / (β cos θ)": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>L</mi><mo>≈</mo><mfrac><mrow><msub><mi>K</mi><mtext>Scherrer</mtext></msub><mi>λ</mi></mrow><mrow><mi>β</mi><mi>cos</mi><mi>θ</mi></mrow></mfrac></mrow></math>", "τN ≈ τ0 exp(Keff V / kBT)": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msub><mi>τ</mi><mtext>N</mtext></msub><mo>≈</mo><msub><mi>τ</mi><mtext>0</mtext></msub><mi>exp</mi><mo>(</mo><mfrac><mrow><msub><mi>K</mi><mtext>eff</mtext></msub><mi>V</mi></mrow><mrow><msub><mi>k</mi><mtext>B</mtext></msub><mi>T</mi></mrow></mfrac><mo>)</mo></mrow></math>", "τB = 3ηVh / kBT": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msub><mi>τ</mi><mtext>B</mtext></msub><mo>=</mo><mfrac><mrow><mn>3</mn><mi>η</mi><msub><mi>V</mi><mtext>h</mtext></msub></mrow><mrow><msub><mi>k</mi><mtext>B</mtext></msub><mi>T</mi></mrow></mfrac></mrow></math>", "τN(TB) = tm": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msub><mi>τ</mi><mtext>N</mtext></msub><mo>(</mo><msub><mi>T</mi><mtext>B</mtext></msub><mo>)</mo><mo>=</mo><msub><mi>t</mi><mtext>m</mtext></msub></mrow></math>", "Ic = ½ Σ ci zi²": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msub><mi>I</mi><mtext>c</mtext></msub><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>c</mi><mtext>i</mtext></msub><msubsup><mi>z</mi><mi>i</mi><mn>2</mn></msubsup></mrow></math>", "dH = kBT / (3πηD)": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msub><mi>d</mi><mtext>H</mtext></msub><mo>=</mo><mfrac><mrow><msub><mi>k</mi><mtext>B</mtext></msub><mi>T</mi></mrow><mrow><mn>3</mn><mi>π</mi><mi>η</mi><mi>D</mi></mrow></mfrac></mrow></math>"};
const NB_CONTEXT={"blocks": {"fr": {"phases": "<div class=\"reference-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Phases et propriétés structurales\"><table class=\"reference-table\"><caption>Phases et propriétés structurales</caption><thead><tr><th scope=\"col\">Phase</th><th scope=\"col\">Formule</th><th scope=\"col\">Structure</th><th scope=\"col\">Maille / nm</th><th scope=\"col\">ρ / g·cm<sup>−3</sup></th><th scope=\"col\">Sites du fer</th><th scope=\"col\">Source</th></tr></thead><tbody><tr><th scope=\"row\">Magnétite</th><td>Fe<sub>3</sub>O<sub>4</sub></td><td>Spinelle inverse ; Fd3̅m</td><td>a = 0.83970(1)</td><td>5.175 (mesurée)</td><td>A : Fe³⁺ ; B : Fe²⁺ + Fe³⁺</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/magnetite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[1]</a></td></tr><tr><th scope=\"row\">Maghémite</th><td>γ-Fe<sub>2</sub>O<sub>3</sub></td><td>Spinelle lacunaire ; cubique ou surstructure tétragonale</td><td>a = 0.83515(22) (cubique)</td><td>4.860 (calculée)</td><td>A : Fe³⁺ ; B : Fe³⁺ + lacunes</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/maghemite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[2]</a> <a class=\"data-cite\" href=\"https://arxiv.org/abs/1005.2370\" target=\"_blank\" rel=\"noopener noreferrer\">[3]</a></td></tr><tr><th scope=\"row\">Hématite</th><td>α-Fe<sub>2</sub>O<sub>3</sub></td><td>Corindon ; R3̅c (axes hexagonaux)</td><td>a = 0.5038(2)<br>c = 1.3772(12)</td><td>5.26 (mesurée)</td><td>Fe³⁺ en coordination octaédrique</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/hematite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[4]</a></td></tr><tr><th scope=\"row\">Wüstite</th><td>Fe<sub>1−x</sub>O</td><td>Type NaCl déficitaire en fer ; Fm3̅m</td><td>a = 0.4296</td><td>5.88 (mesurée)</td><td>Fe surtout octaédrique ; défauts liés à x</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/wustite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[5]</a></td></tr><tr><th scope=\"row\">Goethite</th><td>α-FeOOH</td><td>Orthorhombique ; Pbnm</td><td>a = 0.4608<br>b = 0.9956<br>c = 0.30215</td><td>4.28(1) (mesurée)</td><td>Fe³⁺ octaédrique ; oxyhydroxyde</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/goethite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[6]</a></td></tr></tbody></table></div><p>Les valeurs décrivent les échantillons des fiches citées. La maille dépend de la composition et de la température. Les masses volumiques de la maghémite sont calculées ; les autres valeurs du tableau sont mesurées.</p><div class=\"reference-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Repères magnétiques des spinelles\"><table class=\"reference-table\"><caption>Repères magnétiques des spinelles</caption><thead><tr><th scope=\"col\">Grandeur et condition</th><th scope=\"col\">Magnétite</th><th scope=\"col\">Maghémite</th><th scope=\"col\">Source</th></tr></thead><tbody><tr><th scope=\"row\">Moment ionique idéal, limite 0 K</th><td>4 μ<sub>B</sub> / Fe<sub>3</sub>O<sub>4</sub></td><td>2.5 μ<sub>B</sub> / Fe<sub>2</sub>O<sub>3</sub></td><td><a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">[7]</a></td></tr><tr><th scope=\"row\">σ<sub>s</sub> · modèle ionique à 0 K</th><td>≈ 96.5 A·m<sup>2</sup>·kg<sup>−1</sup></td><td>≈ 87.4 A·m<sup>2</sup>·kg<sup>−1</sup></td><td>Calcul : μN<sub>A</sub>/M<sub>mol</sub> · <a class=\"data-cite\" href=\"https://physics.nist.gov/cuu/pdf/all.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[8]</a></td></tr><tr><th scope=\"row\">σ<sub>s</sub> · repère massif, température ambiante</th><td>≈ 92 A·m<sup>2</sup>·kg<sup>−1</sup></td><td>≈ 74 A·m<sup>2</sup>·kg<sup>−1</sup></td><td><a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">[7]</a></td></tr><tr><th scope=\"row\">M<sub>s</sub> = ρσ<sub>s</sub> · valeur calculée</th><td>≈ 476 kA·m<sup>−1</sup></td><td>≈ 360 kA·m<sup>−1</sup></td><td>ρ du tableau × σ<sub>s</sub></td></tr><tr><th scope=\"row\">|K<sub>1</sub>| · repères massifs</th><td>≈ 13.5 kJ·m<sup>−3</sup></td><td>≈ 4.6 kJ·m<sup>−3</sup></td><td><a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">[9]</a></td></tr><tr><th scope=\"row\">Ordre magnétique</th><td>Ferrimagnétique</td><td>Ferrimagnétique</td><td><a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">[7]</a></td></tr></tbody></table></div><p>Le moment de la maghémite vaut aussi 10/3 μ<sub>B</sub> par unité Fe₈/₃O₄. Le moment indiqué dépend de la formule chimique retenue. K₁ est cubique ; K<sub>eff</sub> décrit une barrière effective de nanoparticule. Les deux ne sont pas interchangeables.</p><p>L’hématite est un antiferromagnétique incliné au-dessus de la transition de Morin ; son faible moment ne correspond pas au ferrimagnétisme d’une spinelle. La wüstite devient antiferromagnétique à basse température. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.78.819.2\" target=\"_blank\" rel=\"noopener noreferrer\">[10]</a> <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.110.1333\" target=\"_blank\" rel=\"noopener noreferrer\">[11]</a></p><p>À 0 K, les valeurs du tableau sont des estimations ioniques idéales. À température ambiante, ce sont des repères de matériaux massifs. Une mesure de nanoparticules doit préciser la taille, la composition, la température, le champ et la masse de normalisation.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Publication de référence</h3><ul class=\"ref-list\"><li>Handbook of Mineralogy, Magnetite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/magnetite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Maghemite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/maghemite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>R. Grau-Crespo et al., Vacancy ordering and electronic structure of γ-Fe₂O₃ (maghemite), 2010. <a class=\"data-cite\" href=\"https://arxiv.org/abs/1005.2370\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Hematite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/hematite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Wüstite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/wustite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Goethite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/goethite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>C. B. de Boer, M. J. Dekkers, Geophys. J. Int. 2001, 144, 481–494. <a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1046/j.0956-540X.2000.01333.x</a></li><li>NIST, CODATA 2022, Fundamental Physical Constants. <a class=\"data-cite\" href=\"https://physics.nist.gov/cuu/pdf/all.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>P. García-Acevedo et al., Adv. Sci. 2023, 10, 2203397. <a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1002/advs.202203397</a></li><li>F. J. Morin, Phys. Rev. 1950, 78, 819–820. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.78.819.2\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1103/PhysRev.78.819.2</a></li><li>W. L. Roth, Phys. Rev. 1958, 110, 1333. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.110.1333\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1103/PhysRev.110.1333</a></li></ul></section><details class=\"study-box\"><summary>Repères thermodynamiques</summary><div class=\"reference-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Thermochimie des solides à 298.15 K\"><table class=\"reference-table\"><caption>Thermochimie des solides à 298.15 K</caption><thead><tr><th scope=\"col\">Phase</th><th scope=\"col\">M<sub>mol</sub> / g·mol<sup>−1</sup></th><th scope=\"col\">Δ<sub>f</sub>H° / kJ·mol<sup>−1</sup></th><th scope=\"col\">S° / J·mol<sup>−1</sup>·K<sup>−1</sup></th><th scope=\"col\">C°<sub>p,m</sub> / J·mol<sup>−1</sup>·K<sup>−1</sup></th><th scope=\"col\">Source</th></tr></thead><tbody><tr><th scope=\"row\">Fe<sub>3</sub>O<sub>4</sub></th><td>231.533</td><td>-1120.89</td><td>145.25</td><td>147.22</td><td><a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1309382&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">NIST</a></td></tr><tr><th scope=\"row\">α-Fe<sub>2</sub>O<sub>3</sub></th><td>159.688</td><td>-825.50</td><td>87.33</td><td>103.78</td><td><a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1317608&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">NIST</a></td></tr><tr><th scope=\"row\">FeO</th><td>71.844</td><td>-272.04</td><td>60.75</td><td>49.93</td><td><a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1345251&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">NIST</a></td></tr></tbody></table></div><p>S° et C°p,m sont calculés avec les coefficients de Shomate NIST à 298.15 K. Les valeurs thermodynamiques tabulées concernent FeO. Les données de l’hématite ne doivent pas être attribuées à la maghémite.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Publication de référence</h3><ul class=\"ref-list\"><li>M. W. Chase, NIST-JANAF Thermochemical Tables, J. Phys. Chem. Ref. Data, Monograph 9, 1998; NIST Chemistry WebBook, magnetite. <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1309382&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>M. W. Chase, NIST-JANAF Thermochemical Tables, J. Phys. Chem. Ref. Data, Monograph 9, 1998; NIST Chemistry WebBook, hematite. <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1317608&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>M. W. Chase, NIST-JANAF Thermochemical Tables, J. Phys. Chem. Ref. Data, Monograph 9, 1998; NIST Chemistry WebBook, FeO. <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1345251&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li></ul></section></details>", "units": "<div aria-label=\"Grandeurs magnétiques et conversions CGS → SI\" class=\"reference-table-wrap\" role=\"region\" tabindex=\"0\"><table class=\"reference-table\"><caption>Grandeurs magnétiques et conversions CGS → SI</caption><thead><tr><th scope=\"col\">Symbole</th><th scope=\"col\">Grandeur</th><th scope=\"col\">Unité SI</th><th scope=\"col\">Conversion</th></tr></thead><tbody><tr><th scope=\"row\">B</th><td>Induction magnétique</td><td>T</td><td>1 G = 10<sup>−4</sup> T</td></tr><tr><th scope=\"row\">H</th><td>Champ magnétique</td><td>A·m<sup>−1</sup></td><td>1 Oe ≈ 10<sup>3</sup>/(4π) A·m<sup>−1</sup></td></tr><tr><th scope=\"row\">μ</th><td>Moment magnétique</td><td>A·m<sup>2</sup></td><td>1 emu = 10<sup>−3</sup> A·m<sup>2</sup></td></tr><tr><th scope=\"row\">M</th><td>Aimantation volumique</td><td>A·m<sup>−1</sup></td><td>1 emu·cm<sup>−3</sup> = 10<sup>3</sup> A·m<sup>−1</sup></td></tr><tr><th scope=\"row\">σ</th><td>Aimantation massique</td><td>A·m<sup>2</sup>·kg<sup>−1</sup></td><td>1 emu·g<sup>−1</sup> = 1 A·m<sup>2</sup>·kg<sup>−1</sup></td></tr><tr><th scope=\"row\">J = μ<sub>0</sub>M</th><td>Polarisation magnétique</td><td>T</td><td>1 emu·cm<sup>−3</sup> pour M donne J ≈ 4π × 10<sup>−4</sup> T</td></tr><tr><th scope=\"row\">χ = M/H</th><td>Susceptibilité volumique, régime linéaire</td><td>1</td><td>χ<sub>SI</sub> ≈ 4πχ<sub>cgs</sub></td></tr><tr><th scope=\"row\">χ<sub>mass</sub></th><td>Susceptibilité massique</td><td>m<sup>3</sup>·kg<sup>−1</sup></td><td>1 cm<sup>3</sup>·g<sup>−1</sup> ≈ 4π × 10<sup>−3</sup> m<sup>3</sup>·kg<sup>−1</sup></td></tr><tr><th scope=\"row\">χ<sub>mol</sub></th><td>Susceptibilité molaire</td><td>m<sup>3</sup>·mol<sup>−1</sup></td><td>1 cm<sup>3</sup>·mol<sup>−1</sup> ≈ 4π × 10<sup>−6</sup> m<sup>3</sup>·mol<sup>−1</sup></td></tr><tr><th scope=\"row\">K, E/V</th><td>Densité d’énergie</td><td>J·m<sup>−3</sup></td><td>1 erg·cm<sup>−3</sup> = 0.1 J·m<sup>−3</sup></td></tr><tr><th scope=\"row\">A</th><td>Rigidité d’échange</td><td>J·m<sup>−1</sup></td><td>1 erg·cm<sup>−1</sup> = 10<sup>−5</sup> J·m<sup>−1</sup></td></tr><tr><th scope=\"row\">Φ</th><td>Flux magnétique</td><td>Wb</td><td>1 Mx = 10<sup>−8</sup> Wb</td></tr><tr><th scope=\"row\">N</th><td>Facteur démagnétisant</td><td>1</td><td>N<sub>SI</sub> = N<sub>cgs</sub>/(4π) si ΣN<sub>cgs</sub> = 4π</td></tr><tr><th scope=\"row\">ℱ</th><td>Force magnétomotrice</td><td>A</td><td>1 Gb ≈ 10/(4π) A</td></tr><tr><th scope=\"row\">4πM (CGS)</th><td>Convention historique pour l’aimantation</td><td>A·m<sup>−1</sup></td><td>1 G ≈ 10<sup>3</sup>/(4π) A·m<sup>−1</sup></td></tr><tr><th scope=\"row\">μ<sub>perm</sub></th><td>Perméabilité absolue</td><td>H·m<sup>−1</sup></td><td>1 (CGS) ≈ 4π × 10<sup>−7</sup> H·m<sup>−1</sup></td></tr><tr><th scope=\"row\">μ<sub>r</sub></th><td>Perméabilité relative</td><td>1</td><td>μ<sub>r,SI</sub> = μ<sub>CGS</sub></td></tr><tr><th scope=\"row\">j = μ<sub>0</sub>μ</th><td>Moment en convention de polarisation</td><td>Wb·m</td><td>1 emu ≈ 4π × 10<sup>−10</sup> Wb·m</td></tr><tr><th scope=\"row\">μ<sub>0</sub>σ</th><td>Polarisation massique</td><td>Wb·m·kg<sup>−1</sup></td><td>1 emu·g<sup>−1</sup> ≈ 4π × 10<sup>−7</sup> Wb·m·kg<sup>−1</sup></td></tr></tbody></table></div><p>B = μ<sub>0</sub>(H + M) ; M = μ/V ; σ = μ/m<sub>sample</sub> ; M = ρσ. Le symbole μ désigne ici un moment, pas une perméabilité. Un champ exprimé en teslas correspond souvent à μ₀H. Dans la matière, B et μ₀H ne sont pas identiques.</p><p>Les susceptibilités CGS utilisent la convention emu. Depuis 2019, μ₀ n’est plus une constante exacte ; les conversions contenant μ₀ sont données ici à la précision usuelle en magnétométrie.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Publication de référence</h3><ul class=\"ref-list\"><li>R. B. Goldfarb, F. R. Fickett, Units for Magnetic Properties, NBS Special Publication 696, 1985. <a class=\"data-cite\" href=\"https://doi.org/10.6028/NBS.SP.696\" rel=\"noopener noreferrer\" target=\"_blank\">Source</a></li><li>R. B. Goldfarb, Units for Magnetic Quantities, 2021, NIST. <a class=\"data-cite\" href=\"https://www.nist.gov/publications/units-magnetic-quantities\" rel=\"noopener noreferrer\" target=\"_blank\">Source</a></li><li>NIST, CODATA 2022, Fundamental Physical Constants. <a class=\"data-cite\" href=\"https://physics.nist.gov/cuu/pdf/all.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Source</a></li></ul></section><p>La notation emu dépend de la grandeur : 1 emu de moment vaut 1 erg/G. La ligne 4πM utilise la convention CGS de l’aimantation. Le symbole μ<sub>perm</sub> distingue ici la perméabilité du moment μ. Les conventions j et μ₀σ sont conservées pour lire les anciennes publications.</p>", "anisotropy": "<h3>K₁ et K effectif</h3><p>Pour une spinelle cubique, E/V = K₁(α₁²α₂² + α₂²α₃² + α₃²α₁²) + K₂α₁²α₂²α₃². Les αᵢ sont les cosinus directeurs du moment. Pour un modèle uniaxial, E/V = K sin²θ. Ces expressions ne décrivent pas la même symétrie.</p><p>Les valeurs |K₁| ≈ 13,5 kJ·m⁻³ pour la magnétite et ≈ 4,6 kJ·m⁻³ pour la maghémite sont des repères pour le matériau massif. La surface, la forme et les interactions modifient la barrière.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Publication de référence</h3><ul class=\"ref-list\"><li>P. García-Acevedo et al., Adv. Sci. 2023, 10, 2203397. <a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1002/advs.202203397</a></li><li>Z. Kąkol, J. M. Honig, Phys. Rev. B 1989, 40, 9090. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRevB.40.9090\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1103/PhysRevB.40.9090</a></li></ul></section>", "monodomain": "<h3>Longueurs caractéristiques</h3><p>ℓ<sub>ex</sub> = √[2A/(μ<sub>0</sub>M<sub>s</sub>²)]. Cette longueur compare échange et énergie démagnétisante. Pour une paroi de Bloch uniaxiale idéale, δ = π√(A/K). Le rayon monodomaine et le rayon de rotation cohérente dépendent aussi de la géométrie.</p><p>Un rayon de blocage doit préciser T, K, τ₀ et le temps de mesure. Ce n’est pas une constante propre à un oxyde.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Publication de référence</h3><ul class=\"ref-list\"><li>P. García-Acevedo et al., Adv. Sci. 2023, 10, 2203397. <a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1002/advs.202203397</a></li></ul></section><p><a href=\"https://math.nist.gov/~MDonahue/talks/mcsd20030916-exchange-a4.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">M. J. Donahue, NIST — Exchange length</a></p>"}, "en": {"phases": "<div class=\"reference-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Phases and structural properties\"><table class=\"reference-table\"><caption>Phases and structural properties</caption><thead><tr><th scope=\"col\">Phase</th><th scope=\"col\">Formula</th><th scope=\"col\">Structure</th><th scope=\"col\">Cell / nm</th><th scope=\"col\">ρ / g·cm<sup>−3</sup></th><th scope=\"col\">Iron sites</th><th scope=\"col\">Source</th></tr></thead><tbody><tr><th scope=\"row\">Magnetite</th><td>Fe<sub>3</sub>O<sub>4</sub></td><td>Inverse spinel; Fd3̅m</td><td>a = 0.83970(1)</td><td>5.175 (measured)</td><td>A: Fe³⁺; B: Fe²⁺ + Fe³⁺</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/magnetite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[1]</a></td></tr><tr><th scope=\"row\">Maghemite</th><td>γ-Fe<sub>2</sub>O<sub>3</sub></td><td>Vacancy spinel; cubic or tetragonal superstructure</td><td>a = 0.83515(22) (cubic)</td><td>4.860 (calculated)</td><td>A: Fe³⁺; B: Fe³⁺ + vacancies</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/maghemite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[2]</a> <a class=\"data-cite\" href=\"https://arxiv.org/abs/1005.2370\" target=\"_blank\" rel=\"noopener noreferrer\">[3]</a></td></tr><tr><th scope=\"row\">Hematite</th><td>α-Fe<sub>2</sub>O<sub>3</sub></td><td>Corundum; R3̅c (hexagonal axes)</td><td>a = 0.5038(2)<br>c = 1.3772(12)</td><td>5.26 (measured)</td><td>Octahedrally coordinated Fe³⁺</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/hematite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[4]</a></td></tr><tr><th scope=\"row\">Wüstite</th><td>Fe<sub>1−x</sub>O</td><td>Iron-deficient rocksalt; Fm3̅m</td><td>a = 0.4296</td><td>5.88 (measured)</td><td>Mainly octahedral Fe; defects depend on x</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/wustite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[5]</a></td></tr><tr><th scope=\"row\">Goethite</th><td>α-FeOOH</td><td>Orthorhombic; Pbnm</td><td>a = 0.4608<br>b = 0.9956<br>c = 0.30215</td><td>4.28(1) (measured)</td><td>Octahedral Fe³⁺; oxyhydroxide</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/goethite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[6]</a></td></tr></tbody></table></div><p>Values describe the samples in the cited records. Cell parameters depend on composition and temperature. The maghemite density is calculated; the other tabulated densities are measured.</p><div class=\"reference-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Magnetic reference values for spinels\"><table class=\"reference-table\"><caption>Magnetic reference values for spinels</caption><thead><tr><th scope=\"col\">Quantity and condition</th><th scope=\"col\">Magnetite</th><th scope=\"col\">Maghemite</th><th scope=\"col\">Source</th></tr></thead><tbody><tr><th scope=\"row\">Ideal ionic moment, 0 K limit</th><td>4 μ<sub>B</sub> / Fe<sub>3</sub>O<sub>4</sub></td><td>2.5 μ<sub>B</sub> / Fe<sub>2</sub>O<sub>3</sub></td><td><a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">[7]</a></td></tr><tr><th scope=\"row\">σ<sub>s</sub> · ionic model at 0 K</th><td>≈ 96.5 A·m<sup>2</sup>·kg<sup>−1</sup></td><td>≈ 87.4 A·m<sup>2</sup>·kg<sup>−1</sup></td><td>Calculated: μN<sub>A</sub>/M<sub>mol</sub> · <a class=\"data-cite\" href=\"https://physics.nist.gov/cuu/pdf/all.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[8]</a></td></tr><tr><th scope=\"row\">σ<sub>s</sub> · bulk reference, room temperature</th><td>≈ 92 A·m<sup>2</sup>·kg<sup>−1</sup></td><td>≈ 74 A·m<sup>2</sup>·kg<sup>−1</sup></td><td><a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">[7]</a></td></tr><tr><th scope=\"row\">M<sub>s</sub> = ρσ<sub>s</sub> · calculated value</th><td>≈ 476 kA·m<sup>−1</sup></td><td>≈ 360 kA·m<sup>−1</sup></td><td>Table density × σ<sub>s</sub></td></tr><tr><th scope=\"row\">|K<sub>1</sub>| · bulk reference magnitudes</th><td>≈ 13.5 kJ·m<sup>−3</sup></td><td>≈ 4.6 kJ·m<sup>−3</sup></td><td><a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">[9]</a></td></tr><tr><th scope=\"row\">Magnetic order</th><td>Ferrimagnetic</td><td>Ferrimagnetic</td><td><a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">[7]</a></td></tr></tbody></table></div><p>The maghemite moment also equals 10/3 μ<sub>B</sub> per Fe₈/₃O₄ unit. The stated moment depends on the selected chemical formula. K₁ is cubic; K<sub>eff</sub> describes an effective nanoparticle barrier. They are not interchangeable.</p><p>Hematite is a canted antiferromagnet above the Morin transition; its weak moment differs from spinel ferrimagnetism. Wüstite becomes antiferromagnetic at low temperature. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.78.819.2\" target=\"_blank\" rel=\"noopener noreferrer\">[10]</a> <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.110.1333\" target=\"_blank\" rel=\"noopener noreferrer\">[11]</a></p><p>At 0 K, tabulated values are ideal ionic estimates. At room temperature, they are bulk-material reference values. Nanoparticle measurements require size, composition, temperature, field and normalization mass.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Reference publication</h3><ul class=\"ref-list\"><li>Handbook of Mineralogy, Magnetite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/magnetite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Maghemite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/maghemite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>R. Grau-Crespo et al., Vacancy ordering and electronic structure of γ-Fe₂O₃ (maghemite), 2010. <a class=\"data-cite\" href=\"https://arxiv.org/abs/1005.2370\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Hematite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/hematite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Wüstite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/wustite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Goethite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/goethite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>C. B. de Boer, M. J. Dekkers, Geophys. J. Int. 2001, 144, 481–494. <a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1046/j.0956-540X.2000.01333.x</a></li><li>NIST, CODATA 2022, Fundamental Physical Constants. <a class=\"data-cite\" href=\"https://physics.nist.gov/cuu/pdf/all.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>P. García-Acevedo et al., Adv. Sci. 2023, 10, 2203397. <a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1002/advs.202203397</a></li><li>F. J. Morin, Phys. Rev. 1950, 78, 819–820. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.78.819.2\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1103/PhysRev.78.819.2</a></li><li>W. L. Roth, Phys. Rev. 1958, 110, 1333. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.110.1333\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1103/PhysRev.110.1333</a></li></ul></section><details class=\"study-box\"><summary>Thermodynamic reference values</summary><div class=\"reference-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Solid-state thermochemistry at 298.15 K\"><table class=\"reference-table\"><caption>Solid-state thermochemistry at 298.15 K</caption><thead><tr><th scope=\"col\">Phase</th><th scope=\"col\">M<sub>mol</sub> / g·mol<sup>−1</sup></th><th scope=\"col\">Δ<sub>f</sub>H° / kJ·mol<sup>−1</sup></th><th scope=\"col\">S° / J·mol<sup>−1</sup>·K<sup>−1</sup></th><th scope=\"col\">C°<sub>p,m</sub> / J·mol<sup>−1</sup>·K<sup>−1</sup></th><th scope=\"col\">Source</th></tr></thead><tbody><tr><th scope=\"row\">Fe<sub>3</sub>O<sub>4</sub></th><td>231.533</td><td>-1120.89</td><td>145.25</td><td>147.22</td><td><a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1309382&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">NIST</a></td></tr><tr><th scope=\"row\">α-Fe<sub>2</sub>O<sub>3</sub></th><td>159.688</td><td>-825.50</td><td>87.33</td><td>103.78</td><td><a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1317608&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">NIST</a></td></tr><tr><th scope=\"row\">FeO</th><td>71.844</td><td>-272.04</td><td>60.75</td><td>49.93</td><td><a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1345251&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">NIST</a></td></tr></tbody></table></div><p>S° and C°p,m are calculated from NIST Shomate coefficients at 298.15 K. The tabulated thermodynamic values concern FeO. Hematite data must not be assigned to maghemite.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Reference publication</h3><ul class=\"ref-list\"><li>M. W. Chase, NIST-JANAF Thermochemical Tables, J. Phys. Chem. Ref. Data, Monograph 9, 1998; NIST Chemistry WebBook, magnetite. <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1309382&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>M. W. Chase, NIST-JANAF Thermochemical Tables, J. Phys. Chem. Ref. Data, Monograph 9, 1998; NIST Chemistry WebBook, hematite. <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1317608&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>M. W. Chase, NIST-JANAF Thermochemical Tables, J. Phys. Chem. Ref. Data, Monograph 9, 1998; NIST Chemistry WebBook, FeO. <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1345251&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li></ul></section></details>", "units": "<div aria-label=\"Magnetic quantities and CGS → SI conversions\" class=\"reference-table-wrap\" role=\"region\" tabindex=\"0\"><table class=\"reference-table\"><caption>Magnetic quantities and CGS → SI conversions</caption><thead><tr><th scope=\"col\">Symbol</th><th scope=\"col\">Quantity</th><th scope=\"col\">SI unit</th><th scope=\"col\">Conversion</th></tr></thead><tbody><tr><th scope=\"row\">B</th><td>Magnetic flux density</td><td>T</td><td>1 G = 10<sup>−4</sup> T</td></tr><tr><th scope=\"row\">H</th><td>Magnetic field strength</td><td>A·m<sup>−1</sup></td><td>1 Oe ≈ 10<sup>3</sup>/(4π) A·m<sup>−1</sup></td></tr><tr><th scope=\"row\">μ</th><td>Magnetic moment</td><td>A·m<sup>2</sup></td><td>1 emu = 10<sup>−3</sup> A·m<sup>2</sup></td></tr><tr><th scope=\"row\">M</th><td>Volume magnetization</td><td>A·m<sup>−1</sup></td><td>1 emu·cm<sup>−3</sup> = 10<sup>3</sup> A·m<sup>−1</sup></td></tr><tr><th scope=\"row\">σ</th><td>Mass magnetization</td><td>A·m<sup>2</sup>·kg<sup>−1</sup></td><td>1 emu·g<sup>−1</sup> = 1 A·m<sup>2</sup>·kg<sup>−1</sup></td></tr><tr><th scope=\"row\">J = μ<sub>0</sub>M</th><td>Magnetic polarization</td><td>T</td><td>1 emu·cm<sup>−3</sup> for M gives J ≈ 4π × 10<sup>−4</sup> T</td></tr><tr><th scope=\"row\">χ = M/H</th><td>Volume susceptibility, linear regime</td><td>1</td><td>χ<sub>SI</sub> ≈ 4πχ<sub>cgs</sub></td></tr><tr><th scope=\"row\">χ<sub>mass</sub></th><td>Mass susceptibility</td><td>m<sup>3</sup>·kg<sup>−1</sup></td><td>1 cm<sup>3</sup>·g<sup>−1</sup> ≈ 4π × 10<sup>−3</sup> m<sup>3</sup>·kg<sup>−1</sup></td></tr><tr><th scope=\"row\">χ<sub>mol</sub></th><td>Molar susceptibility</td><td>m<sup>3</sup>·mol<sup>−1</sup></td><td>1 cm<sup>3</sup>·mol<sup>−1</sup> ≈ 4π × 10<sup>−6</sup> m<sup>3</sup>·mol<sup>−1</sup></td></tr><tr><th scope=\"row\">K, E/V</th><td>Energy density</td><td>J·m<sup>−3</sup></td><td>1 erg·cm<sup>−3</sup> = 0.1 J·m<sup>−3</sup></td></tr><tr><th scope=\"row\">A</th><td>Exchange stiffness</td><td>J·m<sup>−1</sup></td><td>1 erg·cm<sup>−1</sup> = 10<sup>−5</sup> J·m<sup>−1</sup></td></tr><tr><th scope=\"row\">Φ</th><td>Magnetic flux</td><td>Wb</td><td>1 Mx = 10<sup>−8</sup> Wb</td></tr><tr><th scope=\"row\">N</th><td>Demagnetizing factor</td><td>1</td><td>N<sub>SI</sub> = N<sub>cgs</sub>/(4π) if ΣN<sub>cgs</sub> = 4π</td></tr><tr><th scope=\"row\">ℱ</th><td>Magnetomotive force</td><td>A</td><td>1 Gb ≈ 10/(4π) A</td></tr><tr><th scope=\"row\">4πM (CGS)</th><td>Historical magnetization convention</td><td>A·m<sup>−1</sup></td><td>1 G ≈ 10<sup>3</sup>/(4π) A·m<sup>−1</sup></td></tr><tr><th scope=\"row\">μ<sub>perm</sub></th><td>Absolute permeability</td><td>H·m<sup>−1</sup></td><td>1 (CGS) ≈ 4π × 10<sup>−7</sup> H·m<sup>−1</sup></td></tr><tr><th scope=\"row\">μ<sub>r</sub></th><td>Relative permeability</td><td>1</td><td>μ<sub>r,SI</sub> = μ<sub>CGS</sub></td></tr><tr><th scope=\"row\">j = μ<sub>0</sub>μ</th><td>Moment in polarization convention</td><td>Wb·m</td><td>1 emu ≈ 4π × 10<sup>−10</sup> Wb·m</td></tr><tr><th scope=\"row\">μ<sub>0</sub>σ</th><td>Mass polarization</td><td>Wb·m·kg<sup>−1</sup></td><td>1 emu·g<sup>−1</sup> ≈ 4π × 10<sup>−7</sup> Wb·m·kg<sup>−1</sup></td></tr></tbody></table></div><p>B = μ<sub>0</sub>(H + M) ; M = μ/V ; σ = μ/m<sub>sample</sub> ; M = ρσ. Here μ denotes a moment, not permeability. A field expressed in teslas often means μ₀H. Inside matter, B and μ₀H are not identical.</p><p>CGS susceptibilities use the emu convention. Since 2019, μ₀ is no longer exact; conversions involving μ₀ are given here at practical magnetometry precision.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Reference publication</h3><ul class=\"ref-list\"><li>R. B. Goldfarb, F. R. Fickett, Units for Magnetic Properties, NBS Special Publication 696, 1985. <a class=\"data-cite\" href=\"https://doi.org/10.6028/NBS.SP.696\" rel=\"noopener noreferrer\" target=\"_blank\">Source</a></li><li>R. B. Goldfarb, Units for Magnetic Quantities, 2021, NIST. <a class=\"data-cite\" href=\"https://www.nist.gov/publications/units-magnetic-quantities\" rel=\"noopener noreferrer\" target=\"_blank\">Source</a></li><li>NIST, CODATA 2022, Fundamental Physical Constants. <a class=\"data-cite\" href=\"https://physics.nist.gov/cuu/pdf/all.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Source</a></li></ul></section><p>The emu notation depends on the quantity: 1 emu of moment equals 1 erg/G. The 4πM row uses the CGS magnetization convention. Here μ<sub>perm</sub> distinguishes permeability from moment μ. The j and μ₀σ conventions help interpret older publications.</p>", "anisotropy": "<h3>K₁ and effective K</h3><p>For a cubic spinel, E/V = K₁(α₁²α₂² + α₂²α₃² + α₃²α₁²) + K₂α₁²α₂²α₃². The αᵢ are direction cosines of the moment. For a uniaxial model, E/V = K sin²θ. These expressions describe different symmetries.</p><p>Bulk reference magnitudes are |K₁| ≈ 13.5 kJ·m⁻³ for magnetite and ≈ 4.6 kJ·m⁻³ for maghemite. Surface, shape and interactions modify the barrier.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Reference publication</h3><ul class=\"ref-list\"><li>P. García-Acevedo et al., Adv. Sci. 2023, 10, 2203397. <a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1002/advs.202203397</a></li><li>Z. Kąkol, J. M. Honig, Phys. Rev. B 1989, 40, 9090. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRevB.40.9090\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1103/PhysRevB.40.9090</a></li></ul></section>", "monodomain": "<h3>Characteristic lengths</h3><p>ℓ<sub>ex</sub> = √[2A/(μ<sub>0</sub>M<sub>s</sub>²)]. This length compares exchange and demagnetizing energies. For an ideal uniaxial Bloch wall, δ = π√(A/K). Single-domain and coherent-rotation radii also depend on geometry.</p><p>A blocking radius requires T, K, τ₀ and measurement time. It is not an oxide-specific constant.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Re function nbContextHTML(module,language){
 const fr=language==='fr',ix=fr?0:1,data=NB_CONTEXT,b=data.blocks[fr?'fr':'en'];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const ids=data.mapping[module]||[],records=ids.map(id=>data.records.find(r=>r.id===id)).filter(Boolean);
 let result=module==='phases'?'<p class="context-shortcut"><button type="button" data-reference-panel="oxides">'+(fr?'Consulter les propriétés des oxydes de fer':'View iron oxide data')+'</button></p>':(b[module]||'');
 if(module==='mh')result+='<p class="context-shortcut"><button type="button" data-reference-panel="units">'+(fr?'Consulter les unités magnétiques':'View magnetic units')+'</button></p>';
 if(records.length){let refs=[];result+='<details class="context-values"><summary>'+(fr?'Grandeurs et valeurs utiles':'Quantities and reference values')+'</summary><dl>'+records.map(r=>{refs.push(...r.references);return '<dt>'+esc(r.name[ix])+' · '+esc(r.symbol)+'</dt><dd>'+(NB_CONTEXT_EQUATIONS445[r.value]||esc(r.value))+' '+esc(r.unit)+'<br>'+esc(r.conditions[ix])+'</dd>'}).join('')+'</dl>';
 result+='<section class="ref-block"><h3 class="ref-heading">'+(fr?'Publication de référence':'Reference publication')+'</h3><ul>'+[...new Set(refs)].map(id=>{const r=data.references[id];return r?'<li><a href="'+esc(r[1])+'" target="_blank" rel="noopener noreferrer">'+esc(r[0])+'</a></li>':''}).join('')+'</ul></section></details>';}
 return result;
}
function nbInsertContext(module,language,before){
 if(!before?.parentNode?.insertBefore)return;
 const old=document.getElementById('context433');if(old&&old.remove)old.remove();
 const html=nbContextHTML(module,language);if(!html||!before)return;

}

let lang='fr',mode='swangle',index=0,phase=0,timer=null,loops=null,thermal=null;const $=id=>document.getElementById(id),tr=(fr,en)=>lang==='fr'?fr:en;const blue='#31579c',orange='#b1774b',green='#237e78';
function control(id,fr,en,min,max,value,step,unit){return `<label>${tr(fr,en)}<input id="${id}" type="range" min="${min}" max="${max}" value="${value}" step="${step}"><output id="${id}Value">${value} ${unit}</output></label>`}
const value=(id,def)=>$(id)?Number($(id).value):def;
function label(x,y,s,anchor='middle'){return `<text x="${x}" y="${y}" text-anchor="${anchor}">${s}</text>`}
function graph(series,xlim,ylim,xlabel,ylabel,marks=[]){const X=x=>75+(x-xlim[0])/(xlim[1]-xlim[0])*640,Y=y=>310-(y-ylim[0])/(ylim[1]-ylim[0])*270;let s='<svg viewBox="0 0 780 370" role="img" aria-label="'+xlabel+'; '+ylabel+'">';for(let i=0;i<=4;i++){const x=xlim[0]+i/4*(xlim[1]-xlim[0]),y=ylim[0]+i/4*(ylim[1]-ylim[0]);s+=`<path d="M${X(x)} 40V310M75 ${Y(y)}H715" fill="none" stroke="#e2e8ed"/>`+label(X(x),336,Number(x.toPrecision(3)))+label(65,Y(y)+5,Number(y.toPrecision(3)),'end')}
s+=`<path d="M75 ${Y(0)}H715M${X(0)} 40V310" stroke="#8199a7" fill="none"/>`+label(75,23,ylabel,'start')+label(715,363,xlabel,'end');for(const c of series)s+=`<path d="${c.data.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(2)+' '+Y(p.y).toFixed(2)).join(' ')}" fill="none" stroke="${c.color}" stroke-width="2.6" ${c.dash?'stroke-dasharray="7 5"':''}/>`;for(const p of marks)s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="${p.color||orange}"/>`+label(X(p.x)+(p.dx||0),Y(p.y)+(p.dy||-14),p.text||'');return s+'</svg>'}
function key(entries){$('legend').innerHTML=entries.map(([name,c])=>`<span style="--color:${c}">${name}</span>`).join('')}
function stop(){if(timer)clearInterval(timer);timer=null;$('play').textContent=tr('Lire','Play')}
function play(){if(timer){stop();return}if(index>=240)index=0;phase+=.15;draw();$('play').textContent='Pause';let ticks=0;timer=setInterval(()=>{phase+=.15;ticks++;if(!$('hold').checked&&ticks%3===0)index=Math.min(240,index+1);draw();if(index===240&&!$('hold').checked)stop()},75)}
function render(){stop();index=0;phase=0;document.documentElement.lang=lang;$('transport').hidden=mode!=='zfc';$('particles').innerHTML='';$('particleHint').textContent='';$('play').textContent=tr('Lire','Play');$('reset').textContent=tr('Recommencer','Restart');$('timeline').setAttribute('aria-label',tr('Température du protocole','Protocol temperature'));$('holdLabel').textContent=tr('Maintenir la température','Hold temperature');$('hold').checked=false;$('limitsTitle').textContent='';
if(mode==='swangle'){$('title').textContent=tr('Stoner–Wohlfarth : effet de l’angle','Stoner–Wohlfarth: the role of angle');$('lead').textContent=tr('Le champ fait un angle α avec l’axe facile. φ désigne l’angle entre le moment et le champ. Le curseur modifie la forme du cycle.','The field makes an angle α with the easy axis. φ is the angle between the moment and the field. The slider changes the loop shape.');$('controls').innerHTML=control('angle','Angle champ / axe facile α','Field / easy-axis angle α',0,90,0,1,'°');$('explain').textContent=tr('À 0°, le cycle est rectangulaire. À 90°, la rotation est réversible dans ce modèle idéal.','At 0°, the loop is rectangular. At 90°, rotation is reversible in this ideal model.');$('limits').textContent='';}
if(mode==='mh'){$('title').textContent=tr('Lire un cycle M(H)','Reading an M(H) loop');$('lead').textContent=tr('Le cycle ouvert conserve une rémanence. La réponse superparamagnétique à l’équilibre est réversible.','The open loop retains remanence. The equilibrium superparamagnetic response is reversible.');$('controls').innerHTML='<p>'+tr('Axes faciles aléatoires en 3D','Random 3D easy axes')+'</p>';$('explain').textContent=tr('MS est l’aimantation à saturation. MR est l’aimantation qui reste après retrait du champ saturant. HC est le champ inverse nécessaire pour annuler M. Le rapport MR/MS vaut 0,5 pour un ensemble SW uniaxial sans interactions et à axes aléatoires en 3D.','MS is saturation magnetization. MR is the magnetization remaining after removal of a saturating field. HC is the reverse field needed to bring M to zero. MR/MS equals 0.5 for noninteracting uniaxial SW particles with random 3D easy axes.');$('limits').textContent='';}
if(mode==='initial'){$('title').textContent=tr('Aimantation à l’équilibre : Langevin','Equilibrium magnetization: Langevin');$('lead').textContent=tr('Le champ croît depuis zéro. L’aimantation augmente puis approche asymptotiquement la saturation.','The field increases from zero. Magnetization rises and approaches saturation asymptotically.');$('controls').innerHTML=control('diameter','Diamètre médian','Median diameter',6,22,14,1,'nm')+control('width','Dispersion des tailles σln(d)','Size dispersion σln(d)',0,.3,.12,.02,'')+control('temp','Température','Temperature',100,350,300,10,'K');$('explain').textContent=tr('Le moment de chaque particule vaut μ = MS,cœur V. Une particule plus grande possède un moment plus élevé. Sa réponse se rapproche de la saturation à plus faible champ. La courbe moyenne tient compte de la distribution des volumes.','Each particle has moment μ = MS,core V. A larger particle has a larger moment. Its response approaches saturation at a lower field. The mean curve accounts for the volume distribution.');$('limits').textContent='';}
if(mode==='zfc'){$('title').textContent=tr('Superparamagnétisme et blocage — ZFC / FC','Superparamagnetism and blocking — ZFC / FC');$('lead').textContent=tr('Le moment collectif fluctue sous l’effet de l’agitation thermique. L’ordre ferrimagnétique interne subsiste. τN est le temps de relaxation du moment ; tm est le temps d’observation. Si τN ≪ tm, la particule est superparamagnétique à l’échelle de la mesure. Si τN ≫ tm, elle paraît bloquée. Les courbes ZFC/FC montrent les conséquences de ce blocage.','Thermal agitation makes the collective moment fluctuate. Internal ferrimagnetic order persists. τN is the moment relaxation time; tm is the observation time. If τN ≪ tm, the particle is superparamagnetic on the measurement timescale. If τN ≫ tm, it appears blocked. ZFC/FC curves show the consequences of blocking.');$('controls').innerHTML=`<label>${tr('Protocole','Protocol')}<select id="protocol"><option value="z">ZFC · ${tr('réchauffement','warming')}</option><option value="f">FC · ${tr('après refroidissement sous champ','after field cooling')}</option></select></label>`+control('diameter','Diamètre médian','Median diameter',10,16,14,1,'nm')+control('anis','Anisotropie K','Anisotropy K',5,25,20,1,'kJ/m³')+control('tm','Temps d’observation tm','Observation time tm',1,100,100,1,'s');$('explain').textContent=tr('ZFC : refroidissement sans champ, application d’un faible champ, puis réchauffement. Les moments initialement bloqués gardent des orientations désordonnées. Leur déblocage permet une réponse moyenne au champ. À plus haute température, l’agitation thermique réduit cette réponse. FC : refroidissement sous champ ; les grandes particules se bloquent d’abord et conservent une orientation statistiquement favorisée par le champ. Lors du réchauffement après ce refroidissement, le déblocage progressif et l’agitation thermique réduisent l’aimantation.','ZFC: zero-field cooling, application of a weak field, then warming. Initially blocked moments retain disordered orientations. Unblocking allows an average response to the field. At higher temperatures, thermal agitation reduces this response. FC: cooling in field; larger particles block first and retain a statistically field-biased orientation. On warming after field cooling, progressive unblocking and thermal agitation reduce magnetization.');$('limits').textContent='';}
if(mode==='swangle')$('explain').innerHTML+='<ol><li>'+tr('Particules monodomaines avec rotation cohérente','Single-domain particles with coherent rotation')+'</li><li>'+tr('Anisotropie uniaxiale','Uniaxial anisotropy')+'</li><li>'+tr('Sans interactions ; température nulle','No interactions; zero temperature')+'</li></ol>';const definitions={swangle:["MS est l’aimantation à saturation. MR est la rémanence après retrait d’un champ saturant. HC est le champ inverse qui annule M sur le cycle. HK = 2K/(μ₀MS) est le champ d’anisotropie.","MS is saturation magnetization. MR is remanence after removing a saturating field. HC is the reverse field at which M crosses zero on the loop. HK = 2K/(μ₀MS) is the anisotropy field."],zfc:["TB est défini ici par τN(TB) = tm. Une distribution de tailles produit une distribution de températures de blocage. Le maximum ZFC n’est donc pas une température de blocage unique. Ici, μ₀H = 0,1 mT. Le calcul emploie une approximation à barrière critique : chaque taille bascule à son TB. Dans une mesure réelle, ce passage est progressif et dépend aussi du balayage en température.","TB is defined here by τN(TB) = tm. A size distribution produces a distribution of blocking temperatures. The ZFC maximum is therefore not a single blocking temperature. Here, μ₀H = 0.1 mT. The calculation uses a critical-barrier approximation: each size switches at its TB. In a real measurement, this transition is gradual and also depends on the temperature sweep."],initial:["Langevin décrit ici des moments indépendants à l’équilibre, avec une anisotropie négligée. ξ = μμ₀H/(kBT) compare l’énergie du champ à l’agitation thermique. μ est le moment d’une particule. kB est la constante de Boltzmann. M/MS est une aimantation normalisée. Un système bloqué relève d’une autre description.","Langevin describes independent equilibrium moments here, with anisotropy neglected. ξ = μμ₀H/(kBT) compares field energy with thermal agitation. μ is one particle’s moment. kB is the Boltzmann constant. M/MS is normalized magnetization. A blocked system requires a different description."]};if(definitions[mode])$('explain').innerHTML+='<p>'+definitions[mode][lang==='fr'?0:1]+'</p>';$('equations').innerHTML=FORMULAS[mode];const referenceSets={swangle:[['E. C. Stoner, E. P. Wohlfarth, Phil. Trans. R. Soc. A 1948, 240, 599–642','https://doi.org/10.1098/rsta.1948.0007']],mh:[['E. C. Stoner, E. P. Wohlfarth, Phil. Trans. R. Soc. A 1948, 240, 599–642','https://doi.org/10.1098/rsta.1948.0007'],['C. P. Bean, J. Appl. Phys. 1955, 26, 1381–1383','https://doi.org/10.1063/1.1721912']],zfc:[['L. Néel, Ann. Géophys. 1949, 5, 99–136','https://hal.science/hal-03070532'],['C. P. Bean, J. Appl. Phys. 1955, 26, 1381–1383','https://doi.org/10.1063/1.1721912']],initial:[['K. M. Krishnan, IEEE Trans. Magn. 2010, 46, 2523–2558','https://doi.org/10.1109/TMAG.2010.2046907'],['C. P. Bean, J. Appl. Phys. 1955, 26, 1381–1383','https://doi.org/10.1063/1.1721912']]};referenceSets.zfc.push(['F. Tournus, A. Tamion, J. Magn. Magn. Mater. 2011, 323, 1118–1127','https://doi.org/10.1016/j.jmmm.2010.11.057'],['K. L. Livesey et al., Sci. Rep. 2018, 8, 11166','https://doi.org/10.1038/s41598-018-29501-8']);referenceSets.initial.unshift(["P. Langevin, J. Phys. Theor. Appl. 1905, 4, 678-693", "https://doi.org/10.1051/jphystap:019050040067800"]);for(const k of ['initial','zfc','mh'])referenceSets[k].push(["C. P. Bean, J. D. Livingston, Journal of Applied Physics 1959, 30, S120-S129", "https://doi.org/10.1063/1.2185850"]);$('limits').hidden=true;$('limitsTitle').hidden=true;$('sources').innerHTML='<p class="data-notes">kB = 1.380649 × 10<sup>−23</sup> J/K · <a href="https://physics.nist.gov/cuu/pdf/all.pdf" target="_blank" rel="noopener">NIST CODATA 2022</a></p><h3>'+tr('Publication de référence','Reference publication')+'</h3>'+referenceSets[mode].map(([label,url])=>`<p><a href="${url}" target="_blank" rel="noopener">${label}</a></p>`).join('');

(function(){
 const headings=/^(?:Reference publication?(?: and sources)?|Scientific references and HDR sources|Reference reviews|Publications? de référence|Synthèses de référence|Références scientifiques et sources HDR|Références et sources)$/i;
 const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function title(){return document.documentElement.lang==='fr'?'Publication de référence':'Reference publication'}
 function standardEntry(el){
  if(el.dataset.refFormatted||el.classList.contains('data-notes'))return;
  const anchors=[...el.querySelectorAll('a[href]')];if(anchors.length!==1)return;
  const a=anchors[0],url=a.href,stored=NB_REFERENCE_REGISTRY[url];
  if(!stored && !/\b(?:18|19|20)\d{2}\b/.test(el.textContent))return;
  const txt=el.textContent.trim();
  if(txt.length>700)return;
  const residue=el.textContent.replace(a.textContent,'').trim();
  const fallback=(!residue||/^[\s\[\]\d.,;]+$/.test(residue))?el.textContent.trim():residue;
  let citation=stored||escape(fallback).replace(/[.\s]+$/,'');
  if(!citation.includes('<strong>'))citation=citation.replace(/\b((?:18|19|20)\d{2})\b/, '<strong>$1</strong>');
  if(!citation.includes('<em>'))citation=citation.replace(/, ([^,<>]+) (<strong>(?:18|19|20)\d{2}<\/strong>),/, ', <em>$1</em> $2,');
  const label=url.startsWith('https://doi.org/')?'doi: '+url.slice(16):'Source';
  el.innerHTML=citation.replace(/[.\s]+$/,'')+'. <a href="'+escape(url)+'" target="_blank" rel="noopener noreferrer">'+escape(label)+'</a>.';
  el.dataset.refFormatted='1';el.classList.add('citation-entry');
 }
 function update(){
  document.querySelectorAll('h2,h3,h4,summary').forEach(h=>{
   if(!headings.test(h.textContent.trim()))return;
   h.textContent=title();h.classList.add('ref-heading');
   if(h.tagName==='SUMMARY'){h.parentElement.classList.add('ref-block');return;}
   if(h.parentElement.id==='sources'||h.parentElement.id==='references'||h.parentElement.classList.contains('study-references')||h.parentElement.classList.contains('ref-block'))h.parentElement.classList.add('ref-block');
  });
  document.querySelectorAll('#references,#sources,.study-references,.ref-block').forEach(el=>{
   el.classList.add('ref-block');
   el.querySelectorAll('ul').forEach(u=>u.classList.add('ref-list'));
   el.querySelectorAll('li').forEach(standardEntry);
   [...el.children].filter(n=>n.tagName==='P').forEach(standardEntry);
   const paragraphs=[...el.children].filter(n=>n.tagName==='P'&&n.dataset.refFormatted);
   if(paragraphs.length){const ul=document.createElement('ul');ul.className='ref-list';el.insertBefore(ul,paragraphs[0]);paragraphs.forEach(p=>{const li=document.createElement('li');li.innerHTML=p.innerHTML;li.className='citation-entry';li.dataset.refFormatted='1';ul.appendChild(li);p.remove();});}
  });
  document.querySelectorAll('.full-citation').forEach(el=>el.classList.add('citation-entry'));
 }
 window.nbNormalizeReferences=update;
 let queued=false;const observer=new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;observer.disconnect();update();observer.observe(document.body,{childList:true,subtree:true});});});
 function init(){update();observer.observe(document.body,{childList:true,subtree:true});}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script><script>
