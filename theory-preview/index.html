6\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"770.7\" y=\"141.6\">O</text><circle cx=\"624.1\" cy=\"97.9\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"624.1\" y=\"102.9\">O</text><circle cx=\"675.9\" cy=\"230.4\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"675.9\" y=\"235.4\">O</text><text fill=\"#243944\" font-size=\"21\" text-anchor=\"middle\" x=\"675\" y=\"48\">Site B · octaédrique</text><text fill=\"#243944\" font-size=\"17\" text-anchor=\"middle\" x=\"675\" y=\"330\">Fe–O ≈ 2.058 Å · 6 O</text></svg><p>Voisins oxygène et distances calculés à partir du CIF de la magnétite. Les polyèdres sont orientés pour être lisibles. <a class=\"data-cite\" href=\"https://qiserver.ugr.es/cod/9007644.html\" rel=\"noopener noreferrer\" target=\"_blank\">COD 9007644 · Fleet, 1981</a></p></details><details><summary>Symétrie, paramètres de maille et identification</summary><p>Magnétite : Fd3̅m, a = 8,3941 Å dans l’entrée <a class=\"data-cite\" href=\"https://qiserver.ugr.es/cod/9007644.html\" rel=\"noopener noreferrer\" target=\"_blank\">COD 9007644 · Fleet, 1981</a>. La maille conventionnelle contient 8 sites A, 16 sites B et 32 oxygènes.</p><p>Maghémite : l’entrée <a class=\"data-cite\" href=\"https://qiserver.ugr.es/cod/9017489.html\" rel=\"noopener noreferrer\" target=\"_blank\">COD 9017489 · Shmakov et al., 1995</a> décrit une structure cubique P4₃32 avec a = 8,3474 Å. L’ordre des lacunes peut conduire à d’autres symétries, notamment une superstructure tétragonale. Le modèle avec lacunes sur B est une référence idéale ; les nanocristaux peuvent s’en écarter.</p><p>Les principaux pics DRX des deux phases se recouvrent fortement. Le rapport Fe²⁺/Fe³⁺ est étudié par des mesures sensibles à l’état d’oxydation. Les valeurs de maille citées correspondent à ces entrées précises.</p><p>Fe₃O₄ : masse molaire 231,533 g/mol, donnée du <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1317619&amp;Units=SI\" rel=\"noopener noreferrer\" target=\"_blank\">NIST WebBook · CAS 1317-61-9</a>.</p></details></div>","<div class=\"text-module\"><h3>Two spinel-type oxides</h3><p>Oxygen surrounds two families of iron sites. A sites are tetrahedral: four oxygens surround the cation. B sites are octahedral: six oxygens surround it.</p><div class=\"phase-table\"><table><thead><tr><th>Ideal composition</th><th>Magnetite · Fe₃O₄</th><th>Maghemite · γ-Fe₂O₃</th></tr></thead><tbody><tr><th>A sites</th><td>Fe³⁺</td><td>Fe³⁺</td></tr><tr><th>B sites</th><td>Fe²⁺ + Fe³⁺</td><td>5/3 Fe³⁺ + 1/3 vacancy</td></tr><tr><th>Normalization</th><td>3 Fe per 4 O</td><td>8/3 Fe per 4 O</td></tr><tr><th>Ideal cation vacancies</th><td>None</td><td>1/6 of B sites</td></tr></tbody></table></div><p>Magnetite is an inverse spinel. At room temperature, B sites have mixed average valence. Fe²⁺/Fe³⁺ notation describes the charge balance. Oxidation towards maghemite removes Fe²⁺ and creates cation vacancies.</p><h3>From crystal structure to ferrimagnetism</h3><p>A and B sublattice moments oppose each other. They do not cancel. A net moment remains: this is ferrimagnetism. <a class=\"data-cite\" href=\"https://goldbook.iupac.org/terms/view/M03690\" rel=\"noopener noreferrer\" target=\"_blank\">IUPAC M03690</a></p><p>The collinear ionic model gives 4 μB per Fe₃O₄ for magnetite and 10/3 μB per Fe₈/₃O₄ for maghemite. These balances use high-spin Fe³⁺: 5 μB, and high-spin Fe²⁺: 4 μB. Measured magnetization also depends on temperature, defects and surfaces.</p><details><summary>View coordination from crystallographic coordinates</summary><svg aria-label=\"Iron coordination in magnetite\" role=\"img\" viewbox=\"0 0 900 390\" xmlns=\"http://www.w3.org/2000/svg\"><defs><radialgradient id=\"oxygenPhase\"><stop stop-color=\"#f8e2dd\"></stop><stop offset=\"1\" stop-color=\"#be6a5f\"></stop></radialgradient><radialgradient id=\"ironPhase\"><stop stop-color=\"#c6dceb\"></stop><stop offset=\"1\" stop-color=\"#31579c\"></stop></radialgradient></defs><path d=\"M201.7 281.9L145.7 138.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M201.7 281.9L304.3 180.5\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M201.7 281.9L248.3 139.1\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M145.7 138.6L304.3 180.5\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M145.7 138.6L248.3 139.1\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M304.3 180.5L248.3 139.1\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M225 185L201.7 281.9\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M225 185L145.7 138.6\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M225 185L304.3 180.5\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M225 185L248.3 139.1\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><circle cx=\"304.3\" cy=\"180.5\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"304.3\" y=\"185.5\">O</text><circle cx=\"145.7\" cy=\"138.6\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"145.7\" y=\"143.6\">O</text><circle cx=\"225.0\" cy=\"185.0\" fill=\"url(#ironPhase)\" r=\"22\"></circle><text fill=\"white\" font-size=\"14\" text-anchor=\"middle\" x=\"225.0\" y=\"190.0\">Fe</text><circle cx=\"201.7\" cy=\"281.9\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"201.7\" y=\"286.9\">O</text><circle cx=\"248.3\" cy=\"139.1\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"248.3\" y=\"144.1\">O</text><text fill=\"#243944\" font-size=\"21\" text-anchor=\"middle\" x=\"225\" y=\"48\">A site · tetrahedral</text><text fill=\"#243944\" font-size=\"17\" text-anchor=\"middle\" x=\"225\" y=\"330\">Fe–O ≈ 1.889 Å · 4 O</text><path d=\"M579.3 233.4L725.9 272.1\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M579.3 233.4L674.1 139.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M579.3 233.4L675.9 230.4\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M579.3 233.4L624.1 97.9\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M725.9 272.1L674.1 139.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M725.9 272.1L675.9 230.4\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M725.9 272.1L770.7 136.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M674.1 139.6L624.1 97.9\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M674.1 139.6L770.7 136.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M675.9 230.4L624.1 97.9\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M675.9 230.4L770.7 136.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M624.1 97.9L770.7 136.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M675 185L579.3 233.4\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M675 185L725.9 272.1\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M675 185L674.1 139.6\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M675 185L675.9 230.4\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M675 185L624.1 97.9\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M675 185L770.7 136.6\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><circle cx=\"674.1\" cy=\"139.6\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"674.1\" y=\"144.6\">O</text><circle cx=\"725.9\" cy=\"272.1\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"725.9\" y=\"277.1\">O</text><circle cx=\"579.3\" cy=\"233.4\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"579.3\" y=\"238.4\">O</text><circle cx=\"675.0\" cy=\"185.0\" fill=\"url(#ironPhase)\" r=\"22\"></circle><text fill=\"white\" font-size=\"14\" text-anchor=\"middle\" x=\"675.0\" y=\"190.0\">Fe</text><circle cx=\"770.7\" cy=\"136.6\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"770.7\" y=\"141.6\">O</text><circle cx=\"624.1\" cy=\"97.9\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"624.1\" y=\"102.9\">O</text><circle cx=\"675.9\" cy=\"230.4\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"675.9\" y=\"235.4\">O</text><text fill=\"#243944\" font-size=\"21\" text-anchor=\"middle\" x=\"675\" y=\"48\">B site · octahedral</text><text fill=\"#243944\" font-size=\"17\" text-anchor=\"middle\" x=\"675\" y=\"330\">Fe–O ≈ 2.058 Å · 6 O</text></svg><p>Oxygen neighbours and distances calculated from the magnetite CIF. Polyhedra are oriented for readability. <a class=\"data-cite\" href=\"https://qiserver.ugr.es/cod/9007644.html\" rel=\"noopener noreferrer\" target=\"_blank\">COD 9007644 · Fleet, 1981</a></p></details><details><summary>Symmetry, unit-cell parameters and identification</summary><p>Magnetite: Fd3̅m, a = 8.3941 Å in entry <a class=\"data-cite\" href=\"https://qiserver.ugr.es/cod/9007644.html\" rel=\"noopener noreferrer\" target=\"_blank\">COD 9007644 · Fleet, 1981</a>. The conventional cell contains 8 A sites, 16 B sites and 32 oxygens.</p><p>Maghemite: entry <a class=\"data-cite\" href=\"https://qiserver.ugr.es/cod/9017489.html\" rel=\"noopener noreferrer\" target=\"_blank\">COD 9017489 · Shmakov et al., 1995</a> describes a cubic P4₃32 structure with a = 8.3474 Å. Vacancy order can produce other symmetries, including a tetragonal superstructure. B-site vacancies define an ideal reference; nanocrystals can depart from it.</p><p>The main XRD peaks of both phases overlap strongly. Fe²⁺/Fe³⁺ ratios are studied using oxidation-state-sensitive measurements. The quoted unit-cell values refer to these specific entries.</p><p>Fe₃O₄: molar mass 231.533 g/mol, from <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1317619&amp;Units=SI\" rel=\"noopener noreferrer\" target=\"_blank\">NIST WebBook · CAS 1317-61-9</a>.</p></details></div>"]},"monodomain":{"a":0,"kind":"domain","static":false,"n":["Particule monodomaine","Single-domain particle"],"lead":["Un moment magnétique décrit l’intensité et la direction de la réponse magnétique d’un objet. L’aimantation M est le moment total par unité de volume. Une particule monodomaine ne contient pas de paroi interne.","A magnetic moment describes the strength and direction of an object’s magnetic response. Magnetization M is the total moment per unit volume. A single-domain particle has no internal domain wall."],"steps":[["Domaines","Domains","Une paroi sépare deux domaines. Chaque domaine possède une direction d’aimantation.","A wall separates two domains. Each domain has a magnetization direction."],["Déplacement de paroi","Domain-wall displacement","Le déplacement de la paroi modifie les volumes des domaines.","Wall displacement changes the domain volumes."],["Monodomaine","Single domain","Une particule monodomaine ne contient pas de paroi interne.","A single-domain particle has no internal domain wall."]],"refs":["frenkel","kittel"],"limits":["",""],"notes":["M et H s’expriment en A/m. Le champ interne peut différer du champ appliqué à cause du champ démagnétisant. B = μ₀(H + M) utilise le champ interne. μ₀H s’exprime en teslas.","M and H are expressed in A/m. The internal field can differ from the applied field because of demagnetization. B = μ₀(H + M) uses the internal field. μ₀H is expressed in teslas."]},"macrospin":{"a":0,"n":["Rotation cohérente et spin géant","Coherent rotation and giant spin"],"kind":"spin","src":"hdr-macrospin","refs":["neelferrite1948","frenkel","sw"],"lead":["La magnétite et la maghémite sont ferrimagnétiques. Leurs sous-réseaux portent des moments opposés qui ne se compensent pas. Dans l’approximation de rotation cohérente, leur moment résultant tourne comme un seul vecteur.","Magnetite and maghemite are ferrimagnetic. Their sublattices carry opposing moments that do not cancel. In the coherent-rotation approximation, their net moment rotates as a single vector."],"steps":[["Rotation cohérente","Coherent rotation","Les moments de chaque sous-réseau tournent ensemble. Les deux sous-réseaux restent opposés dans cette représentation ferrimagnétique.","Moments in each sublattice rotate together. The two sublattices remain antiparallel in this ferrimagnetic representation."],["Moment résultant","Net moment","La somme vectorielle tourne avec les moments internes. Sa norme est supposée constante.","The vector sum rotates with the internal moments. Its magnitude is assumed constant."],["Spin géant","Giant spin","Une seule flèche représente désormais la nanoparticule. Cette approximation sera utilisée pour l’anisotropie et les relaxations.","One arrow now represents the nanoparticle. This approximation will be used for anisotropy and relaxation."]],"limits":["",""]},"anisotropy":{"a":0,"n":["Anisotropie magnétique","Magnetic anisotropy"],"kind":"anisotropy","src":"02-anisotropie","refs":["sw","muscas2022","garcia2023","cheon2011"],"lead":["L’axe facile correspond aux minima du potentiel. Une direction perpendiculaire correspond à son maximum dans le modèle uniaxial à champ nul.","The easy axis corresponds to potential minima. A perpendicular direction corresponds to its maximum in the zero-field uniaxial model."],"steps":[["Minimum","Minimum","À champ nul, les deux directions de l’axe facile ont la même énergie.","At zero field, both directions along the easy axis have the same energy."],["Barrière","Barrier","La barrière vaut ΔE = KV. K est une densité d’énergie, en J/m³. V est le volume magnétique, en m³. La structure cristalline, la forme et la surface contribuent à l’anisotropie effective.","The barrier is ΔE = KV. K is an energy density in J/m³. V is the magnetic volume in m³. Crystal structure, shape and surface contribute to effective anisotropy."],["Autre minimum","Other minimum","Le moment atteint l’autre direction de l’axe facile. Son énergie retrouve un minimum.","The moment reaches the other easy-axis direction. Its energy returns to a minimum."]],"limits":["",""],"mainBody":["<div class=\"text-module\"><h3>Origines de l’anisotropie</h3><p>L’énergie magnétique dépend de l’orientation du moment. Plusieurs contributions interviennent dans les IONPs.</p><div class=\"phase-table\"><table><thead><tr><th>Contribution</th><th>Origine</th><th>Pertinence pour les IONPs</th></tr></thead><tbody><tr><th>Magnétocristalline</th><td>Le réseau cristallin impose des directions privilégiées.</td><td>Elle dépend de la phase et de la température.</td></tr><tr><th>De forme</th><td>La géométrie modifie le champ démagnétisant.</td><td>Elle intervient pour les particules allongées ou aplaties. Une sphère idéale n’a pas d’axe privilégié par cette contribution.</td></tr><tr><th>De surface et d’interface</th><td>L’environnement des ions diffère de celui du cœur.</td><td>La contribution peut devenir importante dans les petites IONPs.</td></tr><tr><th>Magnétoélastique</th><td>Les contraintes déforment le réseau cristallin.</td><td>Elle intervient lorsque les déformations sont significatives.</td></tr></tbody></table></div><h3>Origine et symétrie</h3><p>Uniaxiale et cubique décrivent une symétrie. Magnétocristalline et de forme décrivent une origine. Le schéma présente un modèle uniaxial.</p><h3>Anisotropie effective</h3><p>K<sub>eff</sub> décrit la barrière dans le modèle choisi. Ce paramètre n’est pas toujours la somme de constantes indépendantes. Les interactions dipolaires peuvent modifier sa valeur déduite des mesures.</p><h3>Couplage d’échange</h3><p>L’échange couple les moments de régions voisines. Dans un cœur–coquille, il peut modifier le retournement collectif. Il ne se réduit pas à une constante d’anisotropie supplémentaire.</p></div>","<div class=\"text-module\"><h3>Origins of anisotropy</h3><p>Magnetic energy depends on moment orientation. Several contributions act in IONPs.</p><div class=\"phase-table\"><table><thead><tr><th>Contribution</th><th>Origin</th><th>Relevance to IONPs</th></tr></thead><tbody><tr><th>Magnetocrystalline</th><td>The crystal lattice defines preferred directions.</td><td>It depends on phase and temperature.</td></tr><tr><th>Shape</th><td>Geometry changes the demagnetizing field.</td><td>It matters for elongated or flattened particles. An ideal sphere has no preferred axis from this contribution.</td></tr><tr><th>Surface and interface</th><td>The ionic environment differs from the core.</td><td>The contribution can become important in small IONPs.</td></tr><tr><th>Magnetoelastic</th><td>Stress deforms the crystal lattice.</td><td>It matters when strain is significant.</td></tr></tbody></table></div><h3>Origin and symmetry</h3><p>Uniaxial and cubic describe symmetry. Magnetocrystalline and shape describe origin. The diagram shows a uniaxial model.</p><h3>Effective anisotropy</h3><p>K<sub>eff</sub> describes the barrier in the selected model. It is not always a sum of independent constants. Dipolar interactions can change its value inferred from measurements.</p><h3>Exchange coupling</h3><p>Exchange couples moments in neighbouring regions. In a core–shell particle, it can change collective reversal. It is not simply an additional anisotropy constant.</p></div>"]},"swangle":{"a":0,"kind":"curves","mode":"swangle","n":["Stoner–Wohlfarth : angle","Stoner–Wohlfarth: angle"],"limits":["",""],"lead":["Le cycle dépend de l’angle entre le champ et l’axe facile. Le modèle décrit une rotation cohérente, sans interactions ni agitation thermique.","The loop depends on the angle between the field and easy axis. The model describes coherent rotation without interactions or thermal fluctuations."]},"relax":{"a":0,"n":["Relaxations de Néel et brownienne","Néel and Brownian relaxation"],"kind":"relax","src":"04-relaxations","refs":["neel","bean","brown","heat"],"lead":["Le moment peut se réorienter dans la particule ou avec elle.","The moment can reorient within the particle or with it."],"steps":[["Néel","Néel","Le moment se retourne dans la particule. Le corps reste fixe. L’agitation thermique permet de franchir la barrière d’anisotropie. Le temps caractéristique est τN.","The moment reverses within the particle. Its body stays fixed. Thermal fluctuations enable crossing of the anisotropy barrier. The characteristic time is τN."],["Rotation brownienne","Brownian rotation","La particule tourne dans le liquide. Le moment reste ici attaché à son axe facile. Le temps τB dépend de la viscosité et du volume hydrodynamique. Brown (1963) décrit les fluctuations internes ; Rosensweig (2002) présente les deux mécanismes de relaxation.","The particle rotates in the liquid. Its moment remains attached to its easy axis here. The time τB depends on viscosity and hydrodynamic volume. Brown (1963) describes internal fluctuations; Rosensweig (2002) presents both relaxation mechanisms."],["Immobilisation","Immobilization","Immobiliser la particule supprime la rotation brownienne, mais pas nécessairement les retournements de Néel.","Immobilizing the particle suppresses Brownian rotation, but not necessarily Néel reversals."]],"limits":["",""],"notes":["La forme exponentielle de τN concerne ici une barrière uniaxiale élevée, à champ nul. τ₀ est un paramètre du modèle. Le temps brownien utilise le volume hydrodynamique, et non celui du cœur seul.","The exponential form of τN describes a high uniaxial barrier at zero field here. τ₀ is a model parameter. Brownian time uses hydrodynamic volume, not core volume alone."]},"zfc":{"a":0,"n":["Superparamagnétisme et blocage — ZFC / FC","Superparamagnetism and blocking — ZFC / FC"],"kind":"curves","mode":"zfc","limits":["",""],"lead":["Le blocage dépend du temps de relaxation et du temps d’observation. Les protocoles ZFC et FC rendent cette dépendance visible.","Blocking depends on relaxation time and observation time. ZFC and FC protocols reveal this dependence."]},"mh":{"a":0,"n":["Lire un cycle M(H)","Reading an M(H) loop"],"kind":"curves","mode":"mh","limits":["",""],"lead":["La saturation, la rémanence et la coercivité décrivent des aspects distincts du cycle. Une réponse superparamagnétique à l’équilibre est réversible.","Saturation, remanence and coercivity describe different features of the loop. An equilibrium superparamagnetic response is reversible."]},"initial":{"a":0,"n":["Aimantation à l’équilibre : Langevin","Equilibrium magnetization: Langevin"],"kind":"curves","mode":"initial","limits":["",""],"lead":["Le champ favorise certaines orientations des moments. La fonction de Langevin décrit ici des moments indépendants à l’équilibre, avec une anisotropie négligée.","The field favours some moment orientations. Here the Langevin function describes independent equilibrium moments with negligible anisotropy."]},"interactions":{"a":1,"n":["Interactions entre particules","Interparticle interactions"],"kind":"dipole","src":"03-interactions","refs":["morup2010","multi","bertuit2022","cheon2011"],"lead":["Partez de particules isolées. Rapprochez-les pour renforcer le couplage dipolaire. Au contact magnétique direct, un échange ferromagnétique est représenté.","Start with isolated particles. Bring them closer to strengthen dipolar coupling. Ferromagnetic exchange is represented at direct magnetic contact."],"steps":[["Distance et corrélations","Distance and correlations","Les moments fluctuent en continu. Le voisin modifie leur énergie d’orientation. Au contact direct des cœurs, un échange ferromagnétique est imposé ici.","The moments fluctuate continuously. The neighbour changes their orientation energy. Ferromagnetic exchange is imposed here at direct core contact."]],"limits":["",""],"auto":true,"static":true,"notes":["La distance r relie les centres. Le couplage dipolaire dépend aussi de l’orientation des moments. Il peut favoriser ou contrarier leur alignement. L’échange exige un chemin de couplage entre sites magnétiques. Ici, J > 0 impose un échange ferromagnétique au contact direct. Dans les particules cœur–coquille de Lee et al., l’échange relie une phase dure et une phase douce au sein du même objet. Il ajuste leur réponse magnétique. Cet exemple se distingue du rapprochement de deux particules séparées.","Distance r joins the centres. Dipolar coupling also depends on moment orientation. It can favour or oppose alignment. Exchange requires a coupling pathway between magnetic sites. Here, J > 0 imposes ferromagnetic exchange at direct contact. In the core–shell particles of Lee et al., exchange couples a hard phase to a soft phase within the same object. It tunes their magnetic response. This differs from bringing two separate particles closer together."],"reviews":["krishnan2010"]},"rem":{"a":1,"kind":"delta","static":true,"n":["Couplage magnétique · ΔM","Magnetic coupling · ΔM"],"lead":["ΔM compare deux courbes de rémanence à une référence sans interactions.","ΔM compares two remanence curves with a noninteracting reference."],"steps":[["Interpréter le signe","Interpreting the sign","Dans le cadre uniaxial de Wohlfarth, ΔM > 0 indique une tendance magnétisante ; ΔM < 0 indique une tendance démagnétisante. Le signe ne détermine pas à lui seul la nature de l’échange. Une anisotropie cubique peut produire un ΔM positif sans interactions.","Within the uniaxial Wohlfarth framework, ΔM > 0 indicates a magnetizing tendency; ΔM < 0 indicates a demagnetizing tendency. The sign alone does not identify the exchange mechanism. Cubic anisotropy can produce positive ΔM without interactions."]],"refs":["wohlfarth1958","henkel1964","kelly1989","harrell1993","garciaotero2000"],"limits":["",""],"notes":["IRM signifie aimantation rémanente isotherme ; DCD désigne la désaimantation par champ continu inverse. Les mesures sont réalisées à champ nul après chaque impulsion. mIRM et mDCD sont divisées par la même rémanence à saturation. La référence de Wohlfarth concerne des particules uniaxiales sans interactions et une activation thermique négligeable.","IRM means isothermal remanent magnetization; DCD means direct-current demagnetization. Measurements are made at zero field after each pulse. mIRM and mDCD are divided by the same saturation remanence. The Wohlfarth reference concerns noninteracting uniaxial particles with negligible thermal activation."]},"forc":{"a":1,"n":["Lire un diagramme FORC","Reading a FORC diagram"],"kind":"reading","static":true,"body":["<div id=\"forc443\"></div>","<div id=\"forc443\"></div>"],"lead":["La carte sépare deux coordonnées : champ de commutation et champ de biais. Modifiez la distribution pour comprendre leur rôle.","The map separates two coordinates: switching field and bias field. Change the distribution to understand their roles."],"refs":["pike443","roberts443"],"steps":[]},"corona":{"a":2,"n":["Couronne protéique","Protein corona"],"kind":"corona","src":"12-corona","refs":["vroman1969","cedervall2007","lundqvist2008","corona","ashby2014","tenzer2013","chen2017","jacqmarcq2024","leitner2021","bychkova2022","equilibriumIUPAC","stepien2018"],"lead":["Une IONP acquiert une couronne biomoléculaire dans le plasma. Cette couronne évolue avant la rencontre cellulaire.","An IONP acquires a biomolecular corona in plasma. This corona evolves before cell encounter."],"steps":[["Injection","Injection","Les nanoparticules entrent dans le sang. Elles rencontrent les protéines du plasma.","Nanoparticles enter the bloodstream. They encounter plasma proteins."],["Adsorption des protéines","Protein adsorption","Les protéines diffusent vers la surface et s’y adsorbent. Une couronne se forme.","Proteins diffuse towards the surface and adsorb. A corona forms."],["Échanges · effet Vroman","Exchange · Vroman effect","Des protéines déjà adsorbées peuvent être remplacées par d’autres. L’effet Vroman décrit une évolution compétitive de la couche adsorbée. L’abondance, les interactions avec la surface et les vitesses d’échange contribuent à cette évolution.","Previously adsorbed proteins can be displaced by others. The Vroman effect describes competitive evolution of the adsorbed layer. Abundance, surface interactions and exchange rates contribute to this evolution."],["Interaction cellulaire","Cell interaction","La cellule rencontre la couronne protéique. Cette identité biologique influence la reconnaissance et l’entrée cellulaire.","The cell encounters the protein corona. This biological identity influences recognition and cell entry."]],"limits":["",""],"reviews":["mahmoudi2011"],"notes":["L’affinité décrit l’équilibre de liaison. Les vitesses d’adsorption et de désorption règlent les échanges. Le revêtement, la taille et le milieu modifient la couronne. Le remplacement de type Vroman dépend du couple surface–protéines. Tenzer et al. observent surtout des variations de quantité des protéines détectées sur la silice et le polystyrène.  Ashby et al. distinguent des protéines à échange rapide ou lent sur des IONPs.","Affinity describes binding equilibrium. Adsorption and desorption rates govern exchange. Coating, size and medium affect the corona. Vroman-type replacement depends on the surface–protein pair. Tenzer et al. mainly observe changes in the amounts of proteins detected on silica and polystyrene.  Ashby et al. distinguish fast- and slow-exchanging proteins on IONPs."]},"fate":{"a":2,"n":["Devenir intracellulaire","Intracellular fate"],"kind":"fate","src":"13-endolysosomes","refs":["fate","volatron2017","bugg2026","rink","membrane","chithrani2006","champion2006","portilla2022","raynal2004","mazuel2016","stepien2018"],"lead":["Les nanoparticules entrent dans les cellules par endocytose. Elles peuvent rejoindre les compartiments lysosomaux.","Nanoparticles enter cells through endocytosis. They can reach lysosomal compartments."],"steps":[["Contact membranaire","Membrane contact","Les nanoparticules portant une couronne rencontrent la membrane.","Corona-coated nanoparticles encounter the membrane."],["Invagination et internalisation","Invagination and internalization","La membrane enveloppe les nanoparticules. La vésicule se détache.","The membrane envelops the nanoparticles. The vesicle separates."],["Endosome précoce","Early endosome","Les nanoparticules restent dans la lumière du compartiment endosomal.","Nanoparticles remain in the lumen of the endosomal compartment."],["Endosome tardif","Late endosome","Le compartiment mûrit et s’acidifie. Les nanoparticules restent confinées.","The compartment matures and acidifies. Nanoparticles remain confined."],["Compartiment endolysosomal","Endolysosomal compartment","L’endosome tardif fusionne avec un lysosome. Dans le système étudié par Lartigue et al. (2013), les nanocubes se redistribuent vers la périphérie.","The late endosome fuses with a lysosome. In the system studied by Lartigue et al. (2013), nanocubes redistribute towards the periphery."],["Dégradation et stockage du fer","Degradation and iron storage","Les IONPs se dissolvent et libèrent du fer. Des cages initialement vides, les apoferritines, peuvent stocker ce fer dans un cœur minéral : elles deviennent des ferritines chargées. Volatron et al. (2017) montrent ce stockage en milieu mimant le lysosome. Le zoom illustre les étapes chimiques, sans imposer un trajet subcellulaire direct.","IONPs dissolve and release iron. Initially empty cages, apoferritins, can store this iron in a mineral core and become iron-loaded ferritins. Volatron et al. (2017) demonstrate this storage in a lysosome-like medium. The zoom illustrates chemical steps without prescribing a direct subcellular route."]],"limits":["",""],"notes":["La taille hydrodynamique, la forme, le revêtement et la couronne influencent l’adhésion et l’internalisation. Leur effet dépend du type cellulaire et du milieu. Chithrani étudie des nanoparticules d’or ; Champion étudie la phagocytose de particules modèles.  Sur des IONPs de même taille de cœur, Portilla et al. montrent que l’effet du revêtement sur le trafic endolysosomal dépend du type cellulaire.","Hydrodynamic size, shape, coating and corona influence adhesion and internalization. Their effects depend on cell type and medium. Chithrani studies gold nanoparticles; Champion studies phagocytosis of model particles.  For IONPs with the same core size, Portilla et al. show that the coating effect on endolysosomal trafficking depends on cell type."]},"response":{"a":2,"kind":"reading","static":true,"n":["Réponses cellulaires aux nanoparticules","Cellular responses to nanoparticles"],"lead":["La réponse dépend de la particule, de la dose, du temps et du système biologique.","Responses depend on the particle, dose, time and biological system."],"body":["<div class=\"reading-overview\"><section><h3>Particule et exposition</h3><p>La taille, la forme, le revêtement et la couronne influencent le contact et l’entrée cellulaire. La réponse dépend aussi de la dose, du temps et du type de cellule.</p></section><section><h3>Fer et stress oxydant</h3><p>La cellule peut stocker le fer et renforcer ses défenses. Le fer réactif peut aussi participer à la réaction de Fenton. La réactivité dépend de la spéciation et de l’accessibilité du fer.</p></section><section><h3>Réponse biologique</h3><p>L’adaptation, l’inflammation et la mort cellulaire sont des réponses distinctes. L’étude de la ferroptose associe peroxydation lipidique et contrôles spécifiques.</p></section></div>","<div class=\"reading-overview\"><section><h3>Particle and exposure</h3><p>Size, shape, coating and corona influence cell contact and uptake. Responses also depend on dose, time and cell type.</p></section><section><h3>Iron and oxidative stress</h3><p>Cells can store iron and strengthen their defences. Reactive iron can also participate in the Fenton reaction. Reactivity depends on iron speciation and accessibility.</p></section><section><h3>Biological response</h3><p>Adaptation, inflammation and cell death are distinct responses. Ferroptosis studies combine lipid peroxidation measurements with specific controls.</p></section></div>"],"steps":[],"refs":["chithrani2006","champion2006","salvati","ashby2014","itoh1997","fenton1894","dixon2012","yang2014","zanganeh2016","chen2017","hirsch2013","portilla2022","portilla2021","francia2019","aliyandi2021"],"limits":["",""],"extendedBody":["<div class=\"text-module\"><h3>Taille, forme et charge de surface</h3><p>La cellule rencontre une particule avec son revêtement, sa couronne et ses agrégats éventuels. La taille du cœur et la taille hydrodynamique décrivent donc des objets différents.</p><ul><li><strong>Taille.</strong> Elle influence le contact membranaire, l’internalisation et le devenir intracellulaire. À masse égale, le nombre de particules et la surface exposée varient avec leur taille.</li><li><strong>Forme.</strong> La courbure locale et l’orientation au contact modifient l’enveloppement membranaire. Une sphère, un bâtonnet et un assemblage ne présentent pas la même interface.</li><li><strong>Charge.</strong> Elle influence les interactions avec les protéines et la membrane. Le potentiel zêta dépend du pH, des ions et du milieu. La couronne peut modifier la charge apparente et masquer des ligands.</li></ul><p>Ces paramètres agissent ensemble. Leur effet sur les ROS, l’inflammation ou la viabilité dépend aussi de la dose, du temps et du type cellulaire.  Les comparaisons doivent préciser la dose en masse, en nombre ou en surface.</p><h3>Exemples sur les oxydes de fer</h3><p>Hirsch et al. comparent des SPIONs de charges différentes. La charge, la stabilité colloïdale et l’internalisation sont liées.  Portilla et al. comparent deux revêtements sur un même cœur. Le trafic endolysosomal diffère chez les macrophages, mais pas dans les cellules tumorales étudiées.</p><h3>Couronne et reconnaissance cellulaire</h3><p>Francia et al. modifient la quantité de sérum lors de la formation de la couronne. Sur des particules de silice, la reconnaissance par les récepteurs et les voies d’entrée changent. Aliyandi et al. observent qu’une préadsorption de glycoprotéine riche en histidine réduit l’entrée de silice dans leurs modèles endothéliaux.</p><p>Sur des IONPs, Portilla et al. comparent plusieurs revêtements. Des couronnes de composition proche peuvent accompagner des réponses cellulaires différentes. </p><h3>Adaptation et homéostasie</h3><p>La cellule peut stocker le fer et renforcer ses défenses antioxydantes. NRF2 régule des gènes de protection. Une réponse adaptative ne signifie pas une immunité adaptative.</p><h3>ROS et stress oxydant</h3><p>Les espèces réactives de l’oxygène comprennent le superoxyde, le peroxyde d’hydrogène et le radical hydroxyle. Le peroxyde d’hydrogène n’est pas un radical. Le stress oxydant apparaît lorsque les processus oxydants dépassent les capacités de régulation et de réparation.</p><h3>Réaction de Fenton</h3><p>L’écriture classique décrit la réaction de Fe²⁺ avec H₂O₂. Les ligands, le pH et la disponibilité du fer modifient la réactivité. Le fer réactif dépend de la spéciation et de l’accessibilité du fer.</p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">Fe</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>→</mo><msup><mi mathvariant=\"normal\">Fe</mi><mrow><mn>3</mn><mo>+</mo></mrow></msup><mo>+</mo><msup><mi mathvariant=\"normal\">OH</mi><mo>−</mo></msup><mo>+</mo><mi mathvariant=\"normal\">HO</mi><mo>•</mo></math><h3>Peroxydation lipidique et ferroptose</h3><p>La ferroptose est une mort cellulaire régulée dépendante du fer. Elle implique une accumulation de peroxydes lipidiques. GPX4 réduit ces peroxydes en utilisant le glutathion. L’étude de la ferroptose associe peroxydation lipidique et contrôles mécanistiques. Les expériences associent la mesure des lipides oxydés aux effets des interventions protectrices.</p><h3>Réponse inflammatoire cellulaire</h3><p>Les macrophages peuvent modifier leur production de cytokines après exposition. Zanganeh et al. observent une réponse pro-inflammatoire et un effet antitumoral avec le ferumoxytol dans des modèles murins. Ce résultat concerne une formulation et des conditions précises.</p><h3>De la cellule à l’organisme</h3><p>La réponse systémique dépend de la dose, de la voie d’administration, de la distribution et de la clairance. Complément, cytokines circulantes et tissus apportent des informations distinctes. </p><p><a href=\"#biointerfaces/fate\">Revenir au devenir intracellulaire</a></p></div>","<div class=\"text-module\"><h3>Size, shape and surface charge</h3><p>Cells encounter a particle together with its coating, corona and possible aggregates. Core size and hydrodynamic size therefore describe different objects.</p><ul><li><strong>Size.</strong> It influences membrane contact, uptake and intracellular fate. At equal mass, particle number and exposed surface area vary with size.</li><li><strong>Shape.</strong> Local curvature and contact orientation affect membrane wrapping. A sphere, a rod and an assembly present different interfaces.</li><li><strong>Charge.</strong> It influences interactions with proteins and membranes. Zeta potential depends on pH, ions and medium. The corona can modify apparent charge and mask ligands.</li></ul><p>These parameters act together. Their effects on ROS, inflammation or viability also depend on dose, time and cell type.  Comparisons should specify whether dose is expressed as mass, number or surface area.</p><h3>Iron oxide examples</h3><p>Hirsch et al. compare SPIONs with different charges. Charge, colloidal stability and uptake are linked.  Portilla et al. compare two coatings on the same core. Endolysosomal trafficking differs in macrophages, but not in the studied tumour cells.</p><h3>Corona and cellular recognition</h3><p>Francia et al. vary the amount of serum during corona formation. On silica particles, receptor recognition and uptake pathways change. Aliyandi et al. find that preadsorbed histidine-rich glycoprotein reduces silica uptake in their endothelial models.</p><p>On IONPs, Portilla et al. compare several coatings. Coronas with similar compositions can accompany different cellular responses. </p><h3>Adaptation and homeostasis</h3><p>Cells can store iron and strengthen antioxidant defences. NRF2 regulates protective genes. An adaptive cellular response is distinct from adaptive immunity.</p><h3>ROS and oxidative stress</h3><p>Reactive oxygen species include superoxide, hydrogen peroxide and the hydroxyl radical. Hydrogen peroxide is not a radical. Oxidative stress arises when oxidizing processes exceed regulatory and repair capacity.</p><h3>Fenton reaction</h3><p>The classical equation describes Fe²⁺ reacting with H₂O₂. Ligands, pH and iron availability affect reactivity. Reactive iron depends on iron speciation and accessibility.</p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">Fe</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>→</mo><msup><mi mathvariant=\"normal\">Fe</mi><mrow><mn>3</mn><mo>+</mo></mrow></msup><mo>+</mo><msup><mi mathvariant=\"normal\">OH</mi><mo>−</mo></msup><mo>+</mo><mi mathvariant=\"normal\">HO</mi><mo>•</mo></math><h3>Lipid peroxidation and ferroptosis</h3><p>Ferroptosis is an iron-dependent regulated cell death. It involves lipid peroxide accumulation. GPX4 reduces these peroxides using glutathione. Ferroptosis studies combine lipid peroxidation measurements with mechanistic controls. The experiments combine oxidized-lipid measurements with the effects of protective interventions.</p><h3>Cellular inflammatory response</h3><p>Macrophages can alter cytokine production after exposure. Zanganeh et al. observe a pro-inflammatory response and an antitumour effect with ferumoxytol in mouse models. This result concerns a specific formulation and defined conditions.</p><h3>From cells to the organism</h3><p>Systemic responses depend on dose, administration route, distribution and clearance. Complement, circulating cytokines and tissues provide distinct information. </p><p><a href=\"#biointerfaces/fate\">Return to intracellular fate</a></p></div>"]},"mri":{"a":2,"n":["IRM : T₁ et T₂","MRI: T₁ and T₂"],"kind":"mri","src":"review-fig2","refs":["bloch1946"],"lead":["Une impulsion RF de 90° bascule l’aimantation des protons de l’eau. La récupération longitudinale et la décroissance transverse se produisent simultanément.","A 90° RF pulse tips water-proton magnetization. Longitudinal recovery and transverse decay occur simultaneously."],"steps":[["Impulsion RF","RF pulse","Le vecteur quitte l’axe longitudinal et atteint le plan transverse.","The vector leaves the longitudinal axis and reaches the transverse plane."],["Relaxation simultanée","Simultaneous relaxation","Mz récupère avec T₁. Mxy décroît avec T₂.","Mz recovers with T₁. Mxy decays with T₂."],["Retour à l’équilibre","Return to equilibrium","La composante transverse s’efface tandis que la composante longitudinale se reconstitue.","The transverse component disappears while the longitudinal component recovers."],["Équilibre","Equilibrium","L’aimantation retrouve progressivement sa valeur longitudinale M₀.","Magnetization progressively returns to its longitudinal value M₀."]],"limits":["",""],"notes":["T₁ caractérise le retour de Mz vers l’équilibre par échange d’énergie avec le milieu. T₂ caractérise la perte de cohérence transverse. T₂* inclut aussi le déphasage dû aux inhomogénéités de champ. Ici, la décroissance représentée est celle de T₂. Le vecteur représente l’aimantation des protons, pas le moment d’une IONP.","T₁ characterizes recovery of Mz through energy exchange with the surroundings. T₂ characterizes loss of transverse coherence. T₂* also includes dephasing due to field inhomogeneity. The decay shown here represents T₂. The vector represents proton magnetization, not an IONP moment."]},"relaxivity":{"a":2,"kind":"reading","static":true,"n":["Eau, IONPs et relaxivité","Water, IONPs and relaxivity"],"lead":["Les IONPs modifient la relaxation des protons de l’eau.","IONPs modify water-proton relaxation."],"body":["<div class=\"reading-overview\"><section><h3>Champs locaux</h3><p>Les moments des IONPs modifient les champs ressentis par les protons de l’eau. Le mouvement de l’eau et la dynamique magnétique influencent leur relaxation.</p></section><section><h3>Mesure</h3><p>La pente de 1/T₁ ou de 1/T₂ en fonction de la concentration en fer définit r₁ ou r₂ dans le domaine linéaire. Le champ, la température et le milieu doivent être précisés.</p></section><section><h3>Structure</h3><p>La taille, l’aimantation, le revêtement et l’organisation des cœurs modifient la réponse. Pour un assemblage, la fraction volumique magnétique intervient dans la loi d’échelle de Vuong et al.</p></section></div>","<div class=\"reading-overview\"><section><h3>Local fields</h3><p>IONP moments change the fields experienced by water protons. Water motion and magnetic dynamics influence proton relaxation.</p></section><section><h3>Measurement</h3><p>The slope of 1/T₁ or 1/T₂ versus iron concentration defines r₁ or r₂ in the linear range. Field, temperature and medium must be specified.</p></section><section><h3>Structure</h3><p>Size, magnetization, coating and core organization change the response. For assemblies, magnetic volume fraction enters the scaling law of Vuong et al.</p></section></div>"],"steps":[],"refs":["dias1986","roch1999","vuong2012","mri"],"limits":["",""],"extendedBody":["<div class=\"text-module\"><h3>Origine du contraste</h3><p>Les moments des IONPs créent des champs locaux. Le mouvement de l’eau et la dynamique magnétique modulent les champs ressentis par les protons. Ces mécanismes modifient T₁ et T₂.</p><h3>Mesurer les relaxivités</h3><p>La pente de 1/T₁ ou de 1/T₂ en fonction de la concentration en fer définit r₁ ou r₂. Les relaxivités dépendent du champ B₀, de la température et du milieu.</p><h3>Structure et propriétés</h3><p>La taille du cœur, l’aimantation, le revêtement et l’agrégation influencent la relaxation. Le contraste dépend des relaxivités, de la concentration et de la séquence d’acquisition.</p><h3>Comprendre la loi d’échelle de Vuong et al.</h3><p>La diffusion de l’eau moyenne les champs locaux lorsque Δωτ<sub>D</sub> est petit. Dans ce régime, r₂ augmente avec le carré de l’aimantation volumique et le carré de la taille, à composition fixée. Pour un assemblage, sa fraction volumique magnétique intervient aussi. Lorsque Δωτ<sub>D</sub> augmente, le régime change : cette croissance ne se prolonge pas indéfiniment.</p><details><summary>Diffusion et déphasage</summary><p>τ<sub>D</sub> est le temps de diffusion sur la taille de l’objet. Δω mesure le décalage de fréquence créé par son aimantation. Le régime de déphasage statique décrit surtout R₂*. La mesure de R₂ dépend aussi du refocalisage et de l’espacement des échos. Le diamètre pertinent est celui de l’objet imperméable à l’eau ; pour un assemblage, ce n’est pas automatiquement celui d’un cœur.</p></details><p>À aimantation saturée, dans le régime de moyennage par le mouvement, r₂φ<sub>intra</sub>/Mᵥ² varie comme d²/D. Mᵥ est l’aimantation par volume de l’objet entier. φ<sub>intra</sub> est sa fraction volumique magnétique. D est le coefficient de diffusion de l’eau. Pour un assemblage compact, Mᵥ = φ<sub>intra</sub>M<sub>cœur</sub>. À composition fixée, r₂ varie donc comme φ<sub>intra</sub>M<sub>cœur</sub>²d²/D.</p><details class=\"symbols\"><summary>Symboles et unités</summary><p>γ est le rapport gyromagnétique du proton, en rad·s⁻¹·T⁻¹. Rᵢ = 1/Tᵢ ; i = 1 ou 2. cFe est en mmol/L ; rᵢ en L·mmol⁻¹·s⁻¹. La relation linéaire s’applique dans le domaine de concentration validé expérimentalement.</p></details></div>","<div class=\"text-module\"><h3>Contrast mechanism</h3><p>IONP moments create local fields. Water motion and magnetic dynamics modulate the fields experienced by protons. These mechanisms modify T₁ and T₂.</p><h3>Measuring relaxivity</h3><p>The slope of 1/T₁ or 1/T₂ versus iron concentration defines r₁ or r₂. Relaxivities depend on B₀, temperature and medium.</p><h3>Structure and properties</h3><p>Core size, magnetization, coating and aggregation influence relaxation. Contrast depends on relaxivities, concentration and acquisition sequence.</p><h3>Understanding the scaling law of Vuong et al.</h3><p>Water diffusion averages local fields when Δωτ<sub>D</sub> is small. In this regime, r₂ increases with squared volume magnetization and squared size at fixed composition. An assembly’s magnetic volume fraction also matters. As Δωτ<sub>D</sub> increases, the regime changes: this growth does not continue indefinitely.</p><details><summary>Diffusion and dephasing</summary><p>τ<sub>D</sub> is the diffusion time over the object size. Δω measures the frequency shift produced by its magnetization. Static dephasing mainly describes R₂*. Measured R₂ also depends on refocusing and echo spacing. The relevant diameter is that of the water-impermeable object; for an assembly, it is not automatically the core diameter.</p></details><p>At magnetic saturation, in the motional averaging regime, r₂φ<sub>intra</sub>/Mᵥ² scales as d²/D. Mᵥ is magnetization per volume of the whole object. φ<sub>intra</sub> is its magnetic volume fraction. D is the water diffusion coefficient. For a compact assembly, Mᵥ = φ<sub>intra</sub>M<sub>core</sub>. At fixed composition, r₂ therefore scales as φ<sub>intra</sub>M<sub>core</sub>²d²/D.</p><details class=\"symbols\"><summary>Symbols and units</summary><p>γ is the proton gyromagnetic ratio, in rad·s⁻¹·T⁻¹. Rᵢ = 1/Tᵢ; i = 1 or 2. cFe is in mmol/L; rᵢ in L·mmol⁻¹·s⁻¹. The linear relation applies over an experimentally validated concentration range.</p></details></div>"]},"mpi":{"a":2,"kind":"reading","static":true,"n":["Imagerie par particules magnétiques","Magnetic particle imaging"],"lead":["Le MPI détecte directement la réponse magnétique des traceurs.","MPI directly detects the magnetic response of tracers."],"body":["<div class=\"reading-overview\"><section><h3>Sélection spatiale</h3><p>Un gradient crée une région de champ nul. Le champ d’excitation déplace cette région. Les particules proches répondent fortement.</p></section><section><h3>Détection</h3><p>La variation de l’aimantation induit une tension dans une bobine. Sa réponse non linéaire permet de reconstruire une image.</p></section><section><h3>Traceur</h3><p>Le signal provient des particules, contrairement à l’IRM qui détecte les noyaux. L’anisotropie et les temps de relaxation influencent le signal et la résolution.</p></section></div>","<div class=\"reading-overview\"><section><h3>Spatial selection</h3><p>A gradient creates a field-free region. The excitation field moves this region. Nearby particles respond strongly.</p></section><section><h3>Detection</h3><p>Changing magnetization induces voltage in a coil. Its nonlinear response enables image reconstruction.</p></section><section><h3>Tracer</h3><p>The signal comes from particles, unlike MRI, which detects nuclei. Anisotropy and relaxation times influence signal and resolution.</p></section></div>"],"steps":[],"refs":["mpi"],"limits":["",""],"reviews":["krishnan2010"],"extendedBody":["<div class=\"text-module\"><h3>Localiser le signal</h3><p>Un gradient crée une région de champ nul. Un champ d’excitation déplace cette région. Les particules proches répondent fortement ; les particules éloignées sont proches de la saturation.</p><h3>Réponse non linéaire</h3><p>La variation de l’aimantation induit une tension dans une bobine de réception. La réponse non linéaire contient des harmoniques. La reconstruction utilise la sensibilité spatiale et la réponse du traceur.</p><h3>Rôle du traceur</h3><p>Le moment magnétique, l’anisotropie et les temps de relaxation modifient le signal et la résolution. Le signal de particules présente peu de fond endogène ; le bruit instrumental subsiste.</p><p>La fonction de Langevin introduite dans l’axe 1 décrit une réponse d’équilibre idéale. En MPI, le champ varie rapidement : la relaxation peut retarder cette réponse. Le signal provient des particules, contrairement à l’IRM qui détecte les noyaux.</p><details class=\"symbols\"><summary>Symboles et unités</summary><p>u : tension reçue ; Φ : flux magnétique ; N : nombre de spires. La proportionnalité à dM/dt suppose une géométrie de détection fixée. </p></details></div>","<div class=\"text-module\"><h3>Localizing the signal</h3><p>A gradient creates a field-free region. A drive field moves this region. Nearby particles respond strongly; distant particles approach saturation.</p><h3>Nonlinear response</h3><p>Changing magnetization induces voltage in a receive coil. The nonlinear response contains harmonics. Reconstruction uses spatial sensitivity and tracer response.</p><h3>Tracer properties</h3><p>Magnetic moment, anisotropy and relaxation times affect signal and resolution. Particle signals have little endogenous background; instrumental noise remains.</p><p>The Langevin function introduced in axis 1 describes an ideal equilibrium response. In MPI, the field varies rapidly: relaxation can delay that response. The signal comes from particles, unlike MRI, which detects nuclei.</p><details class=\"symbols\"><summary>Symbols and units</summary><p>u: received voltage; Φ: magnetic flux; N: coil turns. Proportionality to dM/dt assumes fixed detection geometry. </p></details></div>"]},"heat":{"a":2,"kind":"reading","static":true,"n":["Hyperthermie magnétique","Magnetic hyperthermia"],"lead":["Un champ alternatif transfère de l’énergie aux moments magnétiques. Une partie est dissipée en chaleur.","An alternating field transfers energy to magnetic moments. Some is dissipated as heat."],"body":["<div class=\"reading-overview\"><section><h3>Dissipation</h3><p>L’aire du cycle dynamique M(H) donne l’énergie dissipée par cycle et par volume de référence. La fréquence transforme cette énergie en puissance.</p></section><section><h3>Dynamique</h3><p>L’anisotropie, la taille, les interactions et le milieu influencent la réponse. La forme et le couplage d’échange permettent de modifier l’anisotropie. La réponse dépend conjointement de l’anisotropie, de la taille et du champ.</p></section><section><h3>Comparaison</h3><p>Le SAR rapporte la puissance à une masse précisée : fer ou oxyde. Le champ, la fréquence et les pertes thermiques doivent être indiqués. La tolérance dépend aussi du volume exposé, de la durée et des échanges thermiques.</p></section></div>","<div class=\"reading-overview\"><section><h3>Dissipation</h3><p>The dynamic M(H) loop area gives energy loss per cycle and reference volume. Frequency converts this energy into power.</p></section><section><h3>Dynamics</h3><p>Anisotropy, size, interactions and medium influence the response. Shape and exchange coupling can modify anisotropy. The response depends jointly on anisotropy, size and field.</p></section><section><h3>Comparison</h3><p>SAR divides power by a stated mass: iron or oxide. Field, frequency and heat losses must be reported. Tolerance also depends on exposed volume, duration and heat transfer.</p></section></div>"],"steps":[],"refs":["gilchrist1957","neel","brown","heat","carrey2011","fortin2007","cheon2011","hergt2008","atkinson1984","kallumadil2009","wildeboer462"],"limits":["",""],"reviews":["dutz2013","sandre2015","krishnan2010"],"extendedBody":["<div class=\"text-module\"><h3>Réponse linéaire de Rosensweig</h3><p>À faible excitation, χ″ décrit la composante dissipative. Un modèle à temps de relaxation unique relie χ″ à χ₀ et à 2πfτ. Cette approximation utilise la réponse linéaire de particules faiblement couplées.</p><h3>Anisotropie et relaxation</h3><p>La barrière K<sub>eff</sub>V contrôle le retournement de Néel. La rotation brownienne dépend de la viscosité et du volume hydrodynamique. Fortin et al. séparent ces contributions en variant la taille, l’anisotropie et la viscosité.</p><h3>Taille, anisotropie et puissance dissipée</h3><p>La taille fixe le volume magnétique. L’anisotropie règle la barrière de retournement. Leur combinaison détermine si le moment répond au champ alternatif. La réponse dépend aussi du champ et de la fréquence d’excitation.</p><p>La figure 1 de Lee et al. compare les mesures et les calculs de SLP. Les informations supplémentaires détaillent le modèle de relaxation (section 11).  Le maximum dépend aussi du champ, de sa fréquence, de l’aimantation et du milieu.</p><h3>Couplage d’échange entre phases</h3><p>Lee et al. associent un cœur magnétique dur à une coquille douce, notamment CoFe₂O₄@MnFe₂O₄. L’échange à leur interface modifie la réponse magnétique. L’architecture cœur–coquille permet ainsi d’ajuster le chauffage.</p><h3>Le lien avec les oxydes de fer</h3><p>La forme est un autre levier pour modifier l’anisotropie effective. Une sphère de magnétite peut être éloignée de l’optimum pour une taille et un champ donnés. La taille et l’anisotropie doivent être adaptées au champ disponible. Carrey et al. décrivent cette optimisation à partir des cycles dynamiques.</p><p>Le système de Cheon illustre le principe du couplage entre phases. Il contient aussi du cobalt et du manganèse. </p><h3>Recalcul du modèle de Cheon</h3><p>La taille et K règlent les temps de relaxation. Le maximum se déplace avec ces paramètres. À K élevé, la rotation brownienne maintient une dissipation dans ce liquide.</p><p>Ce recalcul utilise les équations de relaxation des suppléments. Il retrouve une zone de forte dissipation.  Le modèle utilise un moment résultant et une anisotropie effective.</p><h3>Fortin : tester les mécanismes</h3><p>Fortin et al. comparent la maghémite et la ferrite de cobalt. La variation de viscosité distingue les contributions de Néel et de Brown. La distribution des tailles élargit le maximum de chauffage. </p><details class=\"technical-complement444\"><summary>Fortin : paramètres ajustés et comparaison quantitative</summary><p>Fortin et al. varient la taille, le matériau et la viscosité. Ils étudient la maghémite et la ferrite de cobalt. Le calcul intègre la distribution des tailles déduite de M(H).</p><p>Les valeurs de K sont ajustées aux mesures de SLP : 16 kJ·m⁻³ pour la maghémite et 120 kJ·m⁻³ pour la ferrite de cobalt. Ce sont des paramètres du modèle. </p><p>Le volume magnétique intervient dans la relaxation de Néel. Le volume hydrodynamique intervient dans la rotation brownienne. Fortin ajoute 2 nm au rayon, soit 4 nm au diamètre. Cheon ajoute 2 nm au diamètre.</p><p>À 700 kHz et 24,8 kA·m⁻¹, le SLP de la ferrite de cobalt passe de 420 à 90 W·g⁻¹ lorsque la viscosité augmente. Celui de la maghémite passe de 135 à 100 W·g⁻¹. La rotation brownienne contribue davantage dans le premier cas.</p><p>La dispersion des tailles élargit le maximum. Elle réduit fortement sa hauteur pour la maghémite étudiée.  Le modèle sous-estime le chauffage du plus grand échantillon de maghémite.</p></details><h3>Comparer les mesures</h3><p>Le SAR rapporte la puissance à une masse explicitement définie : fer ou oxyde. En calorimétrie, il dépend de la capacité thermique totale et de la pente initiale de température. L’ILP n’est comparable que dans les conditions où la réponse linéaire est appropriée.</p><h3>Amplitude et fréquence : critère de Brezovich</h3><p>Le repère historique H₀f ≲ 4,85 × 10⁸ A·m⁻¹·s⁻¹ provient de conditions d’exposition particulières. Des critères moins restrictifs, autour de 5 × 10⁹, ont été proposés pour d’autres géométries. La tolérance dépend du volume exposé, de la durée et du refroidissement.</p><p>Carrey et al. relient les cycles dynamiques aux conditions d’excitation. Leur approche permet de dépasser la réponse linéaire. Dans l’approximation de deux voies indépendantes, les vitesses de relaxation de Néel et brownienne s’additionnent.</p><p>Ici, M et χ sont rapportés au volume de phase magnétique. Pᵥ utilise le même volume. Si χ est mesurée par volume de suspension, la puissance volumique doit être divisée par la concentration massique de matériau magnétique, et non par sa masse volumique. Le SAR par masse de fer requiert une conversion supplémentaire.</p><p>Les retournements internes et la rotation mécanique contribuent à la même aire de cycle dynamique. Ajouter des « pertes de relaxation » à cette aire compterait deux fois leur contribution.</p><details class=\"symbols\"><summary>Symboles et unités</summary><p>H₀ est l’amplitude crête en A/m, f la fréquence en Hz, τ le temps de relaxation. M est une aimantation volumique. Pᵥ est en W/m³ de phase magnétique ; ρmag en kg/m³ donne un SAR en W/kg de phase magnétique. Ctot est la capacité thermique totale (J/K) et mmag la masse de référence (kg). Les pertes thermiques doivent être prises en compte.</p></details></div>","<div class=\"text-module\"><h3>Rosensweig linear response</h3><p>At low excitation, χ″ describes the dissipative component. A single-relaxation-time model relates χ″ to χ₀ and 2πfτ. This approximation uses the linear response of weakly coupled particles.</p><h3>Anisotropy and relaxation</h3><p>The K<sub>eff</sub>V barrier controls Néel reversal. Brownian rotation depends on viscosity and hydrodynamic volume. Fortin et al. separate these contributions by varying size, anisotropy and viscosity.</p><h3>Size, anisotropy and dissipated power</h3><p>Size sets the magnetic volume. Anisotropy controls the reversal barrier. Together, they determine whether the moment responds to the alternating field. The response also depends on excitation field and frequency.</p><p>Figure 1 of Lee et al. compares SLP measurements and calculations. The Supporting Information details the relaxation model (Section 11).  The maximum also depends on field amplitude, frequency, magnetization and the medium.</p><h3>Exchange coupling between phases</h3><p>Lee et al. combine a magnetically hard core with a soft shell, including CoFe₂O₄@MnFe₂O₄. Exchange at their interface modifies the magnetic response. The core–shell architecture thus provides a way to tune heating.</p><h3>Connecting to iron oxides</h3><p>Shape provides another way to change effective anisotropy. A magnetite sphere can lie away from the optimum for a given size and field. Spheres are not inherently unsuitable: size and anisotropy must match the available field. Carrey et al. describe this optimization through dynamic hysteresis loops.</p><p>Cheon’s system illustrates coupling between phases. It also contains cobalt and manganese. </p><h3>Recalculation of Cheon’s model</h3><p>Size and K set the relaxation times. The maximum shifts with these parameters. At high K, Brownian rotation maintains dissipation in this liquid.</p><p>This recalculation uses the supplementary relaxation equations. It recovers a region of high dissipation.  The model uses a net moment and an effective anisotropy.</p><h3>Fortin: testing the mechanisms</h3><p>Fortin et al. compare maghemite and cobalt ferrite. Varying viscosity distinguishes Néel and Brownian contributions. The size distribution broadens the heating maximum. Mean size alone is insufficient.</p><details class=\"technical-complement444\"><summary>Fortin: fitted parameters and quantitative comparison</summary><p>Fortin et al. vary size, material and viscosity. They study maghemite and cobalt ferrite. The calculation includes the size distribution inferred from M(H).</p><p>K values are fitted to SLP measurements: 16 kJ·m⁻³ for maghemite and 120 kJ·m⁻³ for cobalt ferrite. They are model parameters. </p><p>Magnetic volume enters Néel relaxation. Hydrodynamic volume enters Brownian rotation. Fortin adds 2 nm to the radius, or 4 nm to the diameter. Cheon adds 2 nm to the diameter.</p><p>At 700 kHz and 24.8 kA·m⁻¹, cobalt-ferrite SLP falls from 420 to 90 W·g⁻¹ as viscosity increases. Maghemite SLP falls from 135 to 100 W·g⁻¹. Brownian rotation contributes more in the first case.</p><p>Size dispersion broadens the peak. It strongly reduces peak height for the studied maghemite. Mean diameter alone is insufficient. The model underestimates heating for the largest maghemite sample.</p></details><h3>Comparing measurements</h3><p>SAR divides power by an explicitly defined mass: iron or oxide. Calorimetry uses total heat capacity and the initial temperature slope. ILP is comparable only when linear-response conditions are appropriate.</p><h3>Amplitude and frequency: the Brezovich criterion</h3><p>The historical guide H₀f ≲ 4.85 × 10⁸ A·m⁻¹·s⁻¹ comes from specific exposure conditions. Less restrictive criteria near 5 × 10⁹ have been proposed for other geometries. Neither product alone guarantees tolerance: exposed volume, duration and cooling also matter.</p><p>Carrey et al. relate dynamic loops to excitation conditions. Their approach extends beyond linear response. In the approximation of two independent pathways, Néel and Brownian relaxation rates add.</p><p>Here, M and χ refer to magnetic-phase volume. Pᵥ uses the same volume. If χ is measured per suspension volume, volumetric power must be divided by magnetic-material mass concentration, not its density. SAR per iron mass requires an additional conversion.</p><p>Internal reversals and mechanical rotation contribute to the same dynamic loop area. Adding “relaxation losses” to that area would count their contribution twice.</p><details class=\"symbols\"><summary>Symbols and units</summary><p>H₀ is peak amplitude in A/m, f is frequency in Hz, τ is relaxation time. M is volume magnetization. Pᵥ is in W/m³ of magnetic phase; ρmag in kg/m³ gives SAR in W/kg of magnetic phase. Ctot is total heat capacity (J/K) and mmag is reference mass (kg). Heat losses must be accounted for.</p></details></div>"]},"photo":{"a":2,"kind":"reading","static":true,"n":["Conversion photothermique","Photothermal conversion"],"lead":["La lumière absorbée peut être dissipée sous forme de chaleur.","Absorbed light can be dissipated as heat."],"body":["<div class=\"reading-overview\"><section><h3>Absorption</h3><p>La lumière absorbée peut être transférée au milieu sous forme de chaleur par relaxation non radiative.</p></section><section><h3>Matériau</h3><p>L’absorption dépend de la composition, de la longueur d’onde et de l’organisation des particules. </p></section><section><h3>Mesure</h3><p>Le bilan distingue la puissance absorbée, le chauffage du solvant et les pertes. La température mesurée dépend de cet ensemble.</p></section></div>","<div class=\"reading-overview\"><section><h3>Absorption</h3><p>Absorbed light can transfer energy to the medium as heat through nonradiative relaxation.</p></section><section><h3>Material</h3><p>Absorption depends on composition, wavelength and particle organization. </p></section><section><h3>Measurement</h3><p>The balance separates absorbed power, solvent heating and losses. Measured temperature depends on all of these contributions.</p></section></div>"],"steps":[],"refs":["shen2013","shen2015","roper2007","bertuit2022"],"limits":["",""],"extendedBody":["<div class=\"text-module\"><h3>Absorption et dissipation</h3><p>Les voies de relaxation non radiatives transfèrent l’énergie absorbée au milieu. La photothermie se distingue de la photodynamique, qui repose sur des espèces réactives.</p><h3>IONPs et assemblages</h3><p>L’absorption dépend de la composition, de la longueur d’onde et de l’organisation des particules. Des études sur les IONPs et leurs amas montrent une conversion dans le proche infrarouge. </p><h3>Bilan thermique</h3><p>La température résulte de la puissance absorbée et des pertes. Un blanc permet d’estimer le chauffage du solvant et du contenant. Le rendement dépend du bilan thermique et de la mesure de l’absorption.</p><details class=\"symbols\"><summary>Symboles et unités</summary><p>Ctot : capacité thermique totale ; η : rendement ; Pabs : puissance optique absorbée par les particules ; Pblank : chauffage de fond ; G : conductance thermique effective ; Tenv : température du milieu. Modèle global à température uniforme, sans prédiction de température cellulaire locale.</p></details></div>","<div class=\"text-module\"><h3>Absorption and dissipation</h3><p>Nonradiative relaxation pathways transfer absorbed energy to the surroundings. Photothermal conversion differs from photodynamic action, which involves reactive species.</p><h3>IONPs and assemblies</h3><p>Absorption depends on composition, wavelength and particle organization. Studies of IONPs and clusters show near-infrared conversion. </p><h3>Heat balance</h3><p>Temperature reflects absorbed power and heat losses. A blank estimates solvent and container heating. Efficiency depends on the heat balance and absorption measurement.</p><details class=\"symbols\"><summary>Symbols and units</summary><p>Ctot: total heat capacity; η: efficiency; Pabs: optical power absorbed by particles; Pblank: background heating; G: effective thermal conductance; Tenv: ambient temperature. Lumped uniform-temperature model.</p></details></div>"]},"distribution":{"a":2,"kind":"reading","static":true,"n":["Distribution et devenir dans l’organisme","Distribution and fate in the body"],"lead":["La distribution dépend de la formulation et de la voie d’administration. Le suivi distingue les particules et le fer transformé.","Distribution depends on formulation and administration route. Tracking distinguishes particles from transformed iron."],"body":["<div class=\"reading-overview\"><section><h3>Circulation</h3><p>Le diamètre hydrodynamique inclut le revêtement et la couronne. L’agrégation modifie la taille circulante. La dose et les protéines adsorbées influencent la reconnaissance cellulaire.</p></section><section><h3>Capture et transformation</h3><p>Après injection intraveineuse, des IONPs peuvent être captées dans le foie et la rate. Les cellules dégradent progressivement les cœurs. La cinétique dépend de la formulation et du compartiment.</p></section><section><h3>Dissolution et élimination</h3><p>La dissolution libère du fer. Ce fer peut rejoindre les voies de stockage et de transport. La transformation du cœur modifie le signal magnétique. Un bilan doit suivre le fer, les particules et les voies de sortie.</p></section></div><p>Weissleder et al. comparent des formulations SPIO et USPIO chez le rat. Leur durée de circulation diffère. Chertok et al. distinguent le signal des particules du fer endogène par des mesures complémentaires.</p>","<div class=\"reading-overview\"><section><h3>Circulation</h3><p>Hydrodynamic diameter includes the coating and corona. Aggregation changes the circulating size. Dose and adsorbed proteins influence cellular recognition.</p></section><section><h3>Uptake and transformation</h3><p>After intravenous injection, IONPs can accumulate in the liver and spleen. Cells progressively degrade the cores. Kinetics depend on formulation and compartment.</p></section><section><h3>Dissolution and elimination</h3><p>Dissolution releases iron. This iron can enter storage and transport pathways. Core transformation changes the magnetic signal. A mass balance must track iron, particles and routes of exit.</p></section></div><p>Weissleder et al. compare SPIO and USPIO formulations in rats. Their circulation times differ. Chertok et al. distinguish particle signal from endogenous iron with complementary measurements.</p>"],"steps":[],"refs":["levy461","lartigue461","lartiguecorona461","arami463","weissleder463","chertok2010","nowak463"],"limits":["",""]},"delivery":{"a":2,"kind":"reading","static":true,"n":["Ciblage et délivrance","Targeting and delivery"],"lead":["L’accumulation, l’entrée cellulaire et la libération sont des étapes distinctes.","Accumulation, cell entry and release are distinct steps."],"body":["<div class=\"reading-overview\"><section><h3>Franchir les barrières</h3><p>La circulation précède l’accès au tissu. La perméabilité vasculaire et le transport interstitiel conditionnent cet accès. L’accumulation tumorale varie entre modèles et entre tumeurs.</p></section><section><h3>Ciblage magnétique</h3><p>Un gradient de champ exerce une force sur les IONPs. La capture dépend du gradient local et du transport par le fluide. L’essai de Lübbe utilise un ferrofluide associé à l’épidoxorubicine. </p></section><section><h3>Ligands et libération</h3><p>Un ligand reconnaît une cible accessible. La couronne peut modifier son exposition. Salvati et al. démontrent un masquage de ligands sur des particules de silice.  La libération du composé doit être mesurée séparément de l’internalisation du vecteur.</p></section></div><p>Chertok et al. étudient une capture magnétique dans un modèle de gliome chez le rat. La délivrance du médicament associe transport, libération et accès à sa cible.</p>","<div class=\"reading-overview\"><section><h3>Crossing barriers</h3><p>Circulation precedes tissue access. Vascular permeability and interstitial transport govern this access. Tumour accumulation varies across models and tumours.</p></section><section><h3>Magnetic targeting</h3><p>A field gradient exerts a force on IONPs. Capture depends on the local gradient and fluid transport. Lübbe’s trial used an epidoxorubicin-associated ferrofluid. </p></section><section><h3>Ligands and release</h3><p>A ligand recognizes an accessible target. The corona can alter its exposure. Salvati et al. demonstrated ligand masking on silica particles.  Compound release must be measured separately from carrier internalization.</p></section></div><p>Chertok et al. study magnetic capture in a rat glioma model. Drug delivery involves transport, release and access to its target.</p>"],"steps":[],"refs":["lubbe461","lartiguecorona461","furlani462","salvati","arami463","chertok463"],"limits":["",""]},"mechanics":{"a":2,"kind":"reading","static":true,"n":["Forces et couples magnétiques","Magnetic forces and torques"],"lead":["Le gradient entraîne une translation. Le couple peut entraîner une rotation.","A gradient drives translation. Torque can drive rotation."],"body":["<div class=\"reading-overview\"><section><h3>Force</h3><p>Pour un dipôle permanent dans un champ externe, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">F</mi><mo>=</mo><mo>∇</mo><mo>(</mo><mi mathvariant=\"bold\">m</mi><mo>·</mo><mi mathvariant=\"bold\">B</mi><mo>)</mo></math>. Le gradient spatial est nécessaire. Un champ uniforme ne produit pas cette force de translation.</p></section><section><h3>Couple</h3><p>Le couple magnétique vaut <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">Γ</mi><mo>=</mo><mi mathvariant=\"bold\">m</mi><mo>×</mo><mi mathvariant=\"bold\">B</mi></math>. Une rotation mécanique exige un transfert du couple à la particule. </p></section><section><h3>Action cellulaire</h3><p>Zhang et al. étudient une rotation de SPIONs sous champ dynamique. Ils observent des dommages lysosomaux dans leur modèle cellulaire. La réponse dépend de la localisation et du couplage mécanique. Elle se distingue du chauffage magnétique.</p></section></div><p>Hillion et al. suivent des lysosomes sous champ tournant de basse fréquence. Ils observent leur déplacement et une perméabilisation membranaire.</p>","<div class=\"reading-overview\"><section><h3>Force</h3><p>For a permanent dipole in an external field, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">F</mi><mo>=</mo><mo>∇</mo><mo>(</mo><mi mathvariant=\"bold\">m</mi><mo>·</mo><mi mathvariant=\"bold\">B</mi><mo>)</mo></math>. A spatial gradient is required. A uniform field does not produce this translational force.</p></section><section><h3>Torque</h3><p>Magnetic torque is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">Γ</mi><mo>=</mo><mi mathvariant=\"bold\">m</mi><mo>×</mo><mi mathvariant=\"bold\">B</mi></math>. Mechanical rotation requires torque transfer to the particle. </p></section><section><h3>Cellular action</h3><p>Zhang et al. studied SPION rotation under a dynamic field. They observed lysosomal damage in their cellular model. The response depends on localization and mechanical coupling. It differs from magnetic heating.</p></section></div><p>Hillion et al. track lysosomes under a low-frequency rotating field. They observe movement and membrane permeabilization.</p>"],"steps":[],"refs":["zhang461","furlani462","pankhurst463","hillion463"],"limits":["",""]},"separation":{"a":2,"kind":"reading","static":true,"n":["Détection et séparation magnétique","Magnetic detection and separation"],"lead":["Le signal magnétique permet une détection. Le gradient permet une séparation.","The magnetic signal enables detection. A gradient enables separation."],"body":["<div class=\"reading-overview\"><section><h3>Susceptométrie</h3><p>Une sonde excite les particules et mesure leur réponse magnétique. Le signal dépend de la quantité de traceur et de sa distance à la sonde. Le repérage localise le traceur à partir du signal de la sonde.</p></section><section><h3>Séparation cellulaire</h3><p>Des particules fonctionnalisées reconnaissent les cellules ciblées. Une colonne à fort gradient retient les cellules marquées. Les cellules non marquées traversent la colonne. Le retrait du champ permet de récupérer la fraction retenue.</p></section><section><h3>Contexte d’utilisation</h3><p>Le tri cellulaire ex vivo et l’injection de traceurs sont des usages distincts. La taille des supports et les exigences de formulation diffèrent. Les formulations commerciales figurent dans le module Applications industrielles.</p></section></div><p>Douek et Thill comparent le repérage par traceur SPIO au repérage radio-isotopique chez des patientes. Ces essais documentent la détection ganglionnaire, pas le tri cellulaire.</p>","<div class=\"reading-overview\"><section><h3>Susceptometry</h3><p>A probe excites particles and measures their magnetic response. The signal depends on tracer amount and probe distance. Magnetic localization locates the tracer from the probe signal.</p></section><section><h3>Cell separation</h3><p>Functionalized particles recognize target cells. A high-gradient column retains labelled cells. Unlabelled cells pass through the column. Removing the field allows the retained fraction to be recovered.</p></section><section><h3>Use context</h3><p>Ex vivo cell sorting and tracer injection are distinct uses. Support sizes and formulation requirements differ. Commercial formulations appear in the Industrial applications module.</p></section></div><p>Douek and Thill compare SPIO tracer localization with radioisotope localization in patients. These trials document node detection, not cell sorting.</p>"],"steps":[],"refs":["miltenyi461","magtrace462","douek463","thill463","pankhurst463"],"limits":["",""]},"industry":{"a":2,"kind":"reading","static":true,"n":["IONPs : applications industrielles","IONPs: industrial applications"],"lead":["Comparer les formulations, les technologies et leurs usages documentés.","Compare formulations, technologies and their documented uses."],"body":["",""],"steps":[],"refs":[],"limits":["",""]}};

(function(){
 const headings=/^(?:Reference publication?(?: and sources)?|Scientific references and HDR sources|Reference reviews|Publications? de référence|Synthèses de référence|Références scientifiques et sources HDR|Références et sources)$/i;

  const a=anchors[0],url=a.href,stored=NB_REFERENCE_REGISTRY[url];

  const fallback=(!residue||/^[\s\[\]\d.,;]+$/.test(residue))?el.textContent.trim():residue;
  let citation=stored||escape(fallback).replace(/[.\s]+$/,'');
  if(!citation.includes('<strong>'))citation=citation.replace(/\b((?:18|19|20)\d{2})\b/, '<strong>$1</strong>');
  if(!citation.includes('<em>'))citation=citation.replace(/, ([^,<>]+) (<strong>(?:18|19|20)\d{2}<\/strong>),/, ', <em>$1</em> $2,');
  const label=url.startsWith('https://doi.org/')?'doi: '+url.slice(16):'Source';
  el.innerHTML=citation.replace(/[.\s]+$/,'')+'. <a href="'+escape(url)+'" target="_blank" rel="noopener noreferrer">'+escape(label)+'</a>.';
  el.dataset.refFormatted='1';el.classList.add('citation-entry');
 }
