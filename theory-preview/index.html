const V={c:(x,y,r,f,st='none',sw=1)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${st}" stroke-width="${sw}"/>`,p:(d,f='none',st='#63776b',w=1)=>`<path d="${d}" fill="${f}" stroke="${st}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`,txt:(x,y,s,size=16,anchor='middle',color='#183d45')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" style="font: ${size}px system-ui,sans-serif;fill:${color}">${s}</text>`};

function coronaScene(t){let s=V.txt(150,42,T('Identité de synthèse','Synthetic identity'),20)+V.txt(465,42,T('Couronne biomoléculaire','Biomolecular corona'),20)+V.txt(766,42,T('Interface cellulaire','Cell interface'),20);s+=np(140,260,58,true)+V.txt(140,390,T('Cœur et revêtement','Core and coating'),16);let center=460+Math.max(0,t-.75)/.25*160;
// A curved membrane section, with the extracellular side to its left.
let boundary=[];for(let i=0;i<=75;i++){let y=80+i*5.5,x=760+12*Math.sin(y/65)+Math.max(0,t-.8)*180*Math.exp(-(((y-270)/65)**2));boundary.push([x,y]);}
let bp='M'+boundary.map(p=>p.join(' ')).join('L');s+=V.p(bp+'L900 500L900 80Z','#eee4e9','none')+V.p(bp,'none','#b8a1ae',12)+V.p(bp,'none','#ece2d4',7)+leaflets(boundary,'#a699a8');for(let i of [9,28,48,66]){const[x,y]=boundary[i];s+=receptor(x,y,-90,.85);}

s+=np(center,260,58,true);for(let i=0;i<16;i++){let a=i*Math.PI/8+.13,approach=Math.min(1,t*3),rr=82+(1-approach)*(65+25*Math.sin(i*2));if(t>.5&&i%5===0)rr+=Math.max(0,Math.sin((t-.5)*Math.PI*5+i))*55;s+=prot(center+Math.cos(a)*rr,260+Math.sin(a)*rr,.31,i%5,a*180/Math.PI+90);}
for(let i=0;i<8;i++){let x=280+25*Math.sin(i*2.9+t*4),y=120+i*40;s+=prot(x,y,.32,i%5,i*31+t*15);}
if(values.medium==='plasma')s+=prot(center-15,339,.31,5,0);s+=V.p('M226 260L256 260M246 254L256 260L246 266','none','#899ba0',2)+V.txt(300,480,T('Biomolécules du milieu','Biomolecules in the medium'),15)+V.txt(505,425,T('Adsorption et échanges','Adsorption and exchange'),16)+V.txt(783,533,T('Membrane plasmique','Plasma membrane'),15);

function field(x,y,r=25){let s='';for(let d of [25,40,55])s+=V.p(`M${x} ${y-r}C${x-d} ${y-r-50} ${x-d} ${y+r+50} ${x} ${y+r}C${x+d} ${y+r+50} ${x+d} ${y-r-50} ${x} ${y-r}`,'none','#718988',1);return s;}

function deltaScene(){const sign=values.deltaSign||0,rows=deltaData(sign);let s=panel(20,20,420,350,'IRM / DCD')+panel(460,20,420,350,'ΔM');for(const [left,key]of[[60,'remanence'],[500,'delta']]){const X=x=>left+335*x/1.5,Y=v=>195-115*v;s+=line(left,195,left+335,195,'#a0afb8',1)+line(left,70,left,310,'#a0afb8',1)+V.txt(left+170,342,T('Champ réduit h','Reduced field h'),16)+V.txt(left,327,'0',13)+V.txt(left+335,327,'1.5',13);for(const y of[-1,0,1])s+=V.txt(left-15,Y(y)+4,String(y),13);if(key==='remanence')s+=path(rows.map(r=>[X(r.h),Y(r.irm)]),'#087c83',3)+path(rows.map(r=>[X(r.h),Y(r.dcd)]),'#b1774b',3)+line(left+30,65,left+65,65,'#087c83',3)+V.txt(left+110,70,'mIRM',14)+line(left+165,65,left+195,65,'#b1774b',3)+V.txt(left+245,70,'mDCD',14);else s+=path(rows.map(r=>[X(r.h),Y(r.delta)]),'#7355a2',3)+V.txt(left+175,83,sign>0?'ΔM > 0':sign<0?'ΔM < 0':'ΔM = 0',18);}s+=V.txt(450,412,T('IRM : état initial désaimanté · DCD : état initial saturé','IRM: initially demagnetized · DCD: initially saturated'),16)+V.txt(450,444,T('Mesure à champ nul après chaque champ de préparation.','Measured at zero field after each preparation field.'),16);return vsvg(s,900,470)}
// Four continuous stages; blood context and molecular detail use separate views.
function ease415(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}
function redCell415(x,y,angle,scale=1){return `<g data-red-cell="biconcave" transform="translate(${x} ${y}) rotate(${angle}) scale(${scale})"><ellipse cy="7" rx="46" ry="24" fill="#8f2638" opacity=".12"/><path d="M-48 0C-48-28-16-35 8-29C36-29 51-12 48 4C45 28 15 34-11 28C-35 28-48 17-48 0Z" fill="url(#rbc415)" stroke="#9e3546" stroke-width="1.2"/><ellipse cx="-1" cy="-2" rx="25" ry="14" fill="url(#rbcDimple415)"/><path d="M-40-8C-34-24-10-28 12-23" fill="none" stroke="#f7b4b8" stroke-width="3" opacity=".7"/><path d="M-35 16C-9 31 25 25 39 12" fill="none" stroke="#851f34" stroke-width="2" opacity=".45"/></g>`}
// Seeded random distribution, no lattice and no per-frame resampling.
// Molecule counts from c/M: albumin 40 g/L, 66.5 kDa; IgG 10 g/L, 150 kDa; fibrinogen 3 g/L, 340 kDa.
// Rounded 150-object sample: 133 albumin, 15 IgG, 2 fibrinogen. Selected three-protein model.
const PLASMA418=(()=>{let seed=41826;const rnd=()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296};const kinds=[...Array(133).fill(0),...Array(15).fill(2),...Array(2).fill(5)];for(let i=kinds.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[kinds[i],kinds[j]]=[kinds[j],kinds[i]]}return kinds.map(kind=>({kind,x:rnd()*742,y:rnd()*350,phase:rnd()*Math.PI*2,angle:rnd()*360,speed:rnd()*45,spin:(rnd()-.5)*90}))})();
// One continuous bloodstream scene. PDB silhouettes are reused from the shared SVG bank.
function coronaScene(t){
 const encounter=ease415((t-.75)/.25),cx=95+390*ease415(t/.75)+220*encounter,cy=255;
 let s=`<defs><radialGradient id="rbc415" cx="42%" cy="35%"><stop stop-color="#f0a0a5"/><stop offset=".45" stop-color="#cb5a69"/><stop offset=".78" stop-color="#b3314c"/><stop offset="1" stop-color="#8e263e"/></radialGradient><radialGradient id="rbcDimple415"><stop stop-color="#f3b8b7"/><stop offset=".55" stop-color="#e9939b"/><stop offset="1" stop-color="#b83e54" stop-opacity=".05"/></radialGradient><clipPath id="coronaBlood"><rect x="20" y="62" width="860" height="375" rx="14"/></clipPath></defs>`;
 const stage=Math.min(3,Math.floor(Math.max(0,t-1e-8)*4));s+=V.txt(450,32,(stage+1)+' / 4 · '+T(...[['Injection dans le sang','Injection into blood'],['Adsorption des protéines','Protein adsorption'],['Échanges de la couronne · effet Vroman','Corona exchange · Vroman effect'],['Rencontre avec la cellule','Cell encounter']][stage]),20);
 s+=`<g clip-path="url(#coronaBlood)"><rect x="20" y="62" width="860" height="375" fill="#fff5f0"/>`;
 for(const [i,p] of PLASMA418.entries()){const x=28+((p.x+t*(80+p.speed))%742),y=79+((p.y+8*Math.sin(t*7+p.phase)+350)%350);s+=`<g data-plasma-protein="${i}" data-kind="${p.kind}" opacity=".60">`+prot(x,y,.07,p.kind,p.angle+t*p.spin)+'</g>';}
 // Biconcave cells travel in the same scene, around the focal nanoparticle trajectory.
 for(let i=0;i<5;i++){const x=-90+((i*219+t*145)%1000),y=i%2?412:89;s+=redCell415(x,y,i*39+Math.sin(t*5+i)*8,1.30+(i%2)*.35);}
 const membrane=Array.from({length:56},(_,i)=>[795+5*Math.sin(i/10),55+i*7]);const outline='M'+membrane.map(p=>p.join(' ')).join('L');
 s+=V.p(outline+'L915 470V50Z','url(#vCyto)','none')+V.p(outline,'none','#a3ad93',8)+V.p(outline,'none','#e8e5d4',4)+leaflets(membrane,'#909d87',3);
 for(const i of[14,27,41])s+=receptor(membrane[i][0],membrane[i][1],-90,.65);
 s+=V.p('M900 170C838 185 833 322 900 335Z','url(#vNucleus)','#9eafbd',2);
 s+=`<g data-nanoparticle="coated">`+np(cx,cy,37,true)+'</g>';
 for(let i=0;i<14;i++){
  if(t<.25)continue;
  const a=i*Math.PI*2/14,progress=ease415((t-.25-i*.004)/.19),rr=55+88*(1-progress),x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);
  const switchAt=.505+(i%7)*.024,exchange=ease415((t-switchAt)/.065),replacing=i%3!==2,oldAlpha=replacing?1-exchange:1,drift=replacing?exchange*70:0;
  if(oldAlpha>.001)s+=`<g data-corona-protein="${i}" opacity="${oldAlpha}">`+prot(x+drift*Math.cos(a),y+drift*Math.sin(a),.10,0,a*180/Math.PI)+'</g>';
  if(replacing&&t>=switchAt){const approach=80*(1-exchange);s+=`<g data-replacement-protein="${i}" opacity="${exchange}">`+prot(cx+(55+approach)*Math.cos(a+.1),cy+(55+approach)*Math.sin(a+.1),.10,i%2?2:5,a*180/Math.PI)+'</g>';}
 }
 if(t>.65){const q=(t-.65)*12,rr=62+20*(.5-.5*Math.cos(q)),a=2.6;s+=prot(cx+rr*Math.cos(a),cy+rr*Math.sin(a),.075,0,q*30);}
 if(encounter>.7)s+=V.p(`M${cx+58} ${cy}Q770 250 790 255`,'none','#8b819f',2);
 s+='</g>';
 s+=V.txt(150,468,T('Globules rouges et protéines plasmatiques','Red blood cells and plasma proteins'),14,'start')+V.txt(800,468,T('Cellule','Cell'),14);
 s+=V.txt(450,500,T('IONP et protéines agrandies pour montrer les échanges.','IONP and proteins enlarged to show exchange.'),14);
 return vsvg(s,900,515);
}

// Qualitative molecular zoom. A 20 nm example IONP and 12 nm cage share one length scale.
function ironStorageScene419(q,cellContext){
 const release=Math.max(0,Math.min(1,(q-.08)/.78)),load=Math.max(0,Math.min(1,(q-.30)/.70));
 const coreR=50*(1-.55*release),cageR=30;
 let s=V.txt(450,34,T('Dissolution des IONPs et stockage du fer','IONP dissolution and iron storage'),23);
 s+=V.txt(200,110,T('IONP · cœur modèle de 20 nm','IONP · 20 nm example core'),17);
 s+=`<circle cx="200" cy="210" r="50" fill="none" stroke="#acb8bf" stroke-dasharray="4 4"/>`;
 s+=`<g data-dissolving-core="true" data-core-radius="${coreR}">`+np(200,210,coreR,false)+'</g>';
 s+=V.txt(200,300,T('Le cœur se dissout progressivement.','The core progressively dissolves.'),15);
 const cages=[[610,185],[745,185],[678,285]];
 for(let i=0;i<cages.length;i++){const[x,y]=cages[i];s+=ferritin(x,y,cageR,Math.max(0,load-i*.12));}
 s+=V.txt(675,90,load===0?T('Apoferritine · coque vide','Apoferritin · empty cage'):T('Ferritine · chargement en fer','Ferritin · iron loading'),19);
 s+=V.txt(675,117,T('Diamètre extérieur ≈ 12 nm','Outer diameter ≈ 12 nm'),15);
 if(q>.08&&q<.97)for(let i=0;i<15;i++){const z=((q-.08)*2+i/15)%1,[tx,ty]=cages[i%3],sx=200+coreR,sy=210,xx=sx+(tx-cageR-sx)*z,yy=sy+(ty-sy)*z+18*Math.sin(Math.PI*z+i);s+=`<circle data-released-iron="${i}" cx="${xx}" cy="${yy}" r="2.2" fill="#bc783e" opacity="${Math.sin(Math.PI*z)}"/>`;}
 s+=V.txt(405,160,T('Fer libéré','Released iron'),17)+V.txt(405,182,T('dissous / complexé','dissolved / complexed'),14);
 s+=V.txt(675,350,T('Formation d’un cœur minéral ferrique','Formation of a ferric mineral core'),16);
 s+=`<g transform="translate(15 360) scale(.26)" opacity=".72">${cellContext}</g>`;
 s+=V.txt(143,520,T('Contexte endolysosomal','Endolysosomal context'),13);
 s+=V.txt(590,420,T('L’apoferritine est dépourvue de cœur minéral.','Apoferritin has no mineral core.'),16);
 s+=V.txt(590,446,T('La ferritine se charge progressivement.','Ferritin loads progressively.'),16);
 s+=V.txt(590,476,T('La charge en fer peut rester partielle.','Iron loading can remain partial.'),15);
 s+=V.txt(590,515,T('Zoom : tailles initiales comparables ; cages montrées à titre d’exemples.','Zoom: initial sizes to scale; representative storage cages.'),12);
 s+=V.txt(450,550,'Volatron et al., Small 2017 · Bugg et al., Angew. Chem. Int. Ed. 2026',13);
 return s;
}

function normalizeStudyReferences420(body){
 const items=[];
 function formatted(url,label){
  if(!url.startsWith('https://doi.org/'))return studyLink(url,label);
  const doi=url.slice(16),found=Object.values(refs).find(r=>r[1].toLowerCase()===doi.toLowerCase());
  return (found?found[0]:label)+'. '+studyLink(url,'doi: '+doi);
 }
 // Move bibliography-only paragraphs to a common reference block.
 body=body.replace(/<p>([\s\S]*?)<\/p>/g,(whole,inner)=>{
  const links=[...inner.matchAll(/<a href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/g)];
  const residue=inner.replace(/<a[^>]*>[\s\S]*?<\/a>/g,'').replace(/<br\s*\/?>|[\s·.;]|\[\d+\]/g,'');
  if(links.length&&!residue){for(const l of links){const prefix=inner.slice(0,l.index).match(/\[(\d+)\]\s*$/);items.push((prefix?'['+prefix[1]+'] ':'')+formatted(l[1],l[2]));}return '';}
  // Citations at the end of explanatory prose are listed below the inset.
  const cleaned=inner.replace(/<a href="(https:\/\/doi\.org\/[^"]+)"[^>]*>([\s\S]*?)<\/a>/g,(a,url,label)=>{items.push(formatted(url,label));return '';});
  return '<p>'+cleaned+'</p>';
 });
 return body+(items.length?'<section class="study-references"><h4>'+T('Publication de référence','Reference publication')+'</h4><ul>'+[...new Set(items)].map(x=>'<li>'+x+'</li>').join('')+'</ul></section>':'');
}

function compartmentReference436(){return normalizeStudyReferences420('<p>'+T('Une particule endocytée reste dans la lumière d’une vésicule. Elle n’est pas directement dans le cytosol. L’endosome trie les constituants, recycle une partie du contenu et mûrit vers la voie lysosomale.','An endocytosed particle remains inside a vesicle lumen. It is not directly in the cytosol. The endosome sorts components, recycles some cargo and matures toward the lysosomal pathway.')+'</p>'+studyTable([T('Compartiment','Compartment'),T('Fonction et composition','Function and composition'),T('Repères de pH','pH examples')],[
 [T('Endosome précoce','Early endosome'),T('Tri et recyclage. Domaines Rab5 ; récepteurs et macromolécules internalisés.','Sorting and recycling. Rab5 domains; internalized receptors and macromolecules.'),'≈ 6.3 [1]'],
 [T('Endosome tardif','Late endosome'),T('Conversion Rab5 → Rab7. Membranes intraluminales et contenu dirigé vers la dégradation.','Rab5 → Rab7 conversion. Intraluminal membranes and cargo directed toward degradation.'),'≈ 6.0 [1]'],
 [T('Lysosome / endolysosome','Lysosome / endolysosome'),T('Hydrolases acides : protéases, lipases et nucléases. La V-ATPase entretient l’acidité. La membrane sépare ce milieu du cytosol.','Acid hydrolases: proteases, lipases and nucleases. V-ATPase maintains acidity. The membrane separates this environment from the cytosol.'),'≈ 5.5 [1] ; 4.7–4.8 '+T('dans les macrophages de [2]','in the macrophages in [2]')]
 ])+'<p>'+T('Ces repères proviennent de systèmes et méthodes différents. L’acidification est progressive. Le pH varie avec le compartiment et son état fonctionnel.','These examples come from different systems and methods. Acidification is progressive. pH varies with compartment and functional state.')+'</p><h4>'+T('Ions et force ionique','Ions and ionic strength')+'</h4><p>'+T('Dans les cellules J774, Sonawane et Verkman mesurent 20 → 41 mmol·L⁻¹ de Cl⁻ dans des endosomes précoces/de recyclage en environ 10 min. Le pH passe de 6,91 à 6,05. Dans la voie tardive, Cl⁻ passe de 28 à 58 mmol·L⁻¹ entre 1 et 45 min ; le pH passe de 6,85 à 5,20 [3].','In J774 cells, Sonawane and Verkman measure 20 → 41 mmol·L⁻¹ Cl⁻ in early/recycling endosomes over about 10 min. pH falls from 6.91 to 6.05. Along the late pathway, Cl⁻ rises from 28 to 58 mmol·L⁻¹ between 1 and 45 min; pH falls from 6.85 to 5.20 [3].')+'</p><p>'+T('Chakraborty et al. mesurent environ 118 mmol·L⁻¹ de Cl⁻ dans les lysosomes des modèles macrophagiques J774A.1 et THP-1 non traités [4]. Le chlorure contribue au fonctionnement des enzymes et à l’équilibre ionique.','Chakraborty et al. measure about 118 mmol·L⁻¹ Cl⁻ in lysosomes of untreated J774A.1 and THP-1 macrophage models [4]. Chloride contributes to enzyme function and ionic balance.')+'</p><p>'+T('La force ionique dépend de tous les ions : ','Ionic strength depends on all ions: ')+ '<math xmlns="http://www.w3.org/1998/Math/MathML"><mi>I</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>c</mi><mi>i</mi></msub><msubsup><mi>z</mi><mi>i</mi><mn>2</mn></msubsup></math>. '+T('c<sub>i</sub> est la concentration de l’ion i et z<sub>i</sub> son nombre de charge. Le calcul inclut l’ensemble des espèces ioniques. Une solution idéale de NaCl à 150 mmol·L⁻¹ a une force ionique I = 150 mmol·L⁻¹.','c<sub>i</sub> is the concentration of ion i and z<sub>i</sub> its charge number. The calculation includes all ionic species. An ideal 150 mmol·L⁻¹ NaCl solution has ionic strength I = 150 mmol·L⁻¹.')+'</p><p>'+T('Pour les IONPs, le pH, les ligands et les enzymes modifient le revêtement et peuvent favoriser la dissolution du cœur. Le fer libéré rejoint les voies de stockage et de métabolisme. La cinétique dépend du matériau et de la cellule.','For IONPs, pH, ligands and enzymes modify the coating and can promote core dissolution. Released iron enters storage and metabolic pathways. Kinetics depend on the material and cell.')+'</p><p>[1] '+studyLink('https://bionumbers.hms.harvard.edu/bionumber.aspx?id=108100','BioNumbers · BNID 108100 / Paroutis et al., 2004, fig. 1')+'<br>[2] '+studyLink('https://doi.org/10.1073/pnas.75.7.3327','S. Ohkuma, B. Poole, PNAS 1978, 75, 3327–3331')+'<br>[3] '+studyLink('https://doi.org/10.1083/jcb.200211098','N. D. Sonawane, A. S. Verkman, J. Cell Biol. 2003, 160, 1129–1138')+'<br>[4] '+studyLink('https://doi.org/10.7554/eLife.28862','K. Chakraborty et al., eLife 2017, 6, e28862')+'<br>'+studyLink('https://goldbook.iupac.org/terms/view/I03180','IUPAC Gold Book · Ionic strength · I03180')+'<br>'+studyLink('https://doi.org/10.1016/j.cell.2005.06.043','J. Rink et al., Cell 2005, 122, 735–749')+'</p>');}

function coronaAffinity437(){return '<h3>'+T('Du plasma à la couronne des IONPs','From plasma to the IONP corona')+'</h3>'+studyTable([T('Protéines','Proteins'),T('Observations sur des IONPs','Observations on IONPs')],[

 [T('Apolipoprotéines et transferrine','Apolipoproteins and transferrin'),T('Échanges dépendants de la taille et du revêtement des SPIONs (Ashby, 2014).','Exchange depends on SPION size and coating (Ashby, 2014).')],

function coronaThermoDetails437(){return '<h3>'+T('Équilibre et cinétique','Equilibrium and kinetics')+'</h3><p>'+T('Pour des sites identiques indépendants, la fraction occupée suit θ = c<sub>P</sub>/(K<sub>d</sub> + c<sub>P</sub>). c<sub>P</sub> désigne la concentration de protéine libre. Pour une liaison réversible en une étape, K<sub>d</sub> = k<sub>off</sub>/k<sub>on</sub> et le temps de résidence moyen vaut 1/k<sub>off</sub>. Deux systèmes peuvent donc partager K<sub>d</sub> et avoir des échanges différents.','For identical independent sites, the occupied fraction is θ = c<sub>P</sub>/(K<sub>d</sub> + c<sub>P</sub>). c<sub>P</sub> denotes free protein concentration. For reversible one-step binding, K<sub>d</sub> = k<sub>off</sub>/k<sub>on</sub> and mean residence time is 1/k<sub>off</sub>. Two systems can therefore share K<sub>d</sub> while exchanging at different rates.')+'</p><h3>'+T('Effet du milieu sur les IONPs','Medium effects on IONPs')+'</h3><p>'+T('Bychkova et al. étudient l’albumine humaine sur des nanoparticules d’oxyde de fer. Leurs mesures par ITC montrent une dépendance au pH et à la teneur en NaCl. La stabilité du revêtement protéique diminue lorsque le pH passe de 6,0–6,6 à 7,5 et lorsque la teneur en NaCl augmente.','Bychkova et al. study human albumin on iron oxide nanoparticles. Their ITC measurements depend on pH and NaCl content. Protein-coating stability decreases as pH rises from 6.0–6.6 to 7.5 and as NaCl content increases.')+'</p>';}

function evidenceExamples439(){const examples={

const NB_CONTEXT_EQUATIONS445={"L ≈ KScherrer λ / (β cos θ)": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>L</mi><mo>≈</mo><mfrac><mrow><msub><mi>K</mi><mtext>Scherrer</mtext></msub><mi>λ</mi></mrow><mrow><mi>β</mi><mi>cos</mi><mi>θ</mi></mrow></mfrac></mrow></math>", "τN ≈ τ0 exp(Keff V / kBT)": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msub><mi>τ</mi><mtext>N</mtext></msub><mo>≈</mo><msub><mi>τ</mi><mtext>0</mtext></msub><mi>exp</mi><mo>(</mo><mfrac><mrow><msub><mi>K</mi><mtext>eff</mtext></msub><mi>V</mi></mrow><mrow><msub><mi>k</mi><mtext>B</mtext></msub><mi>T</mi></mrow></mfrac><mo>)</mo></mrow></math>", "τB = 3ηVh / kBT": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msub><mi>τ</mi><mtext>B</mtext></msub><mo>=</mo><mfrac><mrow><mn>3</mn><mi>η</mi><msub><mi>V</mi><mtext>h</mtext></msub></mrow><mrow><msub><mi>k</mi><mtext>B</mtext></msub><mi>T</mi></mrow></mfrac></mrow></math>", "τN(TB) = tm": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msub><mi>τ</mi><mtext>N</mtext></msub><mo>(</mo><msub><mi>T</mi><mtext>B</mtext></msub><mo>)</mo><mo>=</mo><msub><mi>t</mi><mtext>m</mtext></msub></mrow></math>", "Ic = ½ Σ ci zi²": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msub><mi>I</mi><mtext>c</mtext></msub><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>c</mi><mtext>i</mtext></msub><msubsup><mi>z</mi><mi>i</mi><mn>2</mn></msubsup></mrow></math>", "dH = kBT / (3πηD)": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msub><mi>d</mi><mtext>H</mtext></msub><mo>=</mo><mfrac><mrow><msub><mi>k</mi><mtext>B</mtext></msub><mi>T</mi></mrow><mrow><mn>3</mn><mi>π</mi><mi>η</mi><mi>D</mi></mrow></mfrac></mrow></math>"};
const NB_CONTEXT={"blocks": {"fr": {"phases": "<div class=\"reference-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Phases et propriétés structurales\"><table class=\"reference-table\"><caption>Phases et propriétés structurales</caption><thead><tr><th scope=\"col\">Phase</th><th scope=\"col\">Formule</th><th scope=\"col\">Structure</th><th scope=\"col\">Maille / nm</th><th scope=\"col\">ρ / g·cm<sup>−3</sup></th><th scope=\"col\">Sites du fer</th><th scope=\"col\">Source</th></tr></thead><tbody><tr><th scope=\"row\">Magnétite</th><td>Fe<sub>3</sub>O<sub>4</sub></td><td>Spinelle inverse ; Fd3̅m</td><td>a = 0.83970(1)</td><td>5.175 (mesurée)</td><td>A : Fe³⁺ ; B : Fe²⁺ + Fe³⁺</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/magnetite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[1]</a></td></tr><tr><th scope=\"row\">Maghémite</th><td>γ-Fe<sub>2</sub>O<sub>3</sub></td><td>Spinelle lacunaire ; cubique ou surstructure tétragonale</td><td>a = 0.83515(22) (cubique)</td><td>4.860 (calculée)</td><td>A : Fe³⁺ ; B : Fe³⁺ + lacunes</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/maghemite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[2]</a> <a class=\"data-cite\" href=\"https://arxiv.org/abs/1005.2370\" target=\"_blank\" rel=\"noopener noreferrer\">[3]</a></td></tr><tr><th scope=\"row\">Hématite</th><td>α-Fe<sub>2</sub>O<sub>3</sub></td><td>Corindon ; R3̅c (axes hexagonaux)</td><td>a = 0.5038(2)<br>c = 1.3772(12)</td><td>5.26 (mesurée)</td><td>Fe³⁺ en coordination octaédrique</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/hematite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[4]</a></td></tr><tr><th scope=\"row\">Wüstite</th><td>Fe<sub>1−x</sub>O</td><td>Type NaCl déficitaire en fer ; Fm3̅m</td><td>a = 0.4296</td><td>5.88 (mesurée)</td><td>Fe surtout octaédrique ; défauts liés à x</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/wustite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[5]</a></td></tr><tr><th scope=\"row\">Goethite</th><td>α-FeOOH</td><td>Orthorhombique ; Pbnm</td><td>a = 0.4608<br>b = 0.9956<br>c = 0.30215</td><td>4.28(1) (mesurée)</td><td>Fe³⁺ octaédrique ; oxyhydroxyde</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/goethite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[6]</a></td></tr></tbody></table></div><p>Les valeurs décrivent les échantillons des fiches citées. La maille dépend de la composition et de la température. Les masses volumiques de la maghémite sont calculées ; les autres valeurs du tableau sont mesurées.</p><div class=\"reference-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Repères magnétiques des spinelles\"><table class=\"reference-table\"><caption>Repères magnétiques des spinelles</caption><thead><tr><th scope=\"col\">Grandeur et condition</th><th scope=\"col\">Magnétite</th><th scope=\"col\">Maghémite</th><th scope=\"col\">Source</th></tr></thead><tbody><tr><th scope=\"row\">Moment ionique idéal, limite 0 K</th><td>4 μ<sub>B</sub> / Fe<sub>3</sub>O<sub>4</sub></td><td>2.5 μ<sub>B</sub> / Fe<sub>2</sub>O<sub>3</sub></td><td><a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">[7]</a></td></tr><tr><th scope=\"row\">σ<sub>s</sub> · modèle ionique à 0 K</th><td>≈ 96.5 A·m<sup>2</sup>·kg<sup>−1</sup></td><td>≈ 87.4 A·m<sup>2</sup>·kg<sup>−1</sup></td><td>Calcul : μN<sub>A</sub>/M<sub>mol</sub> · <a class=\"data-cite\" href=\"https://physics.nist.gov/cuu/pdf/all.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[8]</a></td></tr><tr><th scope=\"row\">σ<sub>s</sub> · repère massif, température ambiante</th><td>≈ 92 A·m<sup>2</sup>·kg<sup>−1</sup></td><td>≈ 74 A·m<sup>2</sup>·kg<sup>−1</sup></td><td><a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">[7]</a></td></tr><tr><th scope=\"row\">M<sub>s</sub> = ρσ<sub>s</sub> · valeur calculée</th><td>≈ 476 kA·m<sup>−1</sup></td><td>≈ 360 kA·m<sup>−1</sup></td><td>ρ du tableau × σ<sub>s</sub></td></tr><tr><th scope=\"row\">|K<sub>1</sub>| · repères massifs</th><td>≈ 13.5 kJ·m<sup>−3</sup></td><td>≈ 4.6 kJ·m<sup>−3</sup></td><td><a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">[9]</a></td></tr><tr><th scope=\"row\">Ordre magnétique</th><td>Ferrimagnétique</td><td>Ferrimagnétique</td><td><a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">[7]</a></td></tr></tbody></table></div><p>Le moment de la maghémite vaut aussi 10/3 μ<sub>B</sub> par unité Fe₈/₃O₄. Le moment indiqué dépend de la formule chimique retenue. K₁ est cubique ; K<sub>eff</sub> décrit une barrière effective de nanoparticule. Les deux ne sont pas interchangeables.</p><p>L’hématite est un antiferromagnétique incliné au-dessus de la transition de Morin ; son faible moment ne correspond pas au ferrimagnétisme d’une spinelle. La wüstite devient antiferromagnétique à basse température. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.78.819.2\" target=\"_blank\" rel=\"noopener noreferrer\">[10]</a> <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.110.1333\" target=\"_blank\" rel=\"noopener noreferrer\">[11]</a></p><p>À 0 K, les valeurs du tableau sont des estimations ioniques idéales. À température ambiante, ce sont des repères de matériaux massifs. Une mesure de nanoparticules doit préciser la taille, la composition, la température, le champ et la masse de normalisation.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Publication de référence</h3><ul class=\"ref-list\"><li>Handbook of Mineralogy, Magnetite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/magnetite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Maghemite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/maghemite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>R. Grau-Crespo et al., Vacancy ordering and electronic structure of γ-Fe₂O₃ (maghemite), 2010. <a class=\"data-cite\" href=\"https://arxiv.org/abs/1005.2370\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Hematite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/hematite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Wüstite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/wustite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Goethite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/goethite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>C. B. de Boer, M. J. Dekkers, Geophys. J. Int. 2001, 144, 481–494. <a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1046/j.0956-540X.2000.01333.x</a></li><li>NIST, CODATA 2022, Fundamental Physical Constants. <a class=\"data-cite\" href=\"https://physics.nist.gov/cuu/pdf/all.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>P. García-Acevedo et al., Adv. Sci. 2023, 10, 2203397. <a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1002/advs.202203397</a></li><li>F. J. Morin, Phys. Rev. 1950, 78, 819–820. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.78.819.2\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1103/PhysRev.78.819.2</a></li><li>W. L. Roth, Phys. Rev. 1958, 110, 1333. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.110.1333\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1103/PhysRev.110.1333</a></li></ul></section><details class=\"study-box\"><summary>Repères thermodynamiques</summary><div class=\"reference-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Thermochimie des solides à 298.15 K\"><table class=\"reference-table\"><caption>Thermochimie des solides à 298.15 K</caption><thead><tr><th scope=\"col\">Phase</th><th scope=\"col\">M<sub>mol</sub> / g·mol<sup>−1</sup></th><th scope=\"col\">Δ<sub>f</sub>H° / kJ·mol<sup>−1</sup></th><th scope=\"col\">S° / J·mol<sup>−1</sup>·K<sup>−1</sup></th><th scope=\"col\">C°<sub>p,m</sub> / J·mol<sup>−1</sup>·K<sup>−1</sup></th><th scope=\"col\">Source</th></tr></thead><tbody><tr><th scope=\"row\">Fe<sub>3</sub>O<sub>4</sub></th><td>231.533</td><td>-1120.89</td><td>145.25</td><td>147.22</td><td><a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1309382&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">NIST</a></td></tr><tr><th scope=\"row\">α-Fe<sub>2</sub>O<sub>3</sub></th><td>159.688</td><td>-825.50</td><td>87.33</td><td>103.78</td><td><a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1317608&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">NIST</a></td></tr><tr><th scope=\"row\">FeO</th><td>71.844</td><td>-272.04</td><td>60.75</td><td>49.93</td><td><a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1345251&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">NIST</a></td></tr></tbody></table></div><p>S° et C°p,m sont calculés avec les coefficients de Shomate NIST à 298.15 K. Les valeurs thermodynamiques tabulées concernent FeO. Les données de l’hématite ne doivent pas être attribuées à la maghémite.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Publication de référence</h3><ul class=\"ref-list\"><li>M. W. Chase, NIST-JANAF Thermochemical Tables, J. Phys. Chem. Ref. Data, Monograph 9, 1998; NIST Chemistry WebBook, magnetite. <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1309382&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>M. W. Chase, NIST-JANAF Thermochemical Tables, J. Phys. Chem. Ref. Data, Monograph 9, 1998; NIST Chemistry WebBook, hematite. <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1317608&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>M. W. Chase, NIST-JANAF Thermochemical Tables, J. Phys. Chem. Ref. Data, Monograph 9, 1998; NIST Chemistry WebBook, FeO. <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1345251&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li></ul></section></details>", "units": "<div aria-label=\"Grandeurs magnétiques et conversions CGS → SI\" class=\"reference-table-wrap\" role=\"region\" tabindex=\"0\"><table class=\"reference-table\"><caption>Grandeurs magnétiques et conversions CGS → SI</caption><thead><tr><th scope=\"col\">Symbole</th><th scope=\"col\">Grandeur</th><th scope=\"col\">Unité SI</th><th scope=\"col\">Conversion</th></tr></thead><tbody><tr><th scope=\"row\">B</th><td>Induction magnétique</td><td>T</td><td>1 G = 10<sup>−4</sup> T</td></tr><tr><th scope=\"row\">H</th><td>Champ magnétique</td><td>A·m<sup>−1</sup></td><td>1 Oe ≈ 10<sup>3</sup>/(4π) A·m<sup>−1</sup></td></tr><tr><th scope=\"row\">μ</th><td>Moment magnétique</td><td>A·m<sup>2</sup></td><td>1 emu = 10<sup>−3</sup> A·m<sup>2</sup></td></tr><tr><th scope=\"row\">M</th><td>Aimantation volumique</td><td>A·m<sup>−1</sup></td><td>1 emu·cm<sup>−3</sup> = 10<sup>3</sup> A·m<sup>−1</sup></td></tr><tr><th scope=\"row\">σ</th><td>Aimantation massique</td><td>A·m<sup>2</sup>·kg<sup>−1</sup></td><td>1 emu·g<sup>−1</sup> = 1 A·m<sup>2</sup>·kg<sup>−1</sup></td></tr><tr><th scope=\"row\">J = μ<sub>0</sub>M</th><td>Polarisation magnétique</td><td>T</td><td>1 emu·cm<sup>−3</sup> pour M donne J ≈ 4π × 10<sup>−4</sup> T</td></tr><tr><th scope=\"row\">χ = M/H</th><td>Susceptibilité volumique, régime linéaire</td><td>1</td><td>χ<sub>SI</sub> ≈ 4πχ<sub>cgs</sub></td></tr><tr><th scope=\"row\">χ<sub>mass</sub></th><td>Susceptibilité massique</td><td>m<sup>3</sup>·kg<sup>−1</sup></td><td>1 cm<sup>3</sup>·g<sup>−1</sup> ≈ 4π × 10<sup>−3</sup> m<sup>3</sup>·kg<sup>−1</sup></td></tr><tr><th scope=\"row\">χ<sub>mol</sub></th><td>Susceptibilité molaire</td><td>m<sup>3</sup>·mol<sup>−1</sup></td><td>1 cm<sup>3</sup>·mol<sup>−1</sup> ≈ 4π × 10<sup>−6</sup> m<sup>3</sup>·mol<sup>−1</sup></td></tr><tr><th scope=\"row\">K, E/V</th><td>Densité d’énergie</td><td>J·m<sup>−3</sup></td><td>1 erg·cm<sup>−3</sup> = 0.1 J·m<sup>−3</sup></td></tr><tr><th scope=\"row\">A</th><td>Rigidité d’échange</td><td>J·m<sup>−1</sup></td><td>1 erg·cm<sup>−1</sup> = 10<sup>−5</sup> J·m<sup>−1</sup></td></tr><tr><th scope=\"row\">Φ</th><td>Flux magnétique</td><td>Wb</td><td>1 Mx = 10<sup>−8</sup> Wb</td></tr><tr><th scope=\"row\">N</th><td>Facteur démagnétisant</td><td>1</td><td>N<sub>SI</sub> = N<sub>cgs</sub>/(4π) si ΣN<sub>cgs</sub> = 4π</td></tr><tr><th scope=\"row\">ℱ</th><td>Force magnétomotrice</td><td>A</td><td>1 Gb ≈ 10/(4π) A</td></tr><tr><th scope=\"row\">4πM (CGS)</th><td>Convention historique pour l’aimantation</td><td>A·m<sup>−1</sup></td><td>1 G ≈ 10<sup>3</sup>/(4π) A·m<sup>−1</sup></td></tr><tr><th scope=\"row\">μ<sub>perm</sub></th><td>Perméabilité absolue</td><td>H·m<sup>−1</sup></td><td>1 (CGS) ≈ 4π × 10<sup>−7</sup> H·m<sup>−1</sup></td></tr><tr><th scope=\"row\">μ<sub>r</sub></th><td>Perméabilité relative</td><td>1</td><td>μ<sub>r,SI</sub> = μ<sub>CGS</sub></td></tr><tr><th scope=\"row\">j = μ<sub>0</sub>μ</th><td>Moment en convention de polarisation</td><td>Wb·m</td><td>1 emu ≈ 4π × 10<sup>−10</sup> Wb·m</td></tr><tr><th scope=\"row\">μ<sub>0</sub>σ</th><td>Polarisation massique</td><td>Wb·m·kg<sup>−1</sup></td><td>1 emu·g<sup>−1</sup> ≈ 4π × 10<sup>−7</sup> Wb·m·kg<sup>−1</sup></td></tr></tbody></table></div><p>B = μ<sub>0</sub>(H + M) ; M = μ/V ; σ = μ/m<sub>sample</sub> ; M = ρσ. Le symbole μ désigne ici un moment, pas une perméabilité. Un champ exprimé en teslas correspond souvent à μ₀H. Dans la matière, B et μ₀H ne sont pas identiques.</p><p>Les susceptibilités CGS utilisent la convention emu. Depuis 2019, μ₀ n’est plus une constante exacte ; les conversions contenant μ₀ sont données ici à la précision usuelle en magnétométrie.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Publication de référence</h3><ul class=\"ref-list\"><li>R. B. Goldfarb, F. R. Fickett, Units for Magnetic Properties, NBS Special Publication 696, 1985. <a class=\"data-cite\" href=\"https://doi.org/10.6028/NBS.SP.696\" rel=\"noopener noreferrer\" target=\"_blank\">Source</a></li><li>R. B. Goldfarb, Units for Magnetic Quantities, 2021, NIST. <a class=\"data-cite\" href=\"https://www.nist.gov/publications/units-magnetic-quantities\" rel=\"noopener noreferrer\" target=\"_blank\">Source</a></li><li>NIST, CODATA 2022, Fundamental Physical Constants. <a class=\"data-cite\" href=\"https://physics.nist.gov/cuu/pdf/all.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Source</a></li></ul></section><p>La notation emu dépend de la grandeur : 1 emu de moment vaut 1 erg/G. La ligne 4πM utilise la convention CGS de l’aimantation. Le symbole μ<sub>perm</sub> distingue ici la perméabilité du moment μ. Les conventions j et μ₀σ sont conservées pour lire les anciennes publications.</p>", "anisotropy": "<h3>K₁ et K effectif</h3><p>Pour une spinelle cubique, E/V = K₁(α₁²α₂² + α₂²α₃² + α₃²α₁²) + K₂α₁²α₂²α₃². Les αᵢ sont les cosinus directeurs du moment. Pour un modèle uniaxial, E/V = K sin²θ. Ces expressions ne décrivent pas la même symétrie.</p><p>Les valeurs |K₁| ≈ 13,5 kJ·m⁻³ pour la magnétite et ≈ 4,6 kJ·m⁻³ pour la maghémite sont des repères pour le matériau massif. La surface, la forme et les interactions modifient la barrière.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Publication de référence</h3><ul class=\"ref-list\"><li>P. García-Acevedo et al., Adv. Sci. 2023, 10, 2203397. <a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1002/advs.202203397</a></li><li>Z. Kąkol, J. M. Honig, Phys. Rev. B 1989, 40, 9090. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRevB.40.9090\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1103/PhysRevB.40.9090</a></li></ul></section>", "monodomain": "<h3>Longueurs caractéristiques</h3><p>ℓ<sub>ex</sub> = √[2A/(μ<sub>0</sub>M<sub>s</sub>²)]. Cette longueur compare échange et énergie démagnétisante. Pour une paroi de Bloch uniaxiale idéale, δ = π√(A/K). Le rayon monodomaine et le rayon de rotation cohérente dépendent aussi de la géométrie.</p><p>Un rayon de blocage doit préciser T, K, τ₀ et le temps de mesure. Ce n’est pas une constante propre à un oxyde.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Publication de référence</h3><ul class=\"ref-list\"><li>P. García-Acevedo et al., Adv. Sci. 2023, 10, 2203397. <a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1002/advs.202203397</a></li></ul></section><p><a href=\"https://math.nist.gov/~MDonahue/talks/mcsd20030916-exchange-a4.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">M. J. Donahue, NIST — Exchange length</a></p>"}, "en": {"phases": "<div class=\"reference-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Phases and structural properties\"><table class=\"reference-table\"><caption>Phases and structural properties</caption><thead><tr><th scope=\"col\">Phase</th><th scope=\"col\">Formula</th><th scope=\"col\">Structure</th><th scope=\"col\">Cell / nm</th><th scope=\"col\">ρ / g·cm<sup>−3</sup></th><th scope=\"col\">Iron sites</th><th scope=\"col\">Source</th></tr></thead><tbody><tr><th scope=\"row\">Magnetite</th><td>Fe<sub>3</sub>O<sub>4</sub></td><td>Inverse spinel; Fd3̅m</td><td>a = 0.83970(1)</td><td>5.175 (measured)</td><td>A: Fe³⁺; B: Fe²⁺ + Fe³⁺</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/magnetite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[1]</a></td></tr><tr><th scope=\"row\">Maghemite</th><td>γ-Fe<sub>2</sub>O<sub>3</sub></td><td>Vacancy spinel; cubic or tetragonal superstructure</td><td>a = 0.83515(22) (cubic)</td><td>4.860 (calculated)</td><td>A: Fe³⁺; B: Fe³⁺ + vacancies</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/maghemite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[2]</a> <a class=\"data-cite\" href=\"https://arxiv.org/abs/1005.2370\" target=\"_blank\" rel=\"noopener noreferrer\">[3]</a></td></tr><tr><th scope=\"row\">Hematite</th><td>α-Fe<sub>2</sub>O<sub>3</sub></td><td>Corundum; R3̅c (hexagonal axes)</td><td>a = 0.5038(2)<br>c = 1.3772(12)</td><td>5.26 (measured)</td><td>Octahedrally coordinated Fe³⁺</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/hematite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[4]</a></td></tr><tr><th scope=\"row\">Wüstite</th><td>Fe<sub>1−x</sub>O</td><td>Iron-deficient rocksalt; Fm3̅m</td><td>a = 0.4296</td><td>5.88 (measured)</td><td>Mainly octahedral Fe; defects depend on x</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/wustite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[5]</a></td></tr><tr><th scope=\"row\">Goethite</th><td>α-FeOOH</td><td>Orthorhombic; Pbnm</td><td>a = 0.4608<br>b = 0.9956<br>c = 0.30215</td><td>4.28(1) (measured)</td><td>Octahedral Fe³⁺; oxyhydroxide</td><td><a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/goethite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[6]</a></td></tr></tbody></table></div><p>Values describe the samples in the cited records. Cell parameters depend on composition and temperature. The maghemite density is calculated; the other tabulated densities are measured.</p><div class=\"reference-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Magnetic reference values for spinels\"><table class=\"reference-table\"><caption>Magnetic reference values for spinels</caption><thead><tr><th scope=\"col\">Quantity and condition</th><th scope=\"col\">Magnetite</th><th scope=\"col\">Maghemite</th><th scope=\"col\">Source</th></tr></thead><tbody><tr><th scope=\"row\">Ideal ionic moment, 0 K limit</th><td>4 μ<sub>B</sub> / Fe<sub>3</sub>O<sub>4</sub></td><td>2.5 μ<sub>B</sub> / Fe<sub>2</sub>O<sub>3</sub></td><td><a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">[7]</a></td></tr><tr><th scope=\"row\">σ<sub>s</sub> · ionic model at 0 K</th><td>≈ 96.5 A·m<sup>2</sup>·kg<sup>−1</sup></td><td>≈ 87.4 A·m<sup>2</sup>·kg<sup>−1</sup></td><td>Calculated: μN<sub>A</sub>/M<sub>mol</sub> · <a class=\"data-cite\" href=\"https://physics.nist.gov/cuu/pdf/all.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">[8]</a></td></tr><tr><th scope=\"row\">σ<sub>s</sub> · bulk reference, room temperature</th><td>≈ 92 A·m<sup>2</sup>·kg<sup>−1</sup></td><td>≈ 74 A·m<sup>2</sup>·kg<sup>−1</sup></td><td><a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">[7]</a></td></tr><tr><th scope=\"row\">M<sub>s</sub> = ρσ<sub>s</sub> · calculated value</th><td>≈ 476 kA·m<sup>−1</sup></td><td>≈ 360 kA·m<sup>−1</sup></td><td>Table density × σ<sub>s</sub></td></tr><tr><th scope=\"row\">|K<sub>1</sub>| · bulk reference magnitudes</th><td>≈ 13.5 kJ·m<sup>−3</sup></td><td>≈ 4.6 kJ·m<sup>−3</sup></td><td><a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">[9]</a></td></tr><tr><th scope=\"row\">Magnetic order</th><td>Ferrimagnetic</td><td>Ferrimagnetic</td><td><a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">[7]</a></td></tr></tbody></table></div><p>The maghemite moment also equals 10/3 μ<sub>B</sub> per Fe₈/₃O₄ unit. The stated moment depends on the selected chemical formula. K₁ is cubic; K<sub>eff</sub> describes an effective nanoparticle barrier. They are not interchangeable.</p><p>Hematite is a canted antiferromagnet above the Morin transition; its weak moment differs from spinel ferrimagnetism. Wüstite becomes antiferromagnetic at low temperature. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.78.819.2\" target=\"_blank\" rel=\"noopener noreferrer\">[10]</a> <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.110.1333\" target=\"_blank\" rel=\"noopener noreferrer\">[11]</a></p><p>At 0 K, tabulated values are ideal ionic estimates. At room temperature, they are bulk-material reference values. Nanoparticle measurements require size, composition, temperature, field and normalization mass.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Reference publication</h3><ul class=\"ref-list\"><li>Handbook of Mineralogy, Magnetite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/magnetite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Maghemite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/maghemite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>R. Grau-Crespo et al., Vacancy ordering and electronic structure of γ-Fe₂O₃ (maghemite), 2010. <a class=\"data-cite\" href=\"https://arxiv.org/abs/1005.2370\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Hematite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/hematite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Wüstite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/wustite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>Handbook of Mineralogy, Goethite, Mineral Data Publishing. <a class=\"data-cite\" href=\"https://handbookofmineralogy.org/pdfs/goethite.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>C. B. de Boer, M. J. Dekkers, Geophys. J. Int. 2001, 144, 481–494. <a class=\"data-cite\" href=\"https://doi.org/10.1046/j.0956-540X.2000.01333.x\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1046/j.0956-540X.2000.01333.x</a></li><li>NIST, CODATA 2022, Fundamental Physical Constants. <a class=\"data-cite\" href=\"https://physics.nist.gov/cuu/pdf/all.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>P. García-Acevedo et al., Adv. Sci. 2023, 10, 2203397. <a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1002/advs.202203397</a></li><li>F. J. Morin, Phys. Rev. 1950, 78, 819–820. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.78.819.2\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1103/PhysRev.78.819.2</a></li><li>W. L. Roth, Phys. Rev. 1958, 110, 1333. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRev.110.1333\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1103/PhysRev.110.1333</a></li></ul></section><details class=\"study-box\"><summary>Thermodynamic reference values</summary><div class=\"reference-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Solid-state thermochemistry at 298.15 K\"><table class=\"reference-table\"><caption>Solid-state thermochemistry at 298.15 K</caption><thead><tr><th scope=\"col\">Phase</th><th scope=\"col\">M<sub>mol</sub> / g·mol<sup>−1</sup></th><th scope=\"col\">Δ<sub>f</sub>H° / kJ·mol<sup>−1</sup></th><th scope=\"col\">S° / J·mol<sup>−1</sup>·K<sup>−1</sup></th><th scope=\"col\">C°<sub>p,m</sub> / J·mol<sup>−1</sup>·K<sup>−1</sup></th><th scope=\"col\">Source</th></tr></thead><tbody><tr><th scope=\"row\">Fe<sub>3</sub>O<sub>4</sub></th><td>231.533</td><td>-1120.89</td><td>145.25</td><td>147.22</td><td><a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1309382&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">NIST</a></td></tr><tr><th scope=\"row\">α-Fe<sub>2</sub>O<sub>3</sub></th><td>159.688</td><td>-825.50</td><td>87.33</td><td>103.78</td><td><a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1317608&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">NIST</a></td></tr><tr><th scope=\"row\">FeO</th><td>71.844</td><td>-272.04</td><td>60.75</td><td>49.93</td><td><a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1345251&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">NIST</a></td></tr></tbody></table></div><p>S° and C°p,m are calculated from NIST Shomate coefficients at 298.15 K. The tabulated thermodynamic values concern FeO. Hematite data must not be assigned to maghemite.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Reference publication</h3><ul class=\"ref-list\"><li>M. W. Chase, NIST-JANAF Thermochemical Tables, J. Phys. Chem. Ref. Data, Monograph 9, 1998; NIST Chemistry WebBook, magnetite. <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1309382&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>M. W. Chase, NIST-JANAF Thermochemical Tables, J. Phys. Chem. Ref. Data, Monograph 9, 1998; NIST Chemistry WebBook, hematite. <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1317608&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li><li>M. W. Chase, NIST-JANAF Thermochemical Tables, J. Phys. Chem. Ref. Data, Monograph 9, 1998; NIST Chemistry WebBook, FeO. <a class=\"data-cite\" href=\"https://webbook.nist.gov/cgi/cbook.cgi?ID=C1345251&amp;Mask=2\" target=\"_blank\" rel=\"noopener noreferrer\">Source</a></li></ul></section></details>", "units": "<div aria-label=\"Magnetic quantities and CGS → SI conversions\" class=\"reference-table-wrap\" role=\"region\" tabindex=\"0\"><table class=\"reference-table\"><caption>Magnetic quantities and CGS → SI conversions</caption><thead><tr><th scope=\"col\">Symbol</th><th scope=\"col\">Quantity</th><th scope=\"col\">SI unit</th><th scope=\"col\">Conversion</th></tr></thead><tbody><tr><th scope=\"row\">B</th><td>Magnetic flux density</td><td>T</td><td>1 G = 10<sup>−4</sup> T</td></tr><tr><th scope=\"row\">H</th><td>Magnetic field strength</td><td>A·m<sup>−1</sup></td><td>1 Oe ≈ 10<sup>3</sup>/(4π) A·m<sup>−1</sup></td></tr><tr><th scope=\"row\">μ</th><td>Magnetic moment</td><td>A·m<sup>2</sup></td><td>1 emu = 10<sup>−3</sup> A·m<sup>2</sup></td></tr><tr><th scope=\"row\">M</th><td>Volume magnetization</td><td>A·m<sup>−1</sup></td><td>1 emu·cm<sup>−3</sup> = 10<sup>3</sup> A·m<sup>−1</sup></td></tr><tr><th scope=\"row\">σ</th><td>Mass magnetization</td><td>A·m<sup>2</sup>·kg<sup>−1</sup></td><td>1 emu·g<sup>−1</sup> = 1 A·m<sup>2</sup>·kg<sup>−1</sup></td></tr><tr><th scope=\"row\">J = μ<sub>0</sub>M</th><td>Magnetic polarization</td><td>T</td><td>1 emu·cm<sup>−3</sup> for M gives J ≈ 4π × 10<sup>−4</sup> T</td></tr><tr><th scope=\"row\">χ = M/H</th><td>Volume susceptibility, linear regime</td><td>1</td><td>χ<sub>SI</sub> ≈ 4πχ<sub>cgs</sub></td></tr><tr><th scope=\"row\">χ<sub>mass</sub></th><td>Mass susceptibility</td><td>m<sup>3</sup>·kg<sup>−1</sup></td><td>1 cm<sup>3</sup>·g<sup>−1</sup> ≈ 4π × 10<sup>−3</sup> m<sup>3</sup>·kg<sup>−1</sup></td></tr><tr><th scope=\"row\">χ<sub>mol</sub></th><td>Molar susceptibility</td><td>m<sup>3</sup>·mol<sup>−1</sup></td><td>1 cm<sup>3</sup>·mol<sup>−1</sup> ≈ 4π × 10<sup>−6</sup> m<sup>3</sup>·mol<sup>−1</sup></td></tr><tr><th scope=\"row\">K, E/V</th><td>Energy density</td><td>J·m<sup>−3</sup></td><td>1 erg·cm<sup>−3</sup> = 0.1 J·m<sup>−3</sup></td></tr><tr><th scope=\"row\">A</th><td>Exchange stiffness</td><td>J·m<sup>−1</sup></td><td>1 erg·cm<sup>−1</sup> = 10<sup>−5</sup> J·m<sup>−1</sup></td></tr><tr><th scope=\"row\">Φ</th><td>Magnetic flux</td><td>Wb</td><td>1 Mx = 10<sup>−8</sup> Wb</td></tr><tr><th scope=\"row\">N</th><td>Demagnetizing factor</td><td>1</td><td>N<sub>SI</sub> = N<sub>cgs</sub>/(4π) if ΣN<sub>cgs</sub> = 4π</td></tr><tr><th scope=\"row\">ℱ</th><td>Magnetomotive force</td><td>A</td><td>1 Gb ≈ 10/(4π) A</td></tr><tr><th scope=\"row\">4πM (CGS)</th><td>Historical magnetization convention</td><td>A·m<sup>−1</sup></td><td>1 G ≈ 10<sup>3</sup>/(4π) A·m<sup>−1</sup></td></tr><tr><th scope=\"row\">μ<sub>perm</sub></th><td>Absolute permeability</td><td>H·m<sup>−1</sup></td><td>1 (CGS) ≈ 4π × 10<sup>−7</sup> H·m<sup>−1</sup></td></tr><tr><th scope=\"row\">μ<sub>r</sub></th><td>Relative permeability</td><td>1</td><td>μ<sub>r,SI</sub> = μ<sub>CGS</sub></td></tr><tr><th scope=\"row\">j = μ<sub>0</sub>μ</th><td>Moment in polarization convention</td><td>Wb·m</td><td>1 emu ≈ 4π × 10<sup>−10</sup> Wb·m</td></tr><tr><th scope=\"row\">μ<sub>0</sub>σ</th><td>Mass polarization</td><td>Wb·m·kg<sup>−1</sup></td><td>1 emu·g<sup>−1</sup> ≈ 4π × 10<sup>−7</sup> Wb·m·kg<sup>−1</sup></td></tr></tbody></table></div><p>B = μ<sub>0</sub>(H + M) ; M = μ/V ; σ = μ/m<sub>sample</sub> ; M = ρσ. Here μ denotes a moment, not permeability. A field expressed in teslas often means μ₀H. Inside matter, B and μ₀H are not identical.</p><p>CGS susceptibilities use the emu convention. Since 2019, μ₀ is no longer exact; conversions involving μ₀ are given here at practical magnetometry precision.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Reference publication</h3><ul class=\"ref-list\"><li>R. B. Goldfarb, F. R. Fickett, Units for Magnetic Properties, NBS Special Publication 696, 1985. <a class=\"data-cite\" href=\"https://doi.org/10.6028/NBS.SP.696\" rel=\"noopener noreferrer\" target=\"_blank\">Source</a></li><li>R. B. Goldfarb, Units for Magnetic Quantities, 2021, NIST. <a class=\"data-cite\" href=\"https://www.nist.gov/publications/units-magnetic-quantities\" rel=\"noopener noreferrer\" target=\"_blank\">Source</a></li><li>NIST, CODATA 2022, Fundamental Physical Constants. <a class=\"data-cite\" href=\"https://physics.nist.gov/cuu/pdf/all.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Source</a></li></ul></section><p>The emu notation depends on the quantity: 1 emu of moment equals 1 erg/G. The 4πM row uses the CGS magnetization convention. Here μ<sub>perm</sub> distinguishes permeability from moment μ. The j and μ₀σ conventions help interpret older publications.</p>", "anisotropy": "<h3>K₁ and effective K</h3><p>For a cubic spinel, E/V = K₁(α₁²α₂² + α₂²α₃² + α₃²α₁²) + K₂α₁²α₂²α₃². The αᵢ are direction cosines of the moment. For a uniaxial model, E/V = K sin²θ. These expressions describe different symmetries.</p><p>Bulk reference magnitudes are |K₁| ≈ 13.5 kJ·m⁻³ for magnetite and ≈ 4.6 kJ·m⁻³ for maghemite. Surface, shape and interactions modify the barrier.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Reference publication</h3><ul class=\"ref-list\"><li>P. García-Acevedo et al., Adv. Sci. 2023, 10, 2203397. <a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1002/advs.202203397</a></li><li>Z. Kąkol, J. M. Honig, Phys. Rev. B 1989, 40, 9090. <a class=\"data-cite\" href=\"https://doi.org/10.1103/PhysRevB.40.9090\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1103/PhysRevB.40.9090</a></li></ul></section>", "monodomain": "<h3>Characteristic lengths</h3><p>ℓ<sub>ex</sub> = √[2A/(μ<sub>0</sub>M<sub>s</sub>²)]. This length compares exchange and demagnetizing energies. For an ideal uniaxial Bloch wall, δ = π√(A/K). Single-domain and coherent-rotation radii also depend on geometry.</p><p>A blocking radius requires T, K, τ₀ and measurement time. It is not an oxide-specific constant.</p><section class=\"ref-block\"><h3 class=\"ref-heading\">Reference publication</h3><ul class=\"ref-list\"><li>P. García-Acevedo et al., Adv. Sci. 2023, 10, 2203397. <a class=\"data-cite\" href=\"https://doi.org/10.1002/advs.202203397\" target=\"_blank\" rel=\"noopener noreferrer\">doi: 10.1002/advs.202203397</a></li></ul></section><p><a href=\"https://math.nist.gov/~MDonahue/talks/mcsd20030916-exchange-a4.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">M. J. Donahue, NIST — Exchange length</a></p>"}}, "records": [{"id": "lattice", "category": "structure", "name": ["Paramètre de maille", "Lattice parameter"], "symbol": "a", "unit": "Å", "value": "8.3941", "conditions": ["Magnétite, entrée COD 9007644. Valeur propre à cette structure ; température non précisée sur la fiche consultée.", "Magnetite, COD 9007644. Entry-specific value; temperature not stated on the inspected card."], "references": ["cod"], "status": "measured", "checked": "2026-10-27"}, {"id": "cell-volume", "category": "structure", "name": ["Volume de maille", "Unit-cell volume"], "symbol": "Vcell", "unit": "Å³", "value": "591.456", "conditions": ["Même entrée cristallographique ; ne pas confondre maille et nanoparticule.", "Same crystallographic entry; unit-cell volume is not nanoparticle volume."], "references": ["cod"], "status": "measured", "checked": "2026-10-27"}, {"id": "spacegroup", "category": "structure", "name": ["Groupe d’espace", "Space group"], "symbol": "Fd3̅m", "unit": "—", "value": "227", "conditions": ["Magnétite de l’entrée COD ; description cubique, choix d’origine 2.", "Magnetite in this COD entry; cubic description, origin choice 2."], "references": ["cod"], "status": "measured", "checked": "2026-10-27"}, {"id": "stoich", "category": "structure", "name": ["Stœchiométrie et oxydation", "Stoichiometry and oxidation"], "symbol": "Fe₃₋ₓO₄", "unit": "—", "value": "0 ≤ x ≤ 1/3", "conditions": ["Écriture de la série magnétite–maghémite. La diffraction et la spectroscopie caractérisent la phase.", "Magnetite–maghemite series notation. Diffracti const CORONA_DETAILS437=["<h3>Du plasma à la couronne des IONPs</h3><details><summary>Albumine et immunoglobulines</summary><p>La concentration et la compétition modifient leur adsorption. </p></details><details><summary>Apolipoprotéines et transferrine</summary><p>Ashby et al. comparent des SPIONs de tailles et revêtements différents dans du sérum humain, notamment déplété. ApoA-I et la transferrine présentent des comportements dépendants de la particule. La transferrine stablement liée favorise davantage l’entrée cellulaire dans leur essai.</p></details><details><summary>Complément</summary><p>Chen et al. montrent la fixation et l’échange dynamique du complément sur la couronne de nanostructures d’oxyde de fer revêtues de dextrane. La présence de C3 documente une interaction avec le complément.</p></details><details><summary>Fibrinogène et reconnaissance d’une cible</summary><p>Jacqmarcq et al. montrent le rôle du fibrinogène dans la couronne d’assemblages oxyde de fer–polydopamine pour la reconnaissance de microthrombi. Ce résultat illustre une fonction de la couronne liée au revêtement.</p></details><h3>Affinité, enrichissement et temps de résidence</h3><p>L’affinité est définie pour un couple protéine–surface et des conditions données. Un K<sub>d</sub> demande une mesure d’équilibre. Une analyse protéomique mesure une composition après un protocole de séparation. L’affinité est étudiée par des mesures d’équilibre. Le temps de résidence décrit encore une autre propriété.</p>", "<h3>From plasma to the IONP corona</h3><details><summary>Albumin and immunoglobulins</summary><p>Concentration and competition affect adsorption. </p></details><details><summary>Apolipoproteins and transferrin</summary><p>Ashby et al. compare SPION sizes and coatings in human serum, including depleted serum. ApoA-I and transferrin show particle-dependent behaviour. Stably bound transferrin promotes more uptake in their assay.</p></details><details><summary>Complement</summary><p>Chen et al. demonstrate complement binding and dynamic exchange on the corona of dextran-coated iron oxide nanostructures. C3 presence documents an interaction with complement.</p></details><details><summary>Fibrinogen and target recognition</summary><p>Jacqmarcq et al. show the role of fibrinogen in the corona of iron oxide–polydopamine assemblies for microthrombus recognition. This result illustrates a coating-dependent corona function.</p></details><h3>Affinity, enrichment and residence time</h3><p>Affinity is defined for a protein–surface pair under specified conditions. A K<sub>d</sub> requires an equilibrium measurement. Proteomics measures composition after a separation protocol. Affinity is studied through equilibrium measurements. Residence time describes a different property.</p>"];

const PLASMA_REFERENCE={"a": 2, "kind": "reading", "static": true, "n": ["Cartographie du plasma", "Plasma map"], "lead": ["Abondance, adsorption et échanges sont trois propriétés distinctes.", "Abundance, adsorption and exchange are distinct properties."], "body": ["<div class=\"reading-overview\"><section><h3>Abondance</h3><p>L’albumine est la protéine plasmatique la plus abondante. Les immunoglobulines, le fibrinogène et les protéines de transport participent aussi aux interactions avec les nanoparticules.</p></section><section><h3>Adsorption</h3><p>La composition de la couronne dépend de la surface et du milieu. </p></section><section><h3>Échanges</h3><p>La concentration, l’affinité et les vitesses d’échange décrivent des propriétés différentes. La protéomique mesure la composition de la couronne après séparation.</p></section></div>", "<div class=\"reading-overview\"><section><h3>Abundance</h3><p>Albumin is the most abundant plasma protein. Immunoglobulins, fibrinogen and transport proteins also interact with nanoparticles.</p></section><section><h3>Adsorption</h3><p>Corona composition depends on the surface and medium. </p></section><section><h3>Exchange</h3><p>Concentration, affinity and exchange rates describe different properties. Proteomics measures corona composition after separation.</p></section></div>"], "steps": [], "refs": ["schenk2008"], "limits": ["", ""], "extendedBody": ["<div class=\"text-module\"><h3>Protéines abondantes : repères de concentration</h3><p>Plasma humain. Intervalles en g·L⁻¹, compilés par Schenk et al. (2008), tableau 3. Les masses des précurseurs ne servent pas à calculer des fractions moléculaires. α₂-macroglobuline : hommes adultes.</p><p class=\"plasma-total\">Barre entière = 100 % des protéines · total de référence : 70 g·L⁻¹</p><div class=\"plasma-map\"><div class=\"plasma-row\"><strong>Albumine</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"193.1429\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"130.0000\" x=\"0\" y=\"4\"></rect></svg><span>35–52<small>≈ 50–74,29 %</small></span></div><div class=\"plasma-row\"><strong>Fibrinogène</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"14.8571\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"7.4286\" x=\"0\" y=\"4\"></rect></svg><span>2–4<small>≈ 2,86–5,71 %</small></span></div><div class=\"plasma-row\"><strong>α₂-macroglobuline</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"14.8571\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"3.3429\" x=\"0\" y=\"4\"></rect></svg><span>0,9–4<small>≈ 1,29–5,71 %</small></span></div><div class=\"plasma-row\"><strong>α₁-antitrypsine</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"7.4286\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"2.8971\" x=\"0\" y=\"4\"></rect></svg><span>0,78–2<small>≈ 1,11–2,86 %</small></span></div><div class=\"plasma-row\"><strong>Haptoglobine</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"8.1714\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"1.1143\" x=\"0\" y=\"4\"></rect></svg><span>0,3–2,2<small>≈ 0,43–3,14 %</small></span></div><div class=\"plasma-row\"><strong>Transthyrétine</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"1.3000\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"1.0400\" x=\"0\" y=\"4\"></rect></svg><span>0,28–0,35<small>≈ 0,4–0,5 %</small></span></div><div class=\"plasma-row\"><strong>Céruloplasmine</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"2.2286\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"0.5571\" x=\"0\" y=\"4\"></rect></svg><span>0,15–0,6<small>≈ 0,21–0,86 %</small></span></div><div class=\"plasma-row\"><strong>Prothrombine</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"0.3714\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"0.3714\" x=\"0\" y=\"4\"></rect></svg><span>0,1<small>≈ 0,14 %</small></span></div></div><div class=\"plasma-legend\"><p><span class=\"legend-swatch lower\"></span><strong>Vert foncé :</strong> de 0 à la borne basse de concentration.</p><p><span class=\"legend-swatch interval\"></span><strong>Vert clair :</strong> intervalle entre les bornes basse et haute.</p><p><span class=\"legend-swatch remainder\"></span><strong>Fond gris :</strong> prolongement de l’échelle jusqu’à 100 %.</p></div><p>Exemple : pour l’albumine, le vert foncé atteint 35 g·L⁻¹ (50 %) et le vert clair prolonge la barre jusqu’à 52 g·L⁻¹ (≈ 74 %).</p><p>Les parts en masse sont calculées par 100 × concentration / 70. Le total de 70 g·L⁻¹ est un repère de représentation, choisi au milieu de l’intervalle de 60–80 g·L⁻¹ du St. Boniface Hospital (≥ 13 ans, population hospitalière au repos). Les pourcentages sont calculés à partir des concentrations massiques de référence. Les intervalles correspondent aux protéines sélectionnées.</p><h3>Immunoglobulines et autres familles</h3><p>Les immunoglobulines occupent aussi une place majeure. Le repère adulte pour les IgG sériques est de 7,67–15,90 g·L⁻¹. Il est présenté séparément des valeurs plasmatiques. Transferrine, apolipoprotéines et complément complètent cette carte fonctionnelle. <a href=\"https://www.mayocliniclabs.com/test-catalog/Overview/800053\" rel=\"noopener noreferrer\" target=\"_blank\">Mayo Clinic · IgG</a>.</p></div>", "<div class=\"text-module\"><h3>Abundant proteins: concentration ranges</h3><p>Human plasma. Ranges in g·L⁻¹ compiled by Schenk et al. (2008), Table 3. Precursor masses are not used to calculate molecular fractions. α₂-macroglobulin: adult men.</p><p class=\"plasma-total\">Full bar = 100% of proteins · reference total: 70 g·L⁻¹</p><div class=\"plasma-map\"><div class=\"plasma-row\"><strong>Albumin</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"193.1429\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"130.0000\" x=\"0\" y=\"4\"></rect></svg><span>35–52<small>≈ 50–74.29 %</small></span></div><div class=\"plasma-row\"><strong>Fibrinogen</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"14.8571\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"7.4286\" x=\"0\" y=\"4\"></rect></svg><span>2–4<small>≈ 2.86–5.71 %</small></span></div><div class=\"plasma-row\"><strong>α₂-macroglobulin</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"14.8571\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"3.3429\" x=\"0\" y=\"4\"></rect></svg><span>0.9–4<small>≈ 1.29–5.71 %</small></span></div><div class=\"plasma-row\"><strong>α₁-antitrypsin</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"7.4286\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"2.8971\" x=\"0\" y=\"4\"></rect></svg><span>0.78–2<small>≈ 1.11–2.86 %</small></span></div><div class=\"plasma-row\"><strong>Haptoglobin</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"8.1714\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"1.1143\" x=\"0\" y=\"4\"></rect></svg><span>0.3–2.2<small>≈ 0.43–3.14 %</small></span></div><div class=\"plasma-row\"><strong>Transthyretin</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"1.3000\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"1.0400\" x=\"0\" y=\"4\"></rect></svg><span>0.28–0.35<small>≈ 0.4–0.5 %</small></span></div><div class=\"plasma-row\"><strong>Ceruloplasmin</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"2.2286\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"0.5571\" x=\"0\" y=\"4\"></rect></svg><span>0.15–0.6<small>≈ 0.21–0.86 %</small></span></div><div class=\"plasma-row\"><strong>Prothrombin</strong><svg aria-hidden=\"true\" focusable=\"false\" viewbox=\"0 0 260 18\"><rect fill=\"#e7eeec\" height=\"10\" rx=\"5\" width=\"260\" x=\"0\" y=\"4\"></rect><rect fill=\"#9ac8bc\" height=\"10\" width=\"0.3714\" x=\"0\" y=\"4\"></rect><rect fill=\"#26796a\" height=\"10\" width=\"0.3714\" x=\"0\" y=\"4\"></rect></svg><span>0.1<small>≈ 0.14 %</small></span></div></div><div class=\"plasma-legend\"><p><span class=\"legend-swatch lower\"></span><strong>Dark green:</strong> from 0 to the lower concentration bound.</p><p><span class=\"legend-swatch interval\"></span><strong>Light green:</strong> interval between the lower and upper bounds.</p><p><span class=\"legend-swatch remainder\"></span><strong>Grey background:</strong> continuation of the scale to 100%.</p></div><p>Example: for albumin, dark green reaches 35 g·L⁻¹ (50%), and light green extends the bar to 52 g·L⁻¹ (≈ 74%).</p><p>Mass shares are calculated as 100 × concentration / 70. The 70 g·L⁻¹ total is a display reference, chosen at the midpoint of the St. Boniface Hospital interval of 60–80 g·L⁻¹ (≥ 13 years, hospital-based recumbent population). Percentages are calculated from reference mass concentrations. Intervals correspond to the selected proteins.</p><h3>Immunoglobulins and other families</h3><p>Immunoglobulins are also major components. The adult serum IgG reference range is 7.67–15.90 g·L⁻¹. It is shown separately from plasma values. Transferrin, apolipoproteins and complement complete this functional map. <a href=\"https://www.mayocliniclabs.com/test-catalog/Overview/800053\" rel=\"noopener noreferrer\" target=\"_blank\">Mayo Clinic · IgG</a>.</p></div>"]};

const D = {"phases":{"a":0,"kind":"reading","static":true,"n":["Oxydes de fer : phases et sites","Iron oxides: phases and sites"],"lead":["La composition et l’occupation des sites relient la structure cristalline aux propriétés magnétiques.","Composition and site occupancy connect crystal structure with magnetic properties."],"body":["<div class=\"reading-overview\"><section><h3>Composition</h3><p>La magnétite Fe₃O₄ contient du Fe²⁺ et du Fe³⁺. La maghémite γ-Fe₂O₃ contient du Fe³⁺ et des lacunes cationiques.</p></section><section><h3>Sites cristallins</h3><p>Les sites A sont tétraédriques. Les sites B sont octaédriques. Dans le modèle idéal de la maghémite, les lacunes occupent un sixième des sites B.</p></section><section><h3>Moment résultant</h3><p>Les moments des sous-réseaux A et B sont opposés et ne se compensent pas. Les deux phases sont ferrimagnétiques. Leur aimantation dépend aussi de la taille, des défauts et de la température.</p></section></div>","<div class=\"reading-overview\"><section><h3>Composition</h3><p>Magnetite Fe₃O₄ contains Fe²⁺ and Fe³⁺. Maghemite γ-Fe₂O₃ contains Fe³⁺ and cation vacancies.</p></section><section><h3>Crystal sites</h3><p>A sites are tetrahedral. B sites are octahedral. In the ideal maghemite model, vacancies occupy one sixth of the B sites.</p></section><section><h3>Net moment</h3><p>A and B sublattice moments oppose each other without cancelling. Both phases are ferrimagnetic. Magnetization also depends on size, defects and temperature.</p></section></div>"],"steps":[],"refs":["fleet1981","greaves1983","shmakov1995","neelferrite1948"],"limits":["",""],"extendedBody":["<div class=\"text-module\"><h3>Deux oxydes à structure spinelle</h3><p>Les oxygènes entourent deux familles de sites du fer. Les sites A sont tétraédriques : quatre oxygènes entourent le cation. Les sites B sont octaédriques : six oxygènes l’entourent.</p><div class=\"phase-table\"><table><thead><tr><th>Composition idéale</th><th>Magnétite · Fe₃O₄</th><th>Maghémite · γ-Fe₂O₃</th></tr></thead><tbody><tr><th>Sites A</th><td>Fe³⁺</td><td>Fe³⁺</td></tr><tr><th>Sites B</th><td>Fe²⁺ + Fe³⁺</td><td>5/3 Fe³⁺ + 1/3 lacune</td></tr><tr><th>Normalisation</th><td>3 Fe pour 4 O</td><td>8/3 Fe pour 4 O</td></tr><tr><th>Lacunes cationiques idéales</th><td>Aucune</td><td>1/6 des sites B</td></tr></tbody></table></div><p>La magnétite est une spinelle inverse. À température ambiante, les sites B portent une valence moyenne mixte. La notation Fe²⁺/Fe³⁺ décrit le bilan de charges. L’oxydation vers la maghémite supprime le Fe²⁺ et crée des lacunes cationiques.</p><h3>Du cristal au ferrimagnétisme</h3><p>Les moments des sous-réseaux A et B sont opposés. Ils ne se compensent pas. Il subsiste un moment résultant : c’est le ferrimagnétisme. <a class=\"data-cite\" href=\"https://goldbook.iupac.org/terms/view/M03690\" rel=\"noopener noreferrer\" target=\"_blank\">IUPAC M03690</a></p><p>Le modèle ionique colinéaire donne 4 μB par Fe₃O₄ pour la magnétite et 10/3 μB par Fe₈/₃O₄ pour la maghémite. Ces bilans utilisent Fe³⁺ haut spin : 5 μB, et Fe²⁺ haut spin : 4 μB. L’aimantation mesurée dépend aussi de la température, des défauts et des surfaces.</p><details><summary>Voir les coordinations issues des coordonnées cristallines</summary><svg aria-label=\"Coordinations du fer dans la magnétite\" role=\"img\" viewbox=\"0 0 900 390\" xmlns=\"http://www.w3.org/2000/svg\"><defs><radialgradient id=\"oxygenPhase\"><stop stop-color=\"#f8e2dd\"></stop><stop offset=\"1\" stop-color=\"#be6a5f\"></stop></radialgradient><radialgradient id=\"ironPhase\"><stop stop-color=\"#c6dceb\"></stop><stop offset=\"1\" stop-color=\"#31579c\"></stop></radialgradient></defs><path d=\"M201.7 281.9L145.7 138.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M201.7 281.9L304.3 180.5\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M201.7 281.9L248.3 139.1\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M145.7 138.6L304.3 180.5\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M145.7 138.6L248.3 139.1\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M304.3 180.5L248.3 139.1\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M225 185L201.7 281.9\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M225 185L145.7 138.6\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M225 185L304.3 180.5\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M225 185L248.3 139.1\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><circle cx=\"304.3\" cy=\"180.5\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"304.3\" y=\"185.5\">O</text><circle cx=\"145.7\" cy=\"138.6\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"145.7\" y=\"143.6\">O</text><circle cx=\"225.0\" cy=\"185.0\" fill=\"url(#ironPhase)\" r=\"22\"></circle><text fill=\"white\" font-size=\"14\" text-anchor=\"middle\" x=\"225.0\" y=\"190.0\">Fe</text><circle cx=\"201.7\" cy=\"281.9\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"201.7\" y=\"286.9\">O</text><circle cx=\"248.3\" cy=\"139.1\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"248.3\" y=\"144.1\">O</text><text fill=\"#243944\" font-size=\"21\" text-anchor=\"middle\" x=\"225\" y=\"48\">Site A · tétraédrique</text><text fill=\"#243944\" font-size=\"17\" text-anchor=\"middle\" x=\"225\" y=\"330\">Fe–O ≈ 1.889 Å · 4 O</text><path d=\"M579.3 233.4L725.9 272.1\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M579.3 233.4L674.1 139.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M579.3 233.4L675.9 230.4\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M579.3 233.4L624.1 97.9\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M725.9 272.1L674.1 139.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M725.9 272.1L675.9 230.4\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M725.9 272.1L770.7 136.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M674.1 139.6L624.1 97.9\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M674.1 139.6L770.7 136.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M675.9 230.4L624.1 97.9\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M675.9 230.4L770.7 136.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M624.1 97.9L770.7 136.6\" fill=\"none\" stroke=\"#b8a7a1\" stroke-width=\"2\"></path><path d=\"M675 185L579.3 233.4\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M675 185L725.9 272.1\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M675 185L674.1 139.6\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M675 185L675.9 230.4\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M675 185L624.1 97.9\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><path d=\"M675 185L770.7 136.6\" stroke=\"#7c8fa1\" stroke-width=\"3\"></path><circle cx=\"674.1\" cy=\"139.6\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"674.1\" y=\"144.6\">O</text><circle cx=\"725.9\" cy=\"272.1\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"725.9\" y=\"277.1\">O</text><circle cx=\"579.3\" cy=\"233.4\" fill=\"url(#oxygenPhase)\" r=\"16\"></circle><text fill=\"#5c302b\" font-size=\"14\" text-anchor=\"middle\" x=\"579.3\" y=\"238.4\">O</text><circle cx=\"675.0\" cy=\"185.0\" fill=\"url(#ironPhase)\" r=\"22\"></circle><text fill=\"white\" font-size=\"14\" text-anchor=\"middle\" x=\"675.0\" y=\"190.0\">Fe</text><circle cx=\"770.7\" cy=\"136.
