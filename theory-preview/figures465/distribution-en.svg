451" y="246" font-size="20">Spleen</text><path d="M455 253C446 255 438 260 425 269" fill="none" stroke="#916a84" stroke-width="2" marker-end="url(#arrow)"/><text x="38" y="367" font-size="20">Kidneys</text><path d="M106 361C163 358 186 340 230 329" fill="none" stroke="#b08761" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="460" font-size="20">Bladder</text><path d="M114 453C189 454 230 445 299 433" fill="none" stroke="#b08761" stroke-width="2" marker-end="url(#arrow)"/><text x="277" y="519" font-size="18">Urine</text><path d="M326 481Q326 495 317 500" fill="none" stroke="#b08761" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="85" width="630" height="218" rx="14" fill="#f5f8f8" stroke="#dce5e7"/><text x="562" y="121" font-size="22">Uptake by the MPS</text><text x="562" y="160" font-size="18">Mononuclear phagocyte system</text><text x="562" y="185" font-size="18">Historically: reticuloendothelial system (RES)</text><text x="562" y="210" font-size="18">Macrophages in liver, spleen and other tissues</text><path d="M430 277C493 288 491 226 539 215" fill="none" stroke="#8b6554" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="325" width="630" height="200" rx="14" fill="#f5f8f8" stroke="#dce5e7"/><text x="562" y="365" font-size="22">Renal route for selected formulations</text><text x="562" y="408" font-size="18">Very small hydrodynamic diameter</text><text x="562" y="433" font-size="18">Renal filtration → ureters → bladder → urine</text><text x="562" y="458" font-size="18">The bladder collects urine; the kidney filters.</text><path d="M395 329C485 330 485 411 540 415" fill="none" stroke="#b08761" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="608" font-size="19">Size, surface, corona and administration route affect distribution.</text><text x="35" y="634" font-size="19">Loss of magnetic signal does not prove iron elimination.</text></g></svg>