phagocytes mononucléés</text><text x="562" y="213" font-family="Arial" font-size="18" fill="#29434e">Anciennement : système réticulo-endothélial (RES)</text><text x="562" y="243" font-family="Arial" font-size="18" fill="#29434e">Macrophages du foie, de la rate et d’autres tissus</text><rect x="540" y="340" width="630" height="190" rx="14" fill="#f5f8f8" stroke="#d7e2e5"/><text x="562" y="377" font-family="Arial" font-size="22" fill="#29434e">Voie rénale pour certaines formulations</text><text x="562" y="418" font-family="Arial" font-size="18" fill="#29434e">Très faible diamètre hydrodynamique</text><text x="562" y="448" font-family="Arial" font-size="18" fill="#29434e">Filtration rénale → uretères → vessie → urines</text><text x="562" y="478" font-family="Arial" font-size="18" fill="#29434e">La vessie collecte l’urine ; le rein assure la filtration.</text><path d="M386 245C467 256 476 200 538 200M383 274C465 279 470 425 538 425" fill="none" stroke="#8a7665" stroke-width="2" marker-end="url(#arrow468)"/><text x="35" y="627" font-family="Arial" font-size="18" fill="#29434e">La taille, la surface, la couronne et la voie d’administration modifient la distribution.</text><text x="35" y="654" font-family="Arial" font-size="18" fill="#29434e">La perte du signal magnétique ne prouve pas l’élimination du fer.</text></g></svg>