<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img"><title>Four distinct steps in IONP-mediated delivery</title><defs><linearGradient id="skin" x1="0" x2="1"><stop stop-color="#e4dfdc"/><stop offset=".45" stop-color="#f4eeea"/><stop offset="1" stop-color="#d6cfcd"/></linearGradient><radialGradient id="organ"><stop stop-color="#bc816e"/><stop offset="1" stop-color="#825447"/></radialGradient><radialGradient id="kidney"><stop stop-color="#d59989"/><stop offset=".65" stop-color="#af6b60"/><stop offset="1" stop-color="#794a47"/></radialGradient><radialGradient id="core" cx="32%" cy="26%"><stop stop-color="#a4bdc8"/><stop offset=".5" stop-color="#527285"/><stop offset="1" stop-color="#192f3c"/></radialGradient><radialGradient id="cyto"><stop stop-color="#f2f5e9"/><stop offset="1" stop-color="#c8ded3"/></radialGradient><radialGradient id="nucleus"><stop stop-color="#e5dcea"/><stop offset="1" stop-color="#b5a7c5"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1200" height="680" fill="#fcfdfd"/><g font-family="Arial,sans-serif" fill="#243c4a"><text x="30" y="38" font-size="25">Du vecteur circulant au composé disponible</text><rect x="20" y="70" width="275" height="445" rx="14" fill="#f5f8f8" stroke="#dce5e7"/><text x="34" y="110" font-size="20">1 · Circulation</text><text x="34" y="442" font-size="14">Le vecteur porte le composé.</text><text x="34" y="463" font-size="14">La couronne se forme dans le sang.</text><path d="M272 540Q300 565 326 540" fill="none" stroke="#4f8190" stroke-width="2" marker-end="url(#arrow)"/><rect x="315" y="70" width="275" height="445" rx="14" fill="#f5f8f8" stroke="#dce5e7"/><text x="329" y="110" font-size="20">2 · Accès au tissu</text><text x="329" y="442" font-size="14">La barrière vasculaire doit être franchie.</text><text x="329" y="463" font-size="14">La voie dépend du tissu et du vecteur.</text><path d="M567 540Q595 565 621 540" fill="none" stroke="#4f8190" stroke-width="2" marker-end="url(#arrow)"/><rect x="610" y="70" width="275" height="445" rx="14" fill="#f5f8f8" stroke="#dce5e7"/><text x="624" y="110" font-size="20">3 · Entrée cellulaire</text><text x="624" y="442" font-size="14">Un ligand peut reconnaître un récepteur.</text><text x="624" y="463" font-size="14">La membrane enveloppe le vecteur.</text><path d="M862 540Q890 565 916 540" fill="none" stroke="#4f8190" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="70" width="275" height="445" rx="14" fill="#f5f8f8" stroke="#dce5e7"/><text x="919" y="110" font-size="20">4 · Libération</text><text x="919" y="442" font-size="14">Le composé quitte son vecteur.</text><text x="919" y="463" font-size="14">Sa disponibilité doit être mesurée.</text><path d="M35 165H280M35 330H280" fill="none" stroke="#bc8b8b" stroke-width="9" /><path d="M35 175H280V320H35Z" fill="#fbeceb" stroke="none" stroke-width="2" /><ellipse cx="86" cy="222" rx="25" ry="13" fill="#b85064" stroke="none"/><ellipse cx="86" cy="220" rx="14" ry="6" fill="#e39ca5" stroke="none"/><ellipse cx="185" cy="255" rx="29" ry="29" fill="#c9dedc" stroke="#93b7ad"/><ellipse cx="185" cy="255" rx="25" ry="25" fill="url(#core)" stroke="#344c5a"/><path d="M214.0 255.0q8.0 0.0 11.0 0.0" fill="none" stroke="#5b9c8b" stroke-width="1" /><path d="M207.21528885045035 273.64084068090966q6.128355544951824 3.2139380484326963 8.426488874308758 7.070663706551931" fill="none" stroke="#5b9c8b" stroke-width="1" /><path d="M190.035797152341 283.559424837354q1.3891854213354433 4.92403876506104 1.9101299543362344 10.832885283134289" fill="none" stroke="#5b9c8b" stroke-width="1" /><path d="M170.5 280.11473670974874q-3.9999999999999982 4.330127018922194 -5.499999999999997 9.526279441628827" fill="none" stroke="#5b9c8b" stroke-width="1" /><path d="M157.74891399720866 264.9185841564444q-7.5175409662872665 1.7101007166283444 -10.3366