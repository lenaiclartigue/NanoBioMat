<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IONPs · Industrial applications · NanoBioMat</title><style>[hidden]{display:none!important}body{font:16px/1.55 system-ui;color:#243944;background:#f5f7fa;margin:0}header,main{max-width:1120px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:18px}a{color:#31579c}h1{font-size:2rem}h2{font-size:1.2rem;margin:10px 0}h3{font-size:.9rem}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{font:inherit;padding:10px 16px;border:1px solid #b9c5d4;border-radius:22px;background:white;cursor:pointer}button[aria-pressed=true]{color:white;background:#7552a0;border-color:#7552a0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:18px}.card{padding:22px;border:1px solid #d2dce7;border-top:4px solid #7552a0;border-radius:12px;background:white}.type{font-size:.86rem;color:#655086}.source{font-size:.9rem;overflow-wrap:anywhere}button:focus-visible,a:focus-visible{outline:3px solid #b66627;outline-offset:4px}h3.ref-heading{font:600 16px/1.35 Arial,Helvetica,sans-serif;color:#173840;margin:18px 0 10px}.ref li,.source{font:14px/1.55 Arial,Helvetica,sans-serif;margin:0 0 9px}.ref a,.source a{color:#175563;text-decoration:underline;text-underline-offset:3px}.industry-photo{margin:16px 0}.industry-photo img{width:100%;max-height:240px;object-fit:contain}.industry-photo figcaption{font:12px/1.5 Arial;color:#66717a}.industry-photo a{color:#1769aa}</style></head><body><header><a id="back" href="index.html">NanoBioMat · Resources</a><a id="lang" href="?lang=fr">FR</a></header><main><h1 id="title"></h1><p id="lead"></p><div class="tools" id="filters" aria-label="Filter"></div><p id="count" aria-live="polite"></p><div class="cards" id="cards"></div></main><script>
const fr=new URLSearchParams(location.search).get('lang')==='fr',i=fr?0:1,t=(a,b)=>fr?a:b;document.documentElement.lang=fr?'fr':'en';document.getElementById('title').textContent=t('IONPs : applications et développements industriels','IONPs: industrial applications and development');document.getElementById('lead').textContent=t('Formulations, technologies et statuts documentés. Sources consultées le 29 octobre 2026.','Documented formulations, technologies and statuses. Sources consulted on 29 October 2026.');document.getElementById('back').href='index.html?lang='+(fr?'fr':'en')+'#applications/industry';document.getElementById('back').textContent=t('Applications biomédicales','Biomedical applications');document.getElementById('lang').textContent=fr?'EN':'FR';document.getElementById('lang').href='?lang='+(fr?'en':'fr');
const groups={all:t('Tout','All'),clinical:t('Usages cliniques documentés','Documented clinical uses'),development:t('Développement','Development'),research:t('Outils de recherche','Research tools'),historical:t('Repères historiques','Historical examples')};let data=[],active='all';function render(){document.getElementById('filters').innerHTML=Object.entries(groups).map(([k,v])=>`<button data-filter="${k}" aria-pressed="${k===active}">${v}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{active=b.dataset.filter;render()});let rows=data.filter(x=>active==='all'||x.group===active);document.getElementById('count').textContent=rows.length+t(' fiches',' entries');document.getElementById('cards').innerHTML=rows.map(r=>`<article class="card"><span class="type">${groups[r.group]} · ${r.technology.split(' / ')[i]||r.technology}</span><h2>${r.name}</h2><p>${r.description[i]}</p><h3 class="ref-heading">${t('Publication de référence','Reference publication')}</h3><p class="source"><a href="${r.source}" target="_blank" rel="noopener noreferrer">${r.sourceName}</a></p></article>`).join('')};fetch('industry-data.json').then(r=>{if(!r.ok)throw Error('data');return r.json()}).then(d=>{data=d;render()}).catch(()=>document.getElementById('count').textContent=t('Chargement impossible. Rechargez la page.','Unable to load. Reload the page.'));
</script><script>
