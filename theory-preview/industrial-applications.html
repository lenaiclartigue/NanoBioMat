<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IONPs · Industrial applications · NanoBioMat</title><style>[hidden]{display:none!important}body{font:16px/1.55 system-ui;color:#243944;background:#f5f7fa;margin:0}header,main{max-width:1120px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:18px}a{color:#31579c}h1{font-size:2rem}h2{font-size:1.2rem;margin:10px 0}h3{font-size:.9rem}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{font:inherit;padding:10px 16px;border:1px solid #b9c5d4;border-radius:22px;background:white;cursor:pointer}button[aria-pressed=true]{color:white;background:#7552a0;border-color:#7552a0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:18px}.card{padding:22px;border:1px solid #d2dce7;border-top:4px solid #7552a0;border-radius:12px;background:white}.type{font-size:.86rem;color:#655086}.source{font-size:.9rem;overflow-wrap:anywhere}button:focus-visible,a:focus-visible{outline:3px solid #b66627;outline-offset:4px}h3.ref-heading{font:600 16px/1.35 Arial,Helvetica,sans-serif;color:#173840;margin:18px 0 10px}.ref li,.source{font:14px/1.55 Arial,Helvetica,sans-serif;margin:0 0 9px}.ref a,.source a{color:#175563;text-decoration:underline;text-underline-offset:3px}.industry-photo{margin:16px 0}.industry-photo img{width:100%;max-height:240px;object-fit:contain}.industry-photo figcaption{font:12px/1.5 Arial;color:#66717a}.industry-photo a{color:#1769aa}.application-section{margin:30px 0}.application-title{border-left:5px solid var(--app-color);padding:10px 14px;background:var(--app-bg);font-size:1.25rem}.card{border-top-color:var(--app-color);display:flex;flex-direction:column}.card h3.ref-heading{font-size:13px;color:#66717a;margin-top:auto;padding-top:16px}.card .source{font-size:13px;color:#66717a}.card .source a{color:#1769aa}.type{color:var(--app-color)}.tools button{border-color:var(--app-color,#b9c5d4)}.tools button[aria-pressed=true]{background:var(--app-color,#243944);border-color:var(--app-color,#243944)}.status{font-size:12px;color:#596771;margin:0 0 8px}</style></head><body><header><a id="back" href="index.html">NanoBioMat · Resources</a><a id="lang" href="?lang=fr">FR</a></header><main><h1 id="title"></h1><p id="lead"></p><div class="tools" id="filters" aria-label="Filter"></div><p id="count" aria-live="polite"></p><div id="cards"></div></main><script>
const fr=new URLSearchParams(location.search).get('lang')==='fr',i=fr?0:1,t=(a,b)=>fr?a:b;document.documentElement.lang=fr?'fr':'en';document.getElementById('title').textContent=t('IONPs : applications et développements industriels','IONPs: industrial applications and development');document.getElementById('lead').textContent=t('Formulations, technologies et statuts documentés. Sources consultées le 29 octobre 2026.','Documented formulations, technologies and statuses. Sources consulted on 29 October 2026.');document.getElementById('back').href='index.html?lang='+(fr?'fr':'en')+'#applications/industry';document.getElementById('back').textContent=t('Applications biomédicales','Biomedical applications');document.getElementById('lang').textContent=fr?'EN':'FR';document.getElementById('lang').href='?lang='+(fr?'en':'fr');
const statuses={clinical:t('Usage clinique documenté','Documented clinical use'),development:t('Développement','Development'),research:t('Outil de recherche','Research tool'),historical:t('Repère historique','Historical example')};
const applications={mri:[t('Contraste IRM','MRI contrast'),'#31579c','#edf2fa'],mpi:[t('Imagerie MPI','MPI imaging'),'#72529b','#f3eef8'],heat:[t('Hyperthermie magnétique','Magnetic hyperthermia'),'#a74430','#fff1ec'],detection:[t('Détection magnétique','Magnetic detection'),'#237669','#edf7f3'],separation:[t('Séparation magnétique','Magnetic separation'),'#87621f','#faf5e8'],iron:[t('Supplémentation en fer','Iron replacement'),'#96516c','#fbf0f4'],multi:[t('Particules de recherche multi-applications','Multi-application research particles'),'#506578','#f0f4f7']};
function category(r){return ({'IRM / MRI':'mri','MPI':'mpi','Hyperthermie / Hyperthermia':'heat','Susceptométrie / Susceptometry':'detection','Séparation / Separation':'separation','Fer / Iron':'iron','Traceurs / Tracers':'multi'})[r.technology]||'multi'}
let data=[],active='all';
function render(){
 document.getElementById('filters').innerHTML=`<button data-filter="all" aria-pressed="${active==='all'}">${t('Tout','All')}</button>`+Object.entries(applications).map(([k,v])=>`<button data-filter="${k}" style="--app-color:${v[1]}" aria-pressed="${k===active}">${v[0]}</button>`).join('');
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{active=b.dataset.filter;render()});
 let rows=data.filter(x=>active==='all'||category(x)===active);document.getElementById('count').textContent=rows.length+t(' fiches',' entries');
 document.getElementById('cards').innerHTML=Object.entries(applications).filter(([k])=>rows.some(r=>category(r)===k)).map(([k,v])=>`<section class="application-section" style="--app-color:${v[1]};--app-bg:${v[2]}" aria-labelledby="app-${k}"><h2 class="application-title" id="app-${k}">${v[0]}</h2><div class="cards">${rows.filter(r=>category(r)===k).map(r=>`<article class="card" data-inline-references><span class="type">${r.technology.split(' / ')[i]||r.technology}</span><h3 style="font-size:1.15rem;margin:10px 0">${r.name}</h3><p class="status">${statuses[r.group]}</p><p>${r.description[i]}</p><h3 class="ref-heading">${t('Publication de référence','Reference publication')}</h3><p class="source"><a href="${r.source}" target="_blank" rel="noopener noreferrer">${r.sourceName}</a></p></article>`).join('')}</div></section>`).join('');
};fetch('industry-data.json').then(r=>{if(!r.ok)throw Error('data');return r.json()}).then(d=>{data=d;render()}).catch(()=>document.getElementById('count').textContent=t('Chargement impossible. Rechargez la page.','Unable to load. Reload the page.'));
</script><script>
if(new URLSearchParams(location.search).get('embed')==='1'){
 document.querySelector('header').hidden=true;document.getElementById('title').hidden=true;
 document.body.style.background='white';document.querySelector('main').style.padding='8px 0';
 const report=()=>parent.postMessage({kind:'industry-height463',height:Math.ceil(document.body.getBoundingClientRect().height)+16},location.origin);
 new ResizeObserver(report).observe(document.body);report();
}
</script></body></html>
